blurb:'Growth vs Development, GDP/GNP, Real GNP, Rostow, กลยุทธ์ แผนพัฒนาฯ เศรษฐกิจพอเพียง ทฤษฎีใหม่',
sections:[
{id:'s1', tag:'Growth vs Development', title:'การเจริญเติบโต vs การพัฒนาเศรษฐกิจ', html:`
<div class="cols"><div class="box"><h4>การเจริญเติบโตทางเศรษฐกิจ (Economic Growth)</h4><p>การเพิ่มขึ้นของ<b>รายได้ต่อบุคคลที่แท้จริง</b> วัดจาก Real per capita income<br>= การเปลี่ยนแปลง<b>ทางเศรษฐกิจเท่านั้น</b></p></div>
<div class="box"><h4>การพัฒนาเศรษฐกิจ (Economic Development)</h4><p>กระบวนการที่ทำให้รายได้ที่แท้จริงเฉลี่ยต่อบุคคลเพิ่มขึ้น<b>อย่างต่อเนื่อง</b> มี<b>การกระจายรายได้เป็นธรรม</b> ประชาชนมี<b>คุณภาพชีวิตที่ดี</b><br>= การเปลี่ยนแปลง<b>โครงสร้างทางเศรษฐกิจและสังคม</b></p></div></div>
<div class="formula">การเติบโตทางเศรษฐกิจเป็นเพียง “ส่วนหนึ่ง” ของการพัฒนาเศรษฐกิจ</div>`},
{id:'s2', tag:'เครื่องบ่งชี้และ HDI', title:'เครื่องบ่งชี้ระดับการพัฒนา และ HDI', html:`
<ul class="dots"><li>การเพิ่มขึ้นของรายได้ประชาชาติที่แท้จริงต่อบุคคล</li><li>อายุขัยโดยเฉลี่ยของประชากร</li><li>อัตราการรู้หนังสือ</li><li>ดัชนีการพัฒนามนุษย์ (HDI)</li><li>อัตราการเพิ่มของพลเมือง</li><li>ดัชนีชี้วัดการกระจายรายได้</li></ul>
<h4>HDI (Human Development Index) 3 มิติ</h4>
<div class="tbl"><table><tr><th>มิติ</th><th>วัดจาก</th></tr><tr><td>การมีอายุยืน</td><td>อายุขัยเฉลี่ย</td></tr><tr><td>การศึกษา</td><td>อัตราการอ่านออกเขียนได้ในวัยผู้ใหญ่ · สัดส่วนการเข้าศึกษาในระดับต่าง ๆ</td></tr><tr><td>มาตรฐานการครองชีพ</td><td>GDP ต่อหัวประชากร</td></tr></table></div>
<p><b>SDGs (Sustainable Development Goals)</b> เป้าหมายการพัฒนาที่ยั่งยืน <b>17 เป้าหมาย</b> เช่น ขจัดความยากจน ขจัดความหิวโหย การศึกษาที่มีคุณภาพ ลดความเหลื่อมล้ำ การรับมือการเปลี่ยนแปลงสภาพภูมิอากาศ</p>`},
{id:'s3', tag:'รายได้ประชาชาติ GDP GNP', title:'รายได้ประชาชาติ: GDP และ GNP', html:`
<p><b>รายได้ประชาชาติ (National Income)</b> คือมูลค่าหรือผลรวมของรายได้ประเภทต่าง ๆ ที่พลเมืองได้รับจากการมีส่วนร่วมในการผลิตสินค้าและบริการในรอบระยะเวลาหนึ่ง ตัวชี้วัด: GDP, GNP, GDP per capita (รายได้ต่อหัว)</p>
<div class="cols"><div class="box"><h4>GNP (ผลิตภัณฑ์ประชาชาติเบื้องต้น)</h4><p>มูลค่าตามราคาตลาดของสินค้าและบริการขั้นสุดท้ายที่ผลิตขึ้น<b>ด้วยทรัพยากรของประเทศ</b> (P×Q)<br>GNP ไทย = ผลผลิตที่<b>คนไทย</b>ผลิตได้<b>ทั้งในและต่างประเทศ</b></p></div>
<div class="box"><h4>GDP (ผลิตภัณฑ์ในประเทศเบื้องต้น)</h4><p>มูลค่ารวมของสินค้าและบริการขั้นสุดท้ายที่ผลิตขึ้น<b>ในประเทศ</b><br>GDP ไทย = ผลผลิตที่<b>ชาวไทยและชาวต่างประเทศ</b>ผลิตขึ้น<b>ในประเทศไทย</b></p></div></div>
<div class="memo"><b>เทคนิคจำ</b> GDP = “D-omestic = ในบ้าน” ดู<b>สถานที่</b> · GNP = “N-ational = สัญชาติ” ดู<b>คน</b></div>
<div class="trap"><b>จุดที่มักสับสน</b> คนไทยไปทำงานที่ญี่ปุ่น → นับใน GNP ไทย แต่<b>ไม่</b>นับใน GDP ไทย · บริษัทญี่ปุ่นผลิตรถในไทย → นับใน GDP ไทย แต่ไม่นับใน GNP ไทย</div>`},
{id:'s4', tag:'Nominal vs Real และรายได้ต่อหัว', title:'รายได้ประชาชาติที่เป็นตัวเงิน vs ที่แท้จริง และรายได้ต่อหัว', html:`
<div class="tbl"><table><tr><th>ที่เป็นตัวเงิน (Nominal)</th><th>ที่แท้จริง (Real)</th></tr>
<tr><td>Nominal GDP = Qₜ × Pₜ (ราคาปีที่ t)</td><td>Real GDP = Qₜ × P<sub>ปีฐาน</sub> (ราคาปีฐาน)</td></tr>
<tr><td>Nominal GNP = Qₜ × Pₜ</td><td>Real GNP = Qₜ × P<sub>ปีฐาน</sub></td></tr>
<tr><td>Nominal GDP per capita = (Qₜ × Pₜ) ÷ N</td><td>Real GDP per capita = (Qₜ × P<sub>ปีฐาน</sub>) ÷ N</td></tr></table></div>
<div class="formula">Real GNP = Money GNP × (ดัชนีราคาปีฐาน ÷ ดัชนีราคาปีเดียวกัน) = Money GNP × 100 ÷ ดัชนีราคาปีเดียวกัน</div>
<div class="example"><b>ตัวอย่างจากสไลด์</b> Money GNP = 30,000 ล้านบาท ดัชนีราคา = 120<br>Real GNP = 30,000 × 100 ÷ 120 = <b>25,000 ล้านบาท</b></div>
<div class="formula">รายได้เฉลี่ยต่อบุคคลต่อปี = Real GNP ÷ จำนวนประชากร<small>ใช้เปรียบเทียบฐานะทางเศรษฐกิจระหว่างประเทศ เพราะแต่ละประเทศมีจำนวนประชากรต่างกัน</small></div>`},
{id:'s5', tag:'การคำนวณรายได้ประชาชาติ', title:'การคำนวณรายได้ประชาชาติ 3 ด้าน', html:`
<ol class="steps"><li><b>ด้านผลผลิต</b> คำนวณจากสินค้าและบริการขั้นสุดท้ายที่ซื้อเพื่อการบริโภค</li><li><b>ด้านรายจ่าย</b> GDP = C + I + G + (X − M)<br><span class="muted">C = การบริโภค · I = การลงทุน · G = การใช้จ่ายของรัฐ · X − M = ส่งออกสุทธิ</span></li><li><b>ด้านรายได้</b> (จากการขายปัจจัยการผลิต) GDP = ค่าจ้าง + ค่าเช่า + ดอกเบี้ย + กำไร</li></ol>
<p class="muted">ข้อมูลประกอบ: ประมาณการเศรษฐกิจไทยปี 2565 (สศค.) ขยายตัว 3.5% (ปี 2564 = 1.5%, ปี 2563 = −6.2%) · อัตราการขยายตัว GDP ด้านการใช้จ่าย Q2 สูงสุดคือ Imports 31.4% และ Exports 27.5%</p>`},
{id:'s6', tag:'ปัจจัยและลักษณะประเทศกำลังพัฒนา', title:'ปัจจัยการพัฒนา และลักษณะประเทศกำลังพัฒนา', html:`
<h4>ปัจจัยที่มีอิทธิพลต่อการพัฒนาเศรษฐกิจ</h4><div class="chips"><span>ทรัพยากรมนุษย์</span><span>ทรัพยากรธรรมชาติ</span><span>การสะสมทุน</span><span>ความก้าวหน้าทางเทคโนโลยี</span></div>
<h4>ลักษณะของประเทศกำลังพัฒนา</h4><ul class="dots"><li>ประชากรส่วนใหญ่มีมาตรฐานการครองชีพต่ำ</li><li>มีอัตราการขยายตัวของประชากรสูง</li><li>ขาดความก้าวหน้าทางเทคโนโลยี</li><li>ขาดแคลนเงินออม</li><li>สภาพสังคมไม่เอื้ออำนวยต่อการพัฒนา</li><li>ต้องพึ่งพาและถูกครอบงำจากต่างประเทศ</li></ul>
<div class="tbl"><table><tr><th>Developing</th><th>Developed</th></tr><tr><td>รายได้ต่อหัวต่ำ มาตรฐานครองชีพต่ำ</td><td>รายได้ต่อหัวสูง มาตรฐานครองชีพสูง</td></tr><tr><td>เกษตรเป็นแหล่งจ้างงานหลัก</td><td>แรงงานส่วนใหญ่อยู่ในภาคอุตสาหกรรม</td></tr><tr><td>ประชากรเพิ่มเร็ว ว่างงานสูง</td><td>ประชากรเพิ่มช้า ว่างงานต่ำ</td></tr><tr><td>ออมต่ำ ขาดการสะสมทุน</td><td>ออมสูง สะสมทุนสูง</td></tr><tr><td>ส่งออกสินค้าขั้นปฐม ขาดดุลการค้า</td><td>ส่งออกสินค้าอุตสาหกรรมและบริการ</td></tr></table></div>`},
{id:'s7', tag:'ทฤษฎี Rostow', title:'ทฤษฎีการพัฒนาเศรษฐกิจของ Rostow (5 ขั้น)', html:`
<figure class="fig">${FIG.rostow()}</figure>
<div class="tbl"><table><tr><th>ขั้น</th><th>ลักษณะ</th></tr>${ROS.map((r,i)=>`<tr><td><b>${i+1}. ${r[0]}</b>${i===2?' <span class="examtag">***</span>':''}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<p class="muted">จากกราฟ Structure Change: Underdeveloped → Developing (ประมาณ 1,036 USD) → Developed (ประมาณ 12,235 USD)</p>
<div class="memo"><b>เทคนิคจำ</b> “ดั้งเดิม → เตรียม → เทคออฟ → เร่ง → อุดม” เหมือนเครื่องบิน: จอด (ดั้งเดิม) → เตรียมบิน → ทะยานขึ้น (Take-off ***) → ไต่ระดับ → บินระดับสูงสบาย ๆ</div>`},
{id:'s8', tag:'กลยุทธ์การพัฒนา', title:'กลยุทธ์การพัฒนาเศรษฐกิจ 4 แบบ', html:`
<div class="tbl"><table><tr><th>กลยุทธ์</th><th>สาระสำคัญ</th></tr>${STRAT.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td></tr>`).join('')}</table></div>
<ul class="dots"><li><b>Balance Growth</b>: Big Push → การผลิตสินค้าทุน + โครงการพื้นฐาน (คมนาคม ประปา ไฟฟ้า) → คนมีงานทำ อำนาจซื้อเพิ่ม → ตลาดใหญ่ขึ้นพอให้ลงทุนต่อ</li><li><b>Unbalance Growth</b>: เช่น ส่งเสริมอุตสาหกรรมรถยนต์ → เกิดอุตสาหกรรมชิ้นส่วนรถยนต์ (<b>Backward Linkage</b>) รัฐสนับสนุนบางอุตสาหกรรมเพื่อให้เชื่อมโยงต้นน้ำ-กลางน้ำ-ปลายน้ำ</li><li><b>Import Substitution</b>: อาจนำไปสู่ความสามารถส่งออกที่เพิ่มขึ้น มีเงินตราต่างประเทศเพิ่ม</li><li><b>Dual Economy</b>: ใช้ในประเทศที่ภาคเกษตรกับอุตสาหกรรมต่างกันมาก พัฒนาเกษตรให้เข้าถึงทุนและเทคโนโลยี</li></ul>`},
{id:'s9', tag:'แผนพัฒนาและปัญหาเศรษฐกิจไทย', title:'แผนพัฒนาฯ และปัญหาเศรษฐกิจไทย', html:`
<ul class="dots"><li>เริ่มจัดทำครั้งแรก <b>พ.ศ. 2504</b> หลังสงครามโลกครั้งที่ 2 โดย<b>ธนาคารโลก</b>เสนอแนะแนวทาง</li><li>เอกสารเรียกว่า “<b>แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ</b>” จัดทำโดย <b>สศช.</b> (สำนักงานสภาพัฒนาการเศรษฐกิจและสังคมแห่งชาติ)</li></ul>
<div class="tbl"><table><tr><th>แผน</th><th>จุดเด่น</th></tr>${PLAN.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}</table></div>
<h4>ปัญหาเศรษฐกิจไทย</h4><ol class="steps"><li>กระจายรายได้ไม่เสมอภาค (ปัญหาเรื้อรัง)</li><li>การออมต่ำ ทำให้การลงทุนต่ำ</li><li>ทรัพยากรธรรมชาติและสิ่งแวดล้อมเสื่อมโทรม</li><li>ขาดดุลการค้าและดุลการชำระเงิน</li><li>การว่างงาน</li><li>เงินเฟ้อ</li><li>ขาดแคลนสิ่งอำนวยความสะดวกพื้นฐาน เช่น ถนน ไฟฟ้า</li></ol>
<h4>วิกฤตต้มยำกุ้ง 2540 (สรุปโดย ศปร.)</h4><ol class="steps"><li>การขาดดุลบัญชีเดินสะพัด</li><li>ปัญหาหนี้ต่างประเทศ</li><li>การลงทุนเกินตัว และฟองสบู่อสังหาริมทรัพย์</li><li>ประสิทธิภาพการดำเนินงานของสถาบันการเงิน</li><li>ความไม่มีประสิทธิภาพในการดำเนินนโยบาย</li><li>การโจมตีค่าเงินบาท</li></ol>`},
{id:'s10', tag:'เศรษฐกิจพอเพียงและทฤษฎีใหม่', title:'ปรัชญาเศรษฐกิจพอเพียงและทฤษฎีใหม่', html:`
<blockquote>“…พอเพียง หมายความว่า พอประมาณ ไม่สุดโต่ง ไม่โลภอย่างมาก คนเราก็อยู่เป็นสุข…” <small>พระบรมราโชวาทของพระบาทสมเด็จพระเจ้าอยู่หัวภูมิพลอดุลยเดช ธันวาคม 2541</small></blockquote>
<figure class="fig">${FIG.sep()}</figure>
<div class="formula">3 ห่วง: พอประมาณ · มีเหตุผล · มีภูมิคุ้มกันในตัวที่ดี<small>2 เงื่อนไข: ความรู้ (รอบรู้ รอบคอบ ระมัดระวัง) · คุณธรรม (ซื่อสัตย์สุจริต ขยัน อดทน สติปัญญา แบ่งปัน)<br>นำไปสู่: เศรษฐกิจ/สังคม/สิ่งแวดล้อม/วัฒนธรรม สมดุล พร้อมรับต่อการเปลี่ยนแปลง (ยึดทางสายกลาง)</small></div>
<h4>ทฤษฎีใหม่ 3 ขั้น</h4>
<ol class="steps"><li><b>ขั้นต้น</b> พึ่งตนเองให้มากที่สุด จัดสรรพื้นที่ทำกินและที่อยู่อาศัยเป็น 4 ส่วน <b>30 : 30 : 30 : 10</b></li><li><b>ขั้นกลาง</b> รวมพลัง รวมกลุ่มกัน ร่วมมือกับทุกฝ่าย (เอกชนและภาครัฐ) เช่น โรงสีข้าวชุมชน</li><li><b>ขั้นก้าวหน้า</b> ติดต่อประสานงานกับภายนอกเพื่อหาแหล่งทุน เช่น ธนาคาร ห้างร้านเอกชน มาขยายกิจการและพัฒนาคุณภาพชีวิต</li></ol>

{t:'mc',tag:'กลยุทธ์การพัฒนา',q:'กลยุทธ์ที่ “ส่งเสริมการลงทุนขนานใหญ่ (Big Push)” และพัฒนาเกษตรกับอุตสาหกรรมไปพร้อมกัน คือข้อใด',o:['การเติบโตแบบสมดุล (Balance Growth)','การเติบโตแบบไม่สมดุล','ผลิตเพื่อทดแทนการนำเข้า','พัฒนาระหว่างสาขาการผลิต'],a:0,e:'Balance Growth ใช้ Big Push และพัฒนาภาคเกษตรและอุตสาหกรรมไปพร้อม ๆ กัน'},

{t:'mc',tag:'แผนพัฒนาและปัญหาเศรษฐกิจไทย',q:'แผนพัฒนาฯ ฉบับใดที่อัญเชิญแนวปรัชญาเศรษฐกิจพอเพียงมาเป็นแนวทางในการพัฒนา',o:['ฉบับที่ 9 (พ.ศ. 2545–2549)','ฉบับที่ 8','ฉบับที่ 1','ฉบับที่ 13'],a:0,e:'แผนฯ ฉบับที่ 9 อัญเชิญแนวปรัชญาเศรษฐกิจพอเพียงตามแนวพระราชดำรัสของรัชกาลที่ 9'},

{t:'ms',tag:'แผนพัฒนาและปัญหาเศรษฐกิจไทย',q:'สาเหตุวิกฤตเศรษฐกิจ 2540 (ต้มยำกุ้ง) ตามที่ ศปร. สรุป ได้แก่ข้อใด (เลือกทุกข้อที่ถูก)',o:['การขาดดุลบัญชีเดินสะพัด','การลงทุนเกินตัวและฟองสบู่อสังหาริมทรัพย์','การโจมตีค่าเงินบาท','งบประมาณเกินดุลต่อเนื่อง'],a:[0,1,2],e:'6 สาเหตุ: ขาดดุลบัญชีเดินสะพัด หนี้ต่างประเทศ ลงทุนเกินตัว/ฟองสบู่ ประสิทธิภาพสถาบันการเงิน นโยบายไม่มีประสิทธิภาพ การโจมตีค่าเงินบาท'},
{t:'mc',tag:'เศรษฐกิจพอเพียงและทฤษฎีใหม่',q:'“3 ห่วง” ของปรัชญาเศรษฐกิจพอเพียงคือข้อใด',o:['พอประมาณ มีเหตุผล มีภูมิคุ้มกันในตัวที่ดี','ความรู้ คุณธรรม ความขยัน','ประหยัด อดออม แบ่งปัน','เศรษฐกิจ สังคม สิ่งแวดล้อม'],a:0,e:'3 ห่วง: พอประมาณ มีเหตุผล มีภูมิคุ้มกันในตัวที่ดี'},
{t:'mc',tag:'เศรษฐกิจพอเพียงและทฤษฎีใหม่',q:'“2 เงื่อนไข” ของปรัชญาเศรษฐกิจพอเพียงคือข้อใด',o:['ความรู้ และคุณธรรม','พอประมาณ และมีเหตุผล','เศรษฐกิจ และสังคม','ทุน และแรงงาน'],a:0,e:'เงื่อนไขความรู้ (รอบรู้ รอบคอบ ระมัดระวัง) และเงื่อนไขคุณธรรม (ซื่อสัตย์ ขยัน อดทน สติปัญญา แบ่งปัน)'},
{t:'mc',tag:'เศรษฐกิจพอเพียงและทฤษฎีใหม่',q:'ทฤษฎีใหม่ขั้นต้น จัดสรรพื้นที่ทำกินและที่อยู่อาศัยในสัดส่วนใด',o:['30 : 30 : 30 : 10','25 : 25 : 25 : 25','40 : 30 : 20 : 10','50 : 30 : 10 : 10'],a:0,e:'แหล่งน้ำ 30% นาข้าว 30% ไม้ผล/พืชผัก 30% ที่อยู่อาศัย/เลี้ยงสัตว์ 10%'},
{t:'mc',tag:'เศรษฐกิจพอเพียงและทฤษฎีใหม่',q:'ทฤษฎีใหม่ขั้นกลาง เน้นเรื่องใด',o:['การรวมพลัง รวมกลุ่ม ร่วมมือกับทุกฝ่าย เช่น โรงสีข้าวชุมชน','การพึ่งตนเองโดยแบ่งพื้นที่ 4 ส่วน','การติดต่อธนาคารเพื่อหาแหล่งทุน','การส่งออกสินค้าเกษตร'],a:0,e:'ขั้นที่ 2 ขั้นกลาง: รวมพลัง รวมกลุ่มกัน ร่วมมือกับทุกฝ่าย (เอกชนและภาครัฐ)'},
{t:'mc',tag:'Thailand 4.0 แผน 13 และ SDGs',q:'Thailand 4.0 เน้นการขับเคลื่อนเศรษฐกิจด้วยอะไร',o:['นวัตกรรม (Innovation)','เกษตรกรรม','อุตสาหกรรมเบา','อุตสาหกรรมหนัก'],a:0,e:'1.0 เกษตร → 2.0 อุตสาหกรรมเบา → 3.0 อุตสาหกรรมหนัก/Automation → 4.0 Innovation'},
{t:'mc',tag:'Thailand 4.0 แผน 13 และ SDGs',q:'แผนพัฒนาฯ ฉบับที่ 13 ใช้ช่วงปีใด และมีวิสัยทัศน์อย่างไร',o:['พ.ศ. 2566–2570 “พลิกโฉมประเทศไทยสู่ เศรษฐกิจสร้างคุณค่า สังคมเดินหน้าอย่างยั่งยืน”','พ.ศ. 2560–2564 “ปรัชญาเศรษฐกิจพอเพียง”','พ.ศ. 2545–2549 “คนเป็นศูนย์กลาง”','พ.ศ. 2561–2580 “ยุทธศาสตร์ชาติ”'],a:0,e:'กรอบแผนฯ 13 (2566–2570) Transformation to Hi-Value and Sustainable Thailand'}
],
gens:[
{tag:'Nominal vs Real และรายได้ต่อหัว',f:()=>{const idx=H.pick([80,90,110,120,125,140,150,160,200]);const real=H.R(10,90)*1000;const money=real*idx/100;return{t:'mc',q:`รายได้ประชาชาติที่เป็นตัวเงิน (Money GNP) = ${H.n(money)} ล้านบาท ดัชนีราคาปีเดียวกัน = ${idx} (ปีฐาน = 100) Real GNP เท่ากับเท่าใด`,o:H.opts(H.n(real)+' ล้านบาท',[H.n(Math.round(money*idx/100))+' ล้านบาท',H.n(money-idx)+' ล้านบาท',H.n(Math.round(money/idx))+' ล้านบาท']),a:0,e:`Real GNP = ${H.n(money)} × 100 ÷ ${idx} = ${H.n(real)} ล้านบาท`}}},
{tag:'Nominal vs Real และรายได้ต่อหัว',f:()=>{const pop=H.R(20,80),per=H.R(50,250)*1000;const real=pop*per/1000;return{t:'mc',q:`ประเทศหนึ่งมี Real GNP ${H.n(real*1000)} ล้านบาท และมีประชากร ${pop} ล้านคน รายได้เฉลี่ยต่อบุคคลต่อปีเท่ากับเท่าใด`,o:H.opts(H.n(per)+' บาท',[H.n(per*10)+' บาท',H.n(Math.round(per/10))+' บาท',H.n(per+pop*1000)+' บาท']),a:0,e:`${H.n(real*1000)} ล้านบาท ÷ ${pop} ล้านคน = ${H.n(per)} บาทต่อคน`}}},
{tag:'การคำนวณรายได้ประชาชาติ',f:()=>{const C=H.R(40,70)*100,I=H.R(10,30)*100,G=H.R(10,25)*100,X=H.R(30,70)*100,M=X+H.pick([-1,1])*H.R(1,15)*100,g=C+I+G+X-M;return{t:'mc',q:`กำหนด C = ${H.n(C)}, I = ${H.n(I)}, G = ${H.n(G)}, X = ${H.n(X)}, M = ${H.n(M)} (พันล้านบาท) GDP ด้านรายจ่ายเท่ากับเท่าใด`,o:H.opts(H.n(g),[H.n(C+I+G+X+M),H.n(C+I+G),H.n(C+I+G-X+M)]),a:0,e:`GDP = ${H.n(C)} + ${H.n(I)} + ${H.n(G)} + (${H.n(X)} − ${H.n(M)}) = ${H.n(g)}`}}},
{tag:'การคำนวณรายได้ประชาชาติ',f:()=>{const w=H.R(30,60)*100,r=H.R(5,15)*100,i=H.R(5,15)*100,p=H.R(10,30)*100,t=w+r+i+p;return{t:'mc',q:`ค่าจ้าง ${H.n(w)} ค่าเช่า ${H.n(r)} ดอกเบี้ย ${H.n(i)} กำไร ${H.n(p)} (ล้านบาท) GDP ด้านรายได้เท่ากับเท่าใด`,o:H.opts(H.n(t),[H.n(w+p),H.n(t-r),H.n(w+r+i)]),a:0,e:`GDP ด้านรายได้ = ค่าจ้าง + ค่าเช่า + ดอกเบี้ย + กำไร = ${H.n(t)}`}}},

function bucketsFor(ids){
  const seen=new Set(),buckets=[];
  for(const ch of CH.filter(c=>ids.includes(c.id))){
    const byTag={};
    ch.q.forEach(q=>{const k=q.q;if(seen.has(k))return;seen.add(k);(byTag[q.tag]=byTag[q.tag]||[]).push(Object.assign({ch:ch.id},q));});

    (ch.gens||[]).forEach(g=>{const list=[];let tries=0;while(list.length<30&&tries<90){tries++;let q;try{q=g.f();}catch(e){q=null;}if(!q)continue;const k=q.q;if(seen.has(k))continue;seen.add(k);list.push(Object.assign({ch:ch.id,tag:g.tag,gen:1},q));}if(list.length)buckets.push(list);});
  }
  return buckets;
}
function sample(ids,n){
  const buckets=H.shuffle(bucketsFor(ids));const total=buckets.reduce((a,b)=>a+b.length,0);
  n=Math.min(n,total);const out=[];
  while(out.length<n){let added=false;for(const b of buckets){if(out.length>=n)break;if(b.length){out.push(b.shift());added=true;}}if(!added)break;}
  return {qs:H.shuffle(out).map(prep),total};
}

function prep(q){
  const o={src:q,t:q.t,tag:q.tag,ch:q.ch,q:q.q,e:q.e};
  if(q.t==='mc'){const idx=H.shuffle(q.o.map((_,i)=>i));o.opts=idx.map(i=>q.o[i]);o.ans=idx.indexOf(q.a);}
  else if(q.t==='tf'){o.opts=['ถูก','ผิด'];o.ans=q.a?0:1;}
  else if(q.t==='ms'){const idx=H.shuffle(q.o.map((_,i)=>i));o.opts=idx.map(i=>q.o[i]);o.ans=q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b);}
  else if(q.t==='match'){o.left=q.pairs.map(p=>p[0]);o.right=H.shuffle(q.pairs.map(p=>p[1]));o.ans=q.pairs.map(p=>o.right.indexOf(p[1]));}

}

  <div class="sheet view"><div><div class="eyebrow">${id==='all'?'ทุกบท · 8–13':'บทที่ '+chById(id).num}</div><h1>${id==='all'?'สอบรวมทุกบท':chById(id).title}</h1><p class="muted" style="margin-top:6px">คลังข้อสอบบทนี้สุ่มได้ ${pool} ข้อไม่ซ้ำกัน ระบบดึงคำถามกระจายทุกหัวข้อย่อย</p></div>
  <section class="card countbox"><span class="label">จำนวนข้อ (1–${max})</span>
   <div class="countrow"><input id="cnt" type="number" min="1" max="${max}" value="${n}" inputmode="numeric" aria-label="จำนวนข้อ"><span class="of">ข้อ จากสูงสุด ${max}</span></div>
   <input id="rng" type="range" min="1" max="${max}" value="${n}" aria-label="เลื่อนเลือกจำนวนข้อ">
   <div class="presets">${presets.map(p=>`<button data-act="preset" data-n="${p}" ${p>max?'disabled':''} class="${p===n?'on':''}">${p}</button>`).join('')}</div>
   <p class="hint" id="eta">ใช้เวลาประมาณ ${Math.max(1,Math.round(n*0.75))} นาที</p></section>
  <section><span class="label">โหมด</span><div class="modes">
   <button class="mode ${S.mode==='practice'?'on':''}" data-act="mode" data-m="practice"><span class="rd"></span><span><b>ฝึกทีละข้อ</b><span>ตรวจคำตอบทันทีหลังตอบแต่ละข้อ เห็นเฉลยและคำอธิบายเลย</span></span></button>
   <button class="mode ${S.mode==='exam'?'on':''}" data-act="mode" data-m="exam"><span class="rd"></span><span><b>จำลองสอบ</b><span>ทำครบแล้วค่อยส่ง ย้อนกลับไปแก้คำตอบได้ทุกข้อก่อนส่ง</span></span></button>
  </div></section>
  <button class="btn pri" data-act="start" style="min-height:54px;font-size:17px">${ic('arrowR',20)}เริ่มทำข้อสอบ</button>
  </div>`;
}
function quiz(){
  const q=Q.qs[Q.i],a=Q.ans[Q.i],locked=Q.mode==='practice'&&Q.checked[Q.i];
  const done=Q.ans.filter((x,i)=>answered(Q.qs[i],x)).length;
  let body='';
  if(q.t==='mc'||q.t==='ms'){
    body=`<div class="opts" role="${q.t==='mc'?'radiogroup':'group'}">${q.opts.map((o,i)=>{let cls='opt'+(q.t==='ms'?' sq':'');const sel=q.t==='ms'?(a||[]).includes(i):a===i;if(locked){cls+=' locked';const ok=q.t==='ms'?q.ans.includes(i):q.ans===i;if(ok)cls+=' right';else if(sel)cls+=' wrong';}else if(sel)cls+=' sel';return `<button class="${cls}" data-act="pick" data-i="${i}" ${locked?'disabled':''} aria-pressed="${sel}"><span class="key">${q.t==='ms'?(sel?'✓':''):'กขคง'[i]}</span><span>${esc(o)}</span></button>`;}).join('')}</div>`;
  }else if(q.t==='tf'){
    body=`<div class="tfrow">${q.opts.map((o,i)=>{let cls='opt';const sel=a===i;if(locked){cls+=' locked';if(q.ans===i)cls+=' right';else if(sel)cls+=' wrong';}else if(sel)cls+=' sel';return `<button class="${cls}" data-act="pick" data-i="${i}" ${locked?'disabled':''} aria-pressed="${sel}">${i===0?'✓ ':'✗ '}${o}</button>`;}).join('')}</div>`;
  }else{
    const cur=a||q.left.map(()=>'');
    body=`<div class="match">${q.left.map((l,i)=>{let cls='mrow';if(locked)cls+=+cur[i]===q.ans[i]?' right':' wrong';return `<div class="${cls}"><span class="l">${esc(l)}</span><select data-act="matchsel" data-i="${i}" id="m${Q.i}_${i}" ${locked?'disabled':''} aria-label="คู่ของ ${esc(l)}"><option value="">— เลือกคู่ —</option>${q.right.map((r,k)=>`<option value="${k}" ${String(cur[i])===String(k)?'selected':''}>${esc(r)}</option>`).join('')}</select>${locked&&+cur[i]!==q.ans[i]?`<span class="fix">ที่ถูก: ${esc(q.right[q.ans[i]])}</span>`:''}</div>`;}).join('')}</div>`;
  }
  let fb='';
  if(locked){const ok=isRight(q,a);fb=`<div class="fb ${ok?'ok':'no'}"><div class="h">${ok?'ถูกต้อง':'ยังไม่ถูก'}</div>${ok?'':`<div class="ans"><b>คำตอบที่ถูก:</b> ${q.t==='match'?correctText(q):esc(correctText(q))}</div>`}<div class="ex">${esc(q.e)}</div></div>`;}
  const help=q.t==='ms'?'เลือกได้มากกว่า 1 ข้อ แล้วกดตรวจคำตอบ':q.t==='match'?'เลือกคู่ให้ครบทุกแถว':'';
  let nav;
  if(Q.mode==='practice'){
    const last=Q.i===Q.qs.length-1;
    nav=`<div class="qnav"><button class="btn sm ghost" data-act="prev" ${Q.i===0?'disabled':''} aria-label="ข้อก่อนหน้า">${ic('back',18)}</button>${locked?`<button class="btn pri" data-act="${last?'finish':'next'}">${last?'ดูผลสอบ':'ข้อถัดไป'} ${ic('arrowR',18)}</button>`:`<button class="btn pri" data-act="check" ${answered(q,a)?'':'disabled'}>ตรวจคำตอบ</button>`}</div>`;
  }else{
    const last=Q.i===Q.qs.length-1;
    nav=`<div class="qnav"><button class="btn sm" data-act="prev" ${Q.i===0?'disabled':''}>${ic('back',18)} ก่อนหน้า</button>${last?`<button class="btn pri" data-act="askSubmit">ส่งคำตอบ</button>`:`<button class="btn pri" data-act="next">ข้อถัดไป ${ic('arrowR',18)}</button>`}</div>
    <div id="confirmZone"></div>
    <details class="card" style="padding:14px 16px" ${Q.qs.length<=30?'open':''}><summary class="hint" style="cursor:pointer">ไปยังข้อ · ตอบแล้ว ${done}/${Q.qs.length}</summary><div class="dotsnav" style="margin-top:10px">${Q.qs.map((qq,i)=>`<button data-act="goto" data-i="${i}" class="${i===Q.i?'cur':''} ${answered(qq,Q.ans[i])?'done':''}" aria-label="ข้อ ${i+1}">${i+1}</button>`).join('')}</div></details>
    <button class="btn ghost" data-act="askSubmit">ส่งคำตอบตอนนี้ (ตอบแล้ว ${done}/${Q.qs.length})</button>`;
  }
  const scoreNow=Q.mode==='practice'?`<span class="chip ok">ถูก ${Q.qs.filter((qq,i)=>Q.checked[i]&&isRight(qq,Q.ans[i])).length}/${Q.checked.filter(Boolean).length}</span>`:'';
  return `${topbar(chName(Q.id)+(Q.mode==='exam'?' · จำลองสอบ':' · ฝึกทีละข้อ'),'quitQuiz')}
  <div class="qwrap view" id="qv">
   <div id="quitZone"></div>
   <div class="qmeta"><div class="qno">ข้อ <b>${Q.i+1}</b> / ${Q.qs.length}</div><div class="qtags">${scoreNow}<span class="chip">${q.kind}</span></div></div>
   <div class="bar"><i style="width:${((Q.mode==='practice'?Q.checked.filter(Boolean).length:done)/Q.qs.length*100).toFixed(1)}%"></i></div>
   <article class="card qcard" id="qcard"><div class="chiprow" style="margin-bottom:10px"><span class="chip">${Q.id==='all'?'บท '+chById(q.ch).num+' · ':''}${esc(q.tag)}</span></div><div class="qtext">${esc(q.q)}</div>${help?`<div class="qhelp">${help}</div>`:''}${body}</article>
   ${fb}${nav}
  </div>`;
}
function result(){
  const R=Q.result;const pct=R.pct,C=2*Math.PI*70;
  const msg=pct>=90?'ยอดเยี่ยม แม่นมาก พร้อมสอบแล้ว':pct>=75?'ดีมาก เก็บจุดที่ผิดอีกนิดก็เต็ม':pct>=50?'ผ่านครึ่งแล้ว ทบทวนหัวข้อด้านล่างแล้วลองใหม่':'ยังต้องทบทวน อ่านสรุปหัวข้อที่ผิดแล้วทำชุดใหม่';
  const weak=Object.entries(R.byTag).filter(([,v])=>v.w>0).sort((a,b)=>b[1].w-a[1].w);
  const f=V.rf||'all';
  const items=Q.qs.map((q,i)=>({q,i,a:Q.ans[i],ok:isRight(q,Q.ans[i])})).filter(x=>f==='all'||(f==='no'?!x.ok:x.ok));
  return `${topbar('ผลสอบ · '+chName(Q.id),'home')}
  <div class="narrow view" style="padding-top:22px;display:grid;gap:18px">
  <section class="card rtop"><div class="sring"><svg viewBox="0 0 160 160"><circle class="bg" cx="80" cy="80" r="70" fill="none" stroke-width="12"/><circle class="fgc" id="ringfg" cx="80" cy="80" r="70" fill="none" stroke-width="12" stroke-linecap="round" ${pct===0?'stroke-opacity="0"':''} stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${(C*(1-pct/100)).toFixed(1)}"/></svg><div class="c"><div><b>${pct}%</b><br><span>${R.right} / ${Q.qs.length} คะแนน</span></div></div></div>
   <div class="rsum"><div class="eyebrow">${Q.mode==='exam'?'จำลองสอบ':'ฝึกทีละข้อ'} · ${Q.qs.length} ข้อ</div><h1>${msg}</h1><p>คะแนนเต็ม ${Q.qs.length} ได้ ${R.right} คะแนน${S.scores[Q.id]?` · คะแนนดีสุดของ${Q.id==='all'?'การสอบรวม':'บทนี้'} ${S.scores[Q.id].best}%`:''}</p>
   <div class="kpis"><div class="kpi ok"><b>${R.right}</b><span>ตอบถูก</span></div><div class="kpi no"><b>${R.wrong}</b><span>ตอบผิด</span></div><div class="kpi"><b>${R.skip}</b><span>ไม่ได้ตอบ</span></div></div></div></section>
  <div class="btns"><button class="btn pri" data-act="again">${ic('refresh',18)}ทำชุดใหม่ (${Q.qs.length} ข้อ)</button><button class="btn" data-act="setup" data-id="${Q.id}">เปลี่ยนจำนวนข้อ / โหมด</button></div>
  <section class="card"><h2 style="font-size:19px">หัวข้อที่ควรกลับไปอ่านซ้ำ</h2><div class="weak" style="margin-top:12px">${weak.length?weak.map(([k,v])=>{const[cid,tag]=k.split('|');const c=chById(cid);const s=c.sections.find(x=>x.tag===tag)||c.sections.find(x=>tag.includes(x.tag)||x.tag.includes(tag));return `<div class="weakrow"><span class="t">${esc(tag)}<small>บทที่ ${c.num} · ผิด ${v.w} จาก ${v.n} ข้อ</small></span><button class="btn" data-act="jump" data-id="${cid}" data-sec="${s?cid+'-'+s.id:''}">${ic('book',16)}อ่านหัวข้อนี้</button></div>`}).join(''):'<p class="empty">ไม่มีหัวข้อที่ตอบผิด เยี่ยมมาก</p>'}</div></section>
  <section class="review"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:19px">เฉลยทุกข้อ</h2><div class="tabs"><button class="${f==='all'?'on':''}" data-act="rf" data-f="all">ทั้งหมด ${Q.qs.length}</button><button class="${f==='no'?'on':''}" data-act="rf" data-f="no">ผิด/ไม่ตอบ ${R.wrong+R.skip}</button><button class="${f==='ok'?'on':''}" data-act="rf" data-f="ok">ถูก ${R.right}</button></div></div>
  ${items.length?items.map(({q,i,a,ok})=>`<article class="card ritem ${ok?'ok':'no'}"><div class="chiprow" style="margin-bottom:6px"><span class="chip ${ok?'ok':''}">ข้อ ${i+1} · ${ok?'ถูก':'ผิด'}</span><span class="chip">${esc(q.tag)}</span></div><div class="rq">${esc(q.q)}</div><dl><dt>คำตอบของคุณ</dt><dd class="ya ${ok?'':'no'}">${q.t==='match'?ansText(q,a):esc(ansText(q,a))}</dd>${ok?'':`<dt>คำตอบที่ถูก</dt><dd class="ca">${q.t==='match'?correctText(q):esc(correctText(q))}</dd>`}<dt>คำอธิบาย</dt><dd>${esc(q.e)}</dd></dl></article>`).join(''):'<p class="empty">ไม่มีข้อในหมวดนี้</p>'}
  </section>
  <div class="btns"><button class="btn" data-act="home">กลับหน้าแรก</button><span id="rsz" style="flex:1 1 140px;display:flex"><button class="btn ghost bad" style="flex:1" data-act="askResetScore">รีเซ็ตคะแนน${Q.id==='all'?'การสอบรวม':'บทนี้'}</button></span></div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  app.innerHTML=V.view==='home'?home():V.view==='read'?read():V.view==='setup'?setup():V.view==='quiz'?quiz():result();
  if(V.view==='result'){requestAnimationFrame(()=>{const r=$('#ringfg');if(r)r.style.strokeDashoffset=r.dataset.off;});}
  if(V.view==='read')observeEnd();
}
function rerenderQuiz(){const y=window.scrollY;render();window.scrollTo(0,y);}

/* reading progress */
let obs=null;
function observeEnd(){
  if(obs)obs.disconnect();const end=$('#endcard');if(!end||!('IntersectionObserver' in window))return;
  obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&!S.read[V.ch]){S.read[V.ch]=true;save();toast('บันทึกว่าอ่านบทนี้จบแล้ว');}});},{threshold:.3});obs.observe(end);
}
function saveReadPos(){if(V.view==='read'&&V.ch){S.pos[V.ch]=Math.round(window.scrollY);save();}}
let st=0;
window.addEventListener('scroll',()=>{
  if(V.view!=='read')return;const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);const b=$('#readbar');if(b)b.style.width=(p*100).toFixed(1)+'%';
  clearTimeout(st);st=setTimeout(saveReadPos,250);
},{passive:true});

/* ---------- quiz control ---------- */
function startQuiz(id,n,mode){
  const {qs}=sample(idsOf(id),n);
  Q={id,mode,qs,i:0,ans:qs.map(()=>null),checked:qs.map(()=>false),n};
  S.count=n;S.mode=mode;save();
  V.rf='all';go('quiz');
}
function finish(){
  const byTag={};let right=0,wrong=0,skip=0;
  Q.qs.forEach((q,i)=>{const k=q.ch+'|'+q.tag;byTag[k]=byTag[k]||{n:0,w:0};byTag[k].n++;if(!answered(q,Q.ans[i])){skip++;byTag[k].w++;}else if(isRight(q,Q.ans[i]))right++;else{wrong++;byTag[k].w++;}});
  const pct=Math.round(right/Q.qs.length*100);
  Q.result={right,wrong,skip,pct,byTag};
  const s=S.scores[Q.id]||{best:0,attempts:0};s.best=Math.max(s.best,pct);s.last=pct;s.attempts++;S.scores[Q.id]=s;save();
  V.rf='all';go('result');
}
function setCount(n){
  n=Math.max(1,Math.min(V.max,Math.round(+n||1)));V.n=n;
  const c=$('#cnt'),r=$('#rng');if(c&&+c.value!==n)c.value=n;if(r)r.value=n;
  document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  const eta=$('#eta');if(eta)eta.textContent=`ใช้เวลาประมาณ ${Math.max(1,Math.round(n*0.75))} นาที`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
  case 'home': go('home');break;
  case 'read': go('read',{ch:id,section:null});break;
  case 'backRead': go(V.ch&&V.ch!=='all'?'read':'home',{section:null});break;
  case 'jump': V.query='';go('read',{ch:id,section:el.dataset.sec||null});break;
  case 'toc': {const t=document.getElementById(el.dataset.sec);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});break;}
  case 'setup': go('setup',{ch:id});break;
  case 'quick': startQuiz(id,+el.dataset.n,S.mode||'practice');break;
  case 'preset': setCount(+el.dataset.n);break;
  case 'mode': S.mode=el.dataset.m;save();document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));break;
  case 'start': startQuiz(V.ch,V.n,S.mode);break;
  case 'pick': {const q=Q.qs[Q.i],i=+el.dataset.i;if(q.t==='ms'){const a=new Set(Q.ans[Q.i]||[]);a.has(i)?a.delete(i):a.add(i);Q.ans[Q.i]=[...a];}else Q.ans[Q.i]=i;rerenderQuiz();break;}
  case 'check': {Q.checked[Q.i]=true;rerenderQuiz();const ok=isRight(Q.qs[Q.i],Q.ans[Q.i]);if(!ok){const c=$('#qcard');c&&c.classList.add('shake');}const fb=document.querySelector('.fb');if(fb&&fb.getBoundingClientRect().bottom>innerHeight)fb.scrollIntoView({behavior:'smooth',block:'nearest'});break;}
  case 'next': if(Q.i<Q.qs.length-1){Q.i++;go('quiz');}break;
  case 'prev': if(Q.i>0){Q.i--;go('quiz');}break;
  case 'goto': Q.i=+el.dataset.i;go('quiz');break;
  case 'finish': finish();break;
  case 'askSubmit': {const left=Q.qs.filter((q,i)=>!answered(q,Q.ans[i])).length;const z=$('#confirmZone');z.innerHTML=`<div class="confirm"><p>${left?`ยังไม่ได้ตอบ ${left} ข้อ ข้อที่ไม่ได้ตอบจะนับเป็นผิด`:'ตอบครบทุกข้อแล้ว'} ต้องการส่งคำตอบเลยไหม</p><div class="btns"><button class="btn pri" data-act="finish">ส่งคำตอบ</button><button class="btn" data-act="cancelZone">กลับไปทำต่อ</button></div></div>`;z.scrollIntoView({behavior:'smooth',block:'nearest'});break;}
  case 'cancelZone': {const z=el.closest('#confirmZone,#quitZone');if(z)z.innerHTML='';break;}
  case 'quitQuiz': {const z=$('#quitZone');z.innerHTML=`<div class="confirm"><p>ออกจากแบบทดสอบนี้? คำตอบในรอบนี้จะไม่ถูกบันทึก</p><div class="btns"><button class="btn bad" data-act="home">ออก</button><button class="btn" data-act="cancelZone">ทำต่อ</button></div></div>`;window.scrollTo({top:0,behavior:'smooth'});break;}
  case 'again': startQuiz(Q.id,Q.qs.length,Q.mode);break;
  case 'rf': V.rf=el.dataset.f;rerenderQuiz();break;
  case 'askResetScore': $('#rsz').innerHTML=`<span class="confirm" style="flex:1"><span>ลบคะแนนของ${Q.id==='all'?'การสอบรวม':'บทนี้'}? (ความคืบหน้าการอ่านยังอยู่)</span><span class="btns"><button class="btn bad" data-act="resetScore">ลบคะแนน</button><button class="btn" data-act="home">ยกเลิก</button></span></span>`;break;
  case 'resetScore': delete S.scores[Q.id];save();toast('รีเซ็ตคะแนนแล้ว');go('home');break;
  case 'askReset': $('#resetZone').innerHTML=`<span class="confirm"><span>ลบความคืบหน้าการอ่าน ตำแหน่งที่อ่านค้าง และคะแนนทั้งหมด?</span><span class="btns"><button class="btn bad" data-act="resetAll">ลบทั้งหมด</button><button class="btn" data-act="home">ยกเลิก</button></span></span>`;break;
  case 'resetAll': S={read:{},pos:{},scores:{},count:S.count,mode:S.mode};save();toast('รีเซ็ตความคืบหน้าแล้ว');go('home');break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='matchsel'){const q=Q.qs[Q.i];const a=(Q.ans[Q.i]||q.left.map(()=>'')).slice();a[+el.dataset.i]=el.value===''?'':+el.value;Q.ans[Q.i]=a;rerenderQuiz();const n=document.getElementById(el.id);n&&n.focus();}
  if(el.id==='cnt')setCount(el.value);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){V.query=el.value;$('#res').innerHTML=searchHTML(V.query);}
  if(el.id==='rng')setCount(el.value);
  if(el.id==='cnt'&&el.value!==''&&+el.value>=1){V.n=Math.min(V.max,Math.round(+el.value));document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('on',+b.dataset.n===V.n));const r=$('#rng');if(r)r.value=V.n;}
});
document.addEventListener('keydown',e=>{
  if(V.view!=='quiz'||e.target.matches('input,select,textarea'))return;
  const q=Q.qs[Q.i];const locked=Q.mode==='practice'&&Q.checked[Q.i];
  const k=e.key;const map={'1':0,'2':1,'3':2,'4':3,'ก':0,'ข':1,'ค':2,'ง':3};
  if(k in map&&!locked&&q.opts&&map[k]<q.opts.length){const b=document.querySelector(`[data-act="pick"][data-i="${map[k]}"]`);b&&b.click();e.preventDefault();}
  else if(k==='Enter'){const b=document.querySelector('.qnav .btn.pri:not([disabled])');if(b){b.click();e.preventDefault();}}
  else if(k==='ArrowRight'&&(Q.mode==='exam'||locked)){const b=document.querySelector('[data-act="next"]');b&&b.click();}
  else if(k==='ArrowLeft'){const b=document.querySelector('[data-act="prev"]:not([disabled])');b&&b.click();}
});

/* boot */
const h=(location.hash||'').slice(1);
