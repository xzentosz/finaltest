id:'p9',num:9,icon:'heart',title:'แรงจูงใจและอารมณ์',en:'Motivation & Emotion',
blurb:'แรงจูงใจ แรงขับ สิ่งล่อใจ Maslow 8 ขั้น ความหิว BMI โรคการกิน ความกระหาย เพศ ทฤษฎีอารมณ์ การวัด และ EQ',
sections:[
{id:'s1',tag:'ความหมายของแรงจูงใจ',title:'แรงจูงใจ แรงขับ และสิ่งล่อใจ',html:`
<p class="lead"><b>แรงจูงใจ (Motivation)</b> คือกระบวนการที่ทำให้เกิดพฤติกรรมที่สร้างสรรค์ มีทิศทาง และดำรงอยู่ต่อไป เพื่อให้บุคคลพึงพอใจจากการตอบสนองความต้องการทั้งทางร่างกายและจิตใจ</p>
<div class="flow"><span>1. เกิดความต้องการ (กาย/ใจ/สิ่งล่อใจ)</span><i>→</i><span>2. เกิดความกระวนกระวาย (แรงขับ)</span><i>→</i><span>3. แสดงพฤติกรรมเพื่อลดแรงขับ</span><i>→</i><span>4. เกิดความต้องการใหม่</span></div>
<div class="cols"><div class="box"><h4>แรงขับ (Drive)</h4><p>สภาวะความเครียด ความกระวนกระวายจากการเกิดความต้องการ ต้องการมาก → กระวนกระวายมาก · เป็นความกระวนกระวายที่<b>มีทิศทาง</b></p></div><div class="box"><h4>สิ่งล่อใจ (Incentive)</h4><p>สิ่งที่นำมา<b>กระตุ้นให้เกิดความต้องการ</b> เช่น ไม่หิวแต่เห็นอาหารที่ชอบ · ใช้ในอุตสาหกรรม เช่น ค่าจ้าง ตำแหน่ง ชื่อเสียง</p></div></div>`},
{id:'s2',tag:'ทฤษฎีแรงจูงใจ',title:'ทฤษฎีแรงจูงใจ: แรงขับ สิ่งล่อใจ และ Maslow',html:`
<p><b>ทฤษฎีการลดแรงขับ (Drive-Reduction Theory):</b> ร่างกายขาดสมดุล → เกิดแรงขับ → กระตุ้นพฤติกรรม → ได้รับสิ่งที่ต้องการ แรงขับลดลง</p>
<div class="cols"><div class="box"><h4>แรงขับปฐมภูมิ</h4><p>เกิดเองภายในร่างกาย<b>ไม่ต้องเรียนรู้</b> รักษาสมดุลร่างกาย เช่น ต้องการอาหาร น้ำ ความอบอุ่น ทางเพศ หลีกหนีความเจ็บปวด</p></div><div class="box"><h4>แรงขับทุติยภูมิ</h4><p>เกิดภายหลังจาก<b>การติดต่อกับผู้อื่นหรือการเรียนรู้</b> เช่น ความกลัว วิตกกังวล ต้องการการยอมรับ ต้องการความสำเร็จ</p></div></div>
<div class="cols"><div class="box"><h4>แรงจูงใจภายใน</h4><p>เกี่ยวกับสภาวะภายใน เช่น อยากได้เกรดสูงเพราะรู้สึกดีต่อตัวเอง</p></div><div class="box"><h4>แรงจูงใจภายนอก</h4><p>ไม่เกี่ยวกับสภาวะภายใน เช่น ดื่มเหล้าเพราะอยากให้เพื่อนยอมรับ</p></div></div>
<h4>ลำดับขั้นความต้องการของ Maslow (1970) 8 ขั้น</h4>
<p>ต้องได้รับการตอบสนองขั้นต่ำจนพอใจก่อน จึงเกิดความต้องการขั้นสูงต่อไป</p>
<div class="tbl"><table>${MAS.map((m,i)=>`<tr><td class="num"><b>${i+1}</b></td><td><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join('')}</table></div>
<div class="memo"><b>เทคนิคจำ</b> "กิน-ปลอดภัย-รัก-นับถือ-รู้-สวย-เป็นตัวเอง-สงบ"</div>`},
{id:'s3',tag:'ความหิวและโรคอ้วน',title:'ความหิว โรคอ้วน และความผิดปกติในการกิน',html:`
<h4>ตัวการที่บอกว่าหิว</h4><ol class="steps"><li>การบีบตัวของกระเพาะ ฮอร์โมน <b>เกอร์ลิน (Ghrelin)</b></li><li>ตับเปลี่ยนไกลโคเจนเป็นกลูโคส</li><li>อินซูลินช่วยให้น้ำตาลเข้าสู่เซลล์</li><li>สมองส่วน<b>ไฮโปธาลามัส</b></li></ol>
<div class="cols"><div class="box"><h4>LH (Lateral Hypothalamus)</h4><p>กระตุ้น → <b>กินอาหาร</b> · ถูกทำลาย → หยุดกิน น้ำหนักลด อาจอดตาย</p></div><div class="box"><h4>VMH (Ventromedial Hypothalamus)</h4><p>ทำหน้าที่<b>หยุดกินอาหาร</b> · ถูกทำลาย → กินมากเกิน (overeating) น้ำหนักเพิ่ม</p></div></div>
<p><b>โรคอ้วน (Obesity):</b> น้ำหนักสูงกว่าเฉลี่ยราว 30%</p>
<div class="formula">BMI = น้ำหนัก (กก.) ÷ ส่วนสูง (ม.)²</div>
<div class="tbl"><table><tr><th>BMI</th><th>แปลผล</th></tr><tr><td class="num">ต่ำกว่า 18.5</td><td>น้ำหนักน้อย/ผอม</td></tr><tr><td class="num">18.5–22.9</td><td>ปกติ สุขภาพดี</td></tr><tr><td class="num">23–24.9</td><td>ท้วม / โรคอ้วนระดับ 1</td></tr><tr><td class="num">25–29.9</td><td>อ้วน / โรคอ้วนระดับ 2</td></tr><tr><td class="num">30 ขึ้นไป</td><td>อ้วนมาก / โรคอ้วนระดับ 3</td></tr></table></div>
<p><b>สาเหตุ 3 ประการ:</b> การนำพลังงานเข้า (หมดพลังควบคุม อดอาหาร อารมณ์ ความเครียด รูปลักษณ์อาหาร สังคม) · การใช้พลังงาน · กรรมพันธุ์ (เซลล์ไขมันมากเป็น <b>3 เท่า</b> · การหลั่ง<b>เอนโดรฟิน</b>มากเกินไป)</p>
<div class="cols"><div class="box"><h4>Bulimia Nervosa</h4><p>รักษาน้ำหนักให้น้อย กินมากแล้ว<b>ล้วงคอให้อาเจียน</b> สาเหตุไม่แน่ชัด</p></div><div class="box"><h4>Anorexia Nervosa (คลั่งผอม)</h4><p><b>ปฏิเสธการกิน</b> กลัวน้ำหนักเพิ่ม มองตัวเองอ้วนทั้งที่ผอม อาจเสียชีวิต ผิวแห้ง ประจำเดือนผิดปกติ หนาวง่าย</p></div></div>`},
{id:'s4',tag:'ความกระหายและแรงขับทางเพศ',title:'ความกระหาย และแรงขับทางเพศ',html:`
<p><b>ตัวการกระหาย:</b> ความเข้มของเกลือในของเหลวร่างกาย · ปริมาตรเลือดลดลง</p>
<p><b>สาเหตุการหยุดดื่ม:</b> 1) <b>กระเพาะพองตัว</b> (น้ำเย็นอิ่มเร็วกว่าน้ำอุ่น เพราะซึมผ่านผนังกระเพาะช้ากว่า) · 2) <b>ปากชุ่มชื้น</b> (Bellow, 1939) แต่ไม่ใช่ตัวการเดียว กระเพาะสำคัญด้วย</p>
<h4>แรงขับทางเพศต่างจากความหิว/กระหายอย่างไร</h4><ol class="steps"><li>ไม่ได้เกิดจากการขาดสมดุล (homeostasis) แต่เกิดจาก<b>ระดับฮอร์โมน</b></li><li><b>ไม่เกี่ยวกับการอยู่รอด</b></li><li>เกี่ยวข้องกับจริยธรรมสังคมรุนแรงกว่า</li><li>เป็นการ<b>ลด</b>พลังงาน ส่วนหิว/กระหายเป็นการแสวงหาพลังงาน</li></ol>`},
{id:'s5',tag:'ทฤษฎีอารมณ์',title:'ความหมายและทฤษฎีการเกิดอารมณ์',html:`
<p><b>อารมณ์</b> คือปฏิกิริยาของร่างกายจากการกระตุ้นของสิ่งเร้า ความรู้สึกรุนแรงที่ทำให้จิตใจปั่นป่วน พฤติกรรมไม่ปกติ และร่างกายเปลี่ยนแปลงควบคู่</p>
<div class="tbl"><table><tr><th>ทฤษฎี</th><th>ผู้เสนอ</th><th>ลำดับการเกิด</th></tr>${EMOT.map((t,i)=>`<tr><td><b>${t[0]}</b></td><td>${EMOTP[i][1]}</td><td>${t[1]}</td></tr>`).join('')}</table></div>
<p><b>ตัวแบบอารมณ์ร่วม (Contemporary Model):</b> รวมทุกแนวคิด สิ่งเร้า → ประเมินอารมณ์ → สมองถูกกระตุ้น → คิด → แสดงพฤติกรรม (วิ่ง) + สีหน้า + ความรู้สึก (กลัว)</p>
<div class="trap"><b>จุดที่มักสับสน</b> James-Lange: สรีระ<b>ก่อน</b>อารมณ์ · Cannon-Bard: <b>พร้อมกัน</b> สมองสั่ง · Schachter-Singer: สรีระ + <b>การตีความ</b> (เป็นแนวคิดทางการรู้คิด)</div>`},
{id:'s6',tag:'ประเภทอารมณ์',title:'ประเภทของอารมณ์',html:`
<div class="cols"><div class="box"><h4>อารมณ์ที่ให้ความสุข (+)</h4><p>รัก สดชื่นรื่นเริง · ไม่กระตุ้นการเปลี่ยนแปลงร่างกายมาก ไม่ทำให้ระบบผิดปกติ</p></div><div class="box"><h4>อารมณ์ที่ให้ความทุกข์ (−)</h4><p>กลัว โกรธ เศร้า · เปลี่ยนแปลงร่างกายมาก (หัวใจ ความดัน กระเพาะ ฮอร์โมน) ถ้านานอาจเกิดโรค เช่น โรคกระเพาะ ความดันสูง ปวดศีรษะ</p></div></div>
<ul class="dots"><li><b>อารมณ์รัก</b> เกิดจาก<b>การเรียนรู้</b> เด็กรักผู้เลี้ยงก่อนแล้วขยายไปสู่เพื่อน ครู สัตว์ · เด็กที่ไม่เคยได้รับความรักจะไม่รู้จักให้และรับความรักที่เหมาะสม</li><li><b>อารมณ์สนุกสนาน</b> ทำให้แจ่มใส มีความสุข · ผู้ใหญ่หมกมุ่นกับงานมักขาด ควรท่องเที่ยว ฟังเพลง เล่นกีฬา</li><li><b>อารมณ์กลัว</b> เกิดเมื่อมีประสบการณ์ว่าอันตราย ขาดความสามารถจัดการ (การทดลองหนูในกรงช็อตไฟฟ้า)</li><li><b>อารมณ์วิตกกังวล</b> กลัวต่อสิ่งที่<b>ยังไม่เกิด</b> · ต่ำ: กระตือรือร้นเตรียมตัว · ปานกลาง: สมาธิลด · สูง: ควบคุมตนเองไม่ได้ (panic)</li><li><b>อารมณ์โกรธ</b> เมื่อถูกขัดขวางเป้าหมาย หรือถูกดูถูก · สาเหตุต่างกันตามวัย · การแสดงออกต่างกันจากการเรียนรู้และการควบคุมอารมณ์</li></ul>
<div class="tbl"><table><tr><th>กลุ่ม</th><th>ตัวอย่าง</th></tr><tr><td><b>รัก</b></td><td>ยอมรับนับถือ เป็นมิตร เชื่อใจ ใจดี อุทิศตน ชื่นชม ชอบพอ สนิทสนม หลงรัก หลงเสน่ห์</td></tr><tr><td><b>สนุกสนาน</b></td><td>ความสุข ร่าเริง ผ่อนคลาย พอใจ เบิกบาน ตลก ภูมิใจ ยินดี ตื่นเต้น ปิติ ปลาบปลื้ม เคลิบเคลิ้ม</td></tr><tr><td><b>กลัว</b></td><td>กังวล สงสัย หวาดหวั่น ห่วง ระมัดระวัง รอบคอบ ขี้ตกใจ ลังเล กระสับกระส่าย อกสั่นขวัญแขวน</td></tr><tr><td><b>โกรธ</b></td><td>โมโห ขุ่นเคือง แค้นใจ เจ็บใจ เดือดดาล เกลียดชัง รำคาญ เจตนาร้าย รุนแรง ดูหมิ่นดูแคลน</td></tr></table></div>`},
{id:'s7',tag:'การวัดและสากลของอารมณ์',title:'การวัดอารมณ์ อารมณ์เป็นเรื่องสากล และพฤติกรรมทางอารมณ์',html:`

<h4>Carl Jung (1875–1961) จิตแพทย์ชาวสวิส ลูกศิษย์ฟรอยด์</h4>
<div class="cols"><div class="box"><h4>Personal unconscious</h4><p>จิตไร้สำนึกส่วนตัว: ความทรงจำที่ถูกลืมและประสบการณ์ที่ถูกเก็บกด</p></div><div class="box"><h4>Collective unconscious</h4><p>จิตไร้สำนึกสะสม: เรื่องราวที่เหมือนกันทั่วโลกทุกวัฒนธรรม รวม archetypes</p></div></div>
<div class="tbl"><table><tr><th>Archetype</th><th>ความหมาย</th></tr>${ARCH.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td></tr>`).join('')}</table></div>
<p>บุคลิก 2 ประเภท: <b>Introversion</b> (เก็บตัว เงียบ ไม่ชอบสังคม) · <b>Extroversion</b> (แสดงตัว ชอบพบปะผู้อื่น)</p>
<div class="trap"><b>ข้อควรระวัง</b> สไลด์ระบุ anima = ความเป็นชาย, animus = ความเป็นหญิง (ตำราสากลส่วนใหญ่ระบุกลับกัน) ในเว็บนี้ยึดตามสไลด์ของอาจารย์</div>
<h4>Alfred Adler จิตแพทย์ชาวออสเตรีย ลูกศิษย์ฟรอยด์</h4><p>มนุษย์ทุกคนมี<b>ปมด้อย</b>ตั้งแต่เกิด กระตุ้นให้ต้องการพลังและอำนาจเพื่อชดเชย · พัฒนาได้ทั้งทางลบ (ทำตัวเด่น ก้าวร้าว ริษยา) และทางบวก (เป็นตัวของตัวเอง สร้างสรรค์)</p>
<h4>Karen Horney</h4><p>เห็นด้วยว่าวัยเด็กสำคัญ แต่<b>ไม่เห็นด้วย</b>ว่ามาจากความขัดแย้งของสัญชาตญาณ · สภาพแวดล้อมและครอบครัวทำให้เกิด<b>ความวิตกกังวลพื้นฐาน</b> (รู้สึกช่วยตัวเองไม่ได้) จึงแสวงหาความรัก อำนาจ เกียรติยศ · <b>วัฒนธรรม</b>สำคัญกว่าสรีระและสัญชาตญาณ</p>`},
{id:'s5',tag:'กลุ่มเทรท',title:'กลุ่มแนวคิดเทรท: Allport, Eysenck และ Big Five',html:`
<p><b>เทรท (trait)</b> = คุณลักษณะของบุคคลที่<b>คงที่ในสถานการณ์ต่างๆ</b> เช่น เป็นมิตร ก้าวร้าว ชอบแสดงออก</p>
<h4>Gordon Allport: เทรท 3 ชนิด</h4><div class="tbl"><table>${ALL.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td></tr>`).join('')}</table></div>
<h4>Hans Eysenck</h4><ul class="dots"><li><b>Extraversion vs Introversion</b>: ระดับปฏิสัมพันธ์กับผู้อื่น (แสดงตัว: เป็นกันเอง มีชีวิตชีวา · เก็บตัว: ไว้ตัว เงียบขรึม ขี้อาย)</li><li><b>Neuroticism vs Emotional Stability</b>: การปรับตัว (เจ้าอารมณ์: ขี้โมโห หงุดหงิด · มั่นคง: ผ่อนคลาย สงบ)</li><li><b>Psychoticism</b> (แนวโน้มโรคจิต): โดดเดี่ยว เย็นชา ก้าวร้าว ยึดตัวเองเป็นศูนย์กลาง หุนหันพลันแล่น เป็นคุณลักษณะ<b>ด้านเดียว</b></li></ul>
<h4>ตัวแบบห้าองค์ประกอบ (Big Five: OCEAN)</h4><div class="tbl"><table><tr><th>องค์ประกอบ</th><th>คะแนนสูง</th><th>คะแนนต่ำ</th></tr>${B5.map(b=>`<tr><td><b>${b[0]}</b></td><td>${b[1]}</td><td>${b[2]}</td></tr>`).join('')}</table></div>`},
{id:'s6',tag:'การรู้คิดทางสังคม',title:'กลุ่มแนวคิดการรู้คิดทางสังคม: Bandura และ Rotter',html:`
<p>บุคลิกภาพได้รับอิทธิพลจาก<b>สิ่งแวดล้อมและความคิด</b> สนใจวิธีที่บุคคลรับรู้และแปลความหมายสถานการณ์</p>
<h4>Albert Bandura (1925–)</h4><ul class="dots"><li>บุคลิกภาพเกิดจากปฏิสัมพันธ์ 3 ปัจจัย: <b>สภาพแวดล้อม พฤติกรรม ความคิด</b> เรียกว่า <b>นิยัตินิยมต่างตอบแทน (reciprocal determinism)</b></li><li><b>Self-Efficacy</b> ความเชื่อมั่นในสมรรถภาพแห่งตน: มีสมรรถภาพ → รับรู้ → เชื่อ → มุ่งมั่นทำ</li><li><b>การเลียนแบบ</b>: ศึกษาแบบแผนพฤติกรรม แสดงตาม แล้วตัดสินใจว่าจะทำต่อไหม</li></ul>
<h4>Julian Rotter: Locus of Control</h4><div class="cols"><div class="box"><h4>Internal locus of control</h4><p>เชื่อว่า<b>ตนเอง</b>กำหนดผลลัพธ์ในชีวิต · มีสุขภาพกายและใจ<b>ดีกว่า</b></p></div><div class="box"><h4>External locus of control</h4><p>เชื่อว่าผลลัพธ์มาจาก<b>ผู้อื่น โชคชะตา โชคลาง</b> ใช้ความพยายามน้อยในการเปลี่ยนแปลง</p></div></div>`},
{id:'s7',tag:'มนุษยนิยม',title:'กลุ่มแนวคิดมนุษยนิยม: Maslow และ Rogers',html:`
<p><b>Abraham Maslow:</b> บุคลิกภาพเกิดจากแรงจูงใจที่พัฒนาเป็นขั้นๆ จากแรงจูงใจขั้นพื้นฐาน (ขาดแคลน) ไปสู่แรงจูงใจเพื่อการเจริญเติบโต · จุดหมายสูงสุดคือ <b>Self-actualization</b> (การบรรลุศักยภาพแห่งตน) รวมถึงความต้องการความสงบ</p>
<h4>Carl Rogers: Self Theory</h4><p>ตัวตน (self) คือแนวคิดต่อเอกลักษณ์ของบุคคล ยืดหยุ่นและเปลี่ยนแปลงได้ มี 3 ลักษณะ</p>
<div class="tbl"><table>${ROGERS.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table></div>
<p>ถ้า 3 ลักษณะไม่สอดคล้องกัน <b>self-esteem</b> อาจลดลง · ถ้า true self ไม่สอดคล้องกับ self-image จะเกิด<b>ความวิตกกังวล</b>และต้องการปกป้องตนเอง</p>`},
{id:'s8',tag:'จริต 6',title:'บุคลิกภาพแบบตะวันออก: จริต 6',html:`
<p><b>จริต</b> คือความประพฤติปกติ พื้นเพของจิต อุปนิสัย · ตัวความประพฤติเรียกว่า <b>จริยา</b> · บุคคลผู้มีความประพฤติตามจริยาเรียกว่า <b>จริต</b></p>
<div class="tbl"><table>${JARIT.map((j,i)=>`<tr><td><b>${i+1}. ${j[0]}</b></td><td>${j[1]}</td></tr>`).join('')}</table></div>`},
{id:'s9',tag:'การวัดบุคลิกภาพ',title:'การวัดบุคลิกภาพ (Personality Assessment)',html:`
<p><b>คุณสมบัติแบบวัด:</b> ความเชื่อมั่น (reliability) = ผลคงที่ · ความเที่ยงตรง (validity) = วัดได้ตรงสิ่งที่ต้องการวัด · เกณฑ์ปกติ (norm) = เกณฑ์เปรียบเทียบและแปลผล</p>
<p><b>วิธีวัด:</b> 1) ชุดคำถาม (Personality Inventories) ถูก/ผิด ใช่/ไม่ใช่ ปรนัยสูง · 2) วิธีฉายภาพ (Projective Test) สิ่งเร้าไม่ชัดเจน วัด<b>จิตไร้สำนึก</b> ต้องใช้ผู้ชำนาญแปลผล · 3) การประเมินค่า (rating scales) ให้คนใกล้ชิดตอบได้ · 4) การสัมภาษณ์ทางคลินิก · และการสังเกตพฤติกรรมโดยตรง</p>
<div class="tbl"><table><tr><th>แบบทดสอบ</th><th>ประเภท</th><th>รายละเอียด</th></tr>${TESTS.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join('')}</table></div>
<div class="tbl"><table><tr><th>MBTI</th><th></th></tr><tr><td>E / I</td><td>เปิดเผย / เก็บตัว</td></tr><tr><td>S / N</td><td>ข้อเท็จจริง / คาดเดา</td></tr><tr><td>T / F</td><td>เหตุผล / ความรู้สึก</td></tr><tr><td>J / P</td><td>ระเบียบแบบแผน / ยืดหยุ่น</td></tr></table></div>`}

{id:'s1',tag:'สุขภาพจิตและการปรับตัว',title:'ความหมายของสุขภาพจิตและการปรับตัว',html:`
<p class="lead"><b>สุขภาพจิต</b> คือสภาวะที่บุคคลมีความสมบูรณ์ทางจิตใจ ปรับตัวเข้ากับสังคม แก้ปัญหาในชีวิตประจำวัน และดำรงชีวิตในสังคมได้อย่างปกติสุข</p>
<h4>ลักษณะของผู้ที่มีสุขภาพจิตดี</h4><ul class="dots">${GOOD.map(g=>`<li>${g}</li>`).join('')}</ul>
<h4>การปรับตัว</h4><p>การที่บุคคลพยายามทำให้เกิด<b>ความสมดุล</b>ระหว่างความคิด ความเชื่อ ความต้องการของตนกับสิ่งแวดล้อม · ปรับตัวได้จะไม่เกิดปัญหา · ปรับตัวไม่ได้อาจเกิด<b>พยาธิสภาพทางจิต</b></p>
<div class="cols"><div class="box"><h4>1. ปรับตัวให้เข้ากับสิ่งแวดล้อม</h4><p>รับสิ่งเร้าที่ชอบไว้ ขจัดสิ่งเร้าที่ไม่ชอบออกไป ทำให้ลดความเครียด</p></div><div class="box"><h4>2. ปรับตัวเพื่อสนองความต้องการของตน</h4><p>เช่น รู้สึกเหงาจึงไปหาเพื่อน คุยแล้วความเหงาลดลง</p></div></div>`},
{id:'s2',tag:'กลไกการป้องกันตนเอง',title:'กลไกการป้องกันตนเอง (Defense Mechanisms)',html:`
<p><b>กลไกการป้องกันตนเอง</b> คือปฏิกิริยาที่แสดงออกเพื่อ<b>ลดความเครียด</b>หรือความไม่สบายใจ แต่<b>ไม่ได้แก้ที่ต้นเหตุ</b>ของปัญหา · บางครั้งทำโดยไม่รู้ตัว เกิดขึ้นอัตโนมัติ · ถ้าใช้มากเกินไปจะทำให้เกิดพยาธิสภาพทางจิต</p>
<div class="tbl"><table><tr><th>กลไก</th><th>ความหมาย</th><th>ตัวอย่าง</th></tr>${DM.map(d=>`<tr><td><b>${d[0]}</b></td><td>${d[1]}</td><td>${d[2]}</td></tr>`).join('')}</table></div>
<div class="trap"><b>จุดที่มักสับสน</b><br>· การเก็บกด ≠ การลืมปกติ: ลืมปกติเพราะไม่ได้ทบทวน แต่เก็บกดคือจงใจลืมเพราะไม่อยากรับรู้<br>· การชดเชย = ปมเด่นแทนปมด้อย · การทดแทน = ของแทนที่คล้ายเป้าหมายเดิม · Sublimation = เปลี่ยนความต้องการที่สังคมไม่ยอมรับเป็นสิ่งที่สังคมยอมรับ<br>· การชดเชยที่มากเกินไป (Over Compensation) เป็นผลเสีย เช่น คนจนที่รวยแล้วใช้เงินฟุ่มเฟือย วางท่าข่มผู้อื่น<br>· Conversion ต่างจากโรคทางกายจริง เพราะตรวจไม่พบความผิดปกติ และหายเมื่อแก้สาเหตุความเครียดได้</div>`},
{id:'s3',tag:'พฤติกรรมผิดปกติ',title:'คำจำกัดความและเกณฑ์ตัดสินพฤติกรรมผิดปกติ',html:`
<p><b>พฤติกรรมผิดปกติ</b> คือพฤติกรรมที่ทำให้บุคคลไม่สบายใจและขัดขวางการใช้ชีวิตประจำวันตามปกติ อาจเป็นความคิด อารมณ์ หรือการแสดงออก ที่ทำให้เกิดความแตกแยกหรือทำร้ายผู้อื่น ตนเอง หรือสังคม</p>
<h4>เกณฑ์ตัดสินพฤติกรรมผิดปกติ 5 ข้อ</h4><div class="tbl"><table>${CRIT.map((c,i)=>`<tr><td><b>${i+1}. ${c[0]}</b></td><td>${c[1]}</td></tr>`).join('')}</table></div>
<div class="memo"><b>เทคนิคจำ</b> M-U-U-D-I: Maladaptive, Unpredictable, Unconventional, Distressing, Irrational</div>`},
{id:'s4',tag:'มุมมองต่อความผิดปกติ',title:'แนวคิดหรือสาเหตุที่อธิบายความผิดปกติทางพฤติกรรม (6 มุมมอง)',html:`
<div class="tbl"><table><tr><th>มุมมอง</th><th>สาเหตุของความผิดปกติ</th></tr>${PERS.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}</table></div>
<h4>ตัวอย่างสำคัญ</h4><ul class="dots"><li><b>การแพทย์:</b> โรคซึมเศร้าและจิตเภทมาจากพันธุกรรมและสารสื่อประสาท · ไทรอกซินมากไปทำให้หงุดหงิด น้ำหนักลด · สมองส่วนหน้ากระทบกระเทือนทำให้สูญเสียความจำ · แอลกอฮอล์ทำให้ระบบประสาทลดลง · การศึกษาตระกูล <b>มาร์ติน กาลิกัก</b></li>
<li><b>จิตวิเคราะห์:</b> ความวิตกกังวล 3 แบบ ${ANX.map(a=>`<b>${a[0]}</b> ${a[1]}`).join(' · ')} · อิดมากไปทำตามใจตนเอง อีโกมากไปเหมือนหุ่นยนต์ ซุปเปอร์อีโกมากไปต้องการทำถูกทุกอย่างจนเครียด</li>
<li><b>พฤติกรรม:</b> เลียนแบบพ่อแม่ที่มีปัญหาอารมณ์ · ฝึกขับถ่ายเข้มงวดจนกลัวติดตัว · ดื่มสุราลดเครียดจนติด · บทบาทพ่อแม่ไม่เหมาะสม เช่น ปกป้องหรือคาดหวังมากเกินไป ตามใจ ทอดทิ้ง ลงโทษรุนแรง</li>
<li><b>การรู้คิด:</b> ความเชื่อผิดๆ ว่าต้องได้คะแนนดีที่สุดเสมอจนเครียดจัดการไม่ได้</li>
<li><b>มนุษยนิยม:</b> พัฒนาจากแนวคิด Rogers และ Maslow · มองว่าบุคคลกำหนดตนเองได้</li>
<li><b>สังคมวัฒนธรรม:</b> จิตเภทพบมากในกลุ่มฐานะสังคมต่ำ · <b>Ruth Benedict</b> ศึกษาชาวเมลานีเซียน (หวาดระแวงเรื่องเวทมนตร์) · <b>หย่าร้าง</b>ป่วยสูงสุด รองลงมาคือโสด ผู้แต่งงานแล้วต่ำสุด · รายได้น้อยป่วยมากกว่าชนชั้นกลางและสูง · <b>คนเมือง</b>ป่วยมากกว่าคนชนบท</li></ul>`},
{id:'s5',tag:'DSM-5',title:'ประเภทของความผิดปกติทางจิตที่จำแนกโดย DSM',html:`
<p>พ.ศ. 2495 (ค.ศ. <b>1952</b>) <b>สมาคมจิตแพทย์อเมริกัน (APA)</b> ตีพิมพ์ <b>DSM (Diagnostic and Statistical Manual of Mental Disorders)</b> คู่มือการวิเคราะห์และสถิติความผิดปกติทางจิต · ทบทวนครั้งที่ 5 ใน พ.ศ. 2556 (ค.ศ. <b>2013</b>) เรียกว่า <b>DSM-5</b> ฉบับเพิ่มเติมเรียก <b>DSM-5-TR</b> · ครอบคลุมวัยเด็กและผู้ใหญ่ประมาณไม่เกิน <b>300</b> อาการ</p>

<p><b>ความวิตกกังวล</b> คือความรู้สึกไม่สบายใจหรือคลุมเครือว่าจะมีบางสิ่งเกิดขึ้น · แบ่งเป็นความวิตกกังวลทั่วไป ความกลัว และความรู้สึกตื่นตระหนก</p>

{id:'s2',tag:'ซึมเศร้าและไบโพลาร์',title:'ความผิดปกติด้านอารมณ์เศร้าและอารมณ์สองขั้ว',html:`
<p><b>Depressive disorders:</b> เศร้า สิ้นหวัง ช่วยตัวเองไม่ได้ ด้อยค่า รุนแรงและยาวนานกว่าความเศร้าปกติจนกระทบชีวิต สูญเสียความรื่นเริง มีปัญหาการกิน น้ำหนัก การนอน เคลื่อนไหวและพูดช้าลง ถ้ารุนแรงอาจหลงผิดหรือประสาทหลอน</p>
<div class="cols"><div class="box"><h4>Major Depressive Disorder</h4><p>ซึมเศร้าชนิดรุนแรง กระทบการทำงาน การเรียน การนอน การกินอย่างรุนแรง</p></div><div class="box"><h4>Persistent Depressive Disorder</h4><p>ซึมเศร้าเรื้อรัง อาการน้อยกว่า แต่คงอยู่ยาวนาน <b>อย่างน้อย 2 ปี</b></p></div></div>
<p><b>Bipolar disorders (อารมณ์สองขั้ว):</b> สลับระหว่าง <b>Mania</b> (อารมณ์ดีและตื่นตัวผิดปกติ) กับ <b>Depression</b> ร่วมกับหลงผิดว่าตนสำคัญ</p>
<div class="cols"><div class="box"><h4>ด้าน Mania</h4><p>ตื่นตัวตลอด พลังงานสูงผิดปกติ ร่าเริงเกินไป อยู่ไม่นิ่ง หงุดหงิดง่าย หุนหันพลันแล่น คิดเร็ว พูดมาก พูดเร็ว ใช้เงินฟุ่มเฟือย ใช้ชีวิตเสี่ยง</p></div><div class="box"><h4>ด้าน Depression</h4><p>ไร้เรี่ยวแรง เก็บตัว ร้องไห้ง่าย ท้อแท้ สิ้นหวัง มองโลกแง่ร้าย ไร้ค่า อยากตาย ปัญหาความจำ สมาธิ การนอน การกิน</p></div></div>`},

<div class="cols"><div class="box"><h4>ตัวอย่างอาการย้ำคิด</h4><p>กลัวสกปรก กลัวติดเชื้อ ไม่สบายใจเมื่อเห็นของไม่เป็นระเบียบ คิดว่าลืมปิดแก๊สหรือล็อกประตู ยึดติดเรื่องศาสนาหรือเพศ</p></div><div class="box"><h4>ตัวอย่างอาการย้ำทำ</h4><p>ล้างมือบ่อยเกินจำเป็น ตรวจแก๊สและกุญแจซ้ำๆ จัดของให้หันทางเดียวกันหมด ทำทุกอย่างให้ครบตามจำนวนที่กำหนด</p></div></div>`},

/* ---------- question pool ---------- */
function bucketsFor(ids){
  const seen=new Set(),buckets=[];
  for(const ch of CH.filter(c=>ids.includes(c.id))){
    const byTag={};
    ch.q.forEach(q=>{const k=q.q;if(seen.has(k))return;seen.add(k);(byTag[q.tag]=byTag[q.tag]||[]).push(Object.assign({ch:ch.id},q));});
    Object.values(byTag).forEach(list=>buckets.push(H.shuffle(list)));
    (ch.gens||[]).forEach(g=>{const list=[];let tries=0;while(list.length<30&&tries<90){tries++;let q;try{q=g.f();}catch(e){q=null;}if(!q)continue;const k=q.q;if(seen.has(k))continue;seen.add(k);list.push(Object.assign({ch:ch.id,tag:g.tag,gen:1},q));}if(list.length)buckets.push(list);});
  }
  return buckets;
}
function sample(ids,n){
  const buckets=H.shuffle(bucketsFor(ids));const total=buckets.reduce((a,b)=>a+b.length,0);
  n=Math.min(n,total);const out=[];
  while(out.length<n){let added=false;for(const b of buckets){if(out.length>=n)break;if(b.length){out.push(b.shift());added=true;}}if(!added)break;}
  return {qs:H.shuffle(out).map(prep),total};
}
function poolSize(ids){return bucketsFor(ids).reduce((a,b)=>a+b.length,0);}
function prep(q){
  const o={src:q,t:q.t,tag:q.tag,ch:q.ch,q:q.q,e:q.e};
  if(q.t==='mc'){const idx=H.shuffle(q.o.map((_,i)=>i));o.opts=idx.map(i=>q.o[i]);o.ans=idx.indexOf(q.a);}
  else if(q.t==='tf'){o.opts=['ถูก','ผิด'];o.ans=q.a?0:1;}
  else if(q.t==='ms'){const idx=H.shuffle(q.o.map((_,i)=>i));o.opts=idx.map(i=>q.o[i]);o.ans=q.a.map(a=>idx.indexOf(a)).sort((a,b)=>a-b);}
  else if(q.t==='match'){o.left=q.pairs.map(p=>p[0]);o.right=H.shuffle(q.pairs.map(p=>p[1]));o.ans=q.pairs.map(p=>o.right.indexOf(p[1]));}
  o.kind=q.t==='tf'?'ถูกหรือผิด':q.t==='ms'?'เลือกได้หลายคำตอบ':q.t==='match'?'จับคู่':(q.gen&&/\d/.test(q.q)&&/เท่าใด|จงหา|เท่ากับ/.test(q.q))?'คำนวณ':(/สถานการณ์|กรณี/.test(q.q)?'วิเคราะห์สถานการณ์':'ปรนัย 4 ตัวเลือก');
  return o;
}
const answered=(q,a)=>a!=null&&(q.t==='ms'?a.length>0:q.t==='match'?a.every(x=>x!=null&&x!==''):true);
function isRight(q,a){if(!answered(q,a))return false;if(q.t==='ms')return a.slice().sort((x,y)=>x-y).join()===q.ans.join();if(q.t==='match')return a.every((x,i)=>+x===q.ans[i]);return a===q.ans;}
function ansText(q,a){if(a==null)return '— ไม่ได้ตอบ —';if(q.t==='ms')return a.length?a.slice().sort((x,y)=>x-y).map(i=>q.opts[i]).join(' · '):'— ไม่ได้ตอบ —';if(q.t==='match')return q.left.map((l,i)=>`${l} → ${a[i]!=null&&a[i]!==''?q.right[a[i]]:'?'}`).join('<br>');return q.opts[a];}
function correctText(q){if(q.t==='ms')return q.ans.map(i=>q.opts[i]).join(' · ');if(q.t==='match')return q.left.map((l,i)=>`${l} → ${q.right[q.ans[i]]}`).join('<br>');return q.opts[q.ans];}

function searchHTML(q){
  q=q.trim();if(!q)return '';

  const hl=t=>esc(t).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>`<mark>${m}</mark>`);
  for(const c of CH){
    if((c.title+' '+c.en).toLowerCase().includes(ql))hits.push({c,s:null,t:c.title,d:c.blurb});
    for(const s of c.sections){const txt=strip(s.html);const i=txt.toLowerCase().indexOf(ql);if(s.title.toLowerCase().includes(ql)||i>=0){const d=i>=0?(i>30?'…':'')+txt.slice(Math.max(0,i-30),i+70)+'…':'';hits.push({c,s,t:s.title,d});}}
    for(const [k,v] of c.terms){if((k+' '+v).toLowerCase().includes(ql))hits.push({c,s:'terms',t:k,d:v});}
  }
  if(!hits.length)return `<p class="empty">ไม่พบ “${esc(q)}” ลองคำอื่น เช่น ภาษี, CPI, ดุลการค้า</p>`;

}

   <div id="quitZone"></div>
   <div class="qmeta"><div class="qno">ข้อ <b>${Q.i+1}</b> / ${Q.qs.length}</div><div class="qtags">${scoreNow}<span class="chip">${q.kind}</span></div></div>
   <div class="bar"><i style="width:${((Q.mode==='practice'?Q.checked.filter(Boolean).length:done)/Q.qs.length*100).toFixed(1)}%"></i></div>
   <article class="card qcard" id="qcard"><div class="chiprow" style="margin-bottom:10px"><span class="chip">${Q.id==='all'?M().short+' '+chById(q.ch).num+' · ':''}${esc(q.tag)}</span></div><div class="qtext">${esc(q.q)}</div>${help?`<div class="qhelp">${help}</div>`:''}${body}</article>
   ${fb}${nav}
  </div>`;
}
function result(){
  const R=Q.result;const pct=R.pct,C=2*Math.PI*70;
  const msg=pct>=90?'ยอดเยี่ยม แม่นมาก พร้อมสอบแล้ว':pct>=75?'ดีมาก เก็บจุดที่ผิดอีกนิดก็เต็ม':pct>=50?'ผ่านครึ่งแล้ว ทบทวนหัวข้อด้านล่างแล้วลองใหม่':'ยังต้องทบทวน อ่านสรุปหัวข้อที่ผิดแล้วทำชุดใหม่';
  const weak=Object.entries(R.byTag).filter(([,v])=>v.w>0).sort((a,b)=>b[1].w-a[1].w);
  const f=V.rf||'all';
  const items=Q.qs.map((q,i)=>({q,i,a:Q.ans[i],ok:isRight(q,Q.ans[i])})).filter(x=>f==='all'||(f==='no'?!x.ok:x.ok));
  return `${topbar('ผลสอบ · '+chName(Q.id),'home')}
  <div class="narrow view" style="padding-top:22px;display:grid;gap:18px">
  <section class="card rtop"><div class="sring"><svg viewBox="0 0 160 160"><circle class="bg" cx="80" cy="80" r="70" fill="none" stroke-width="12"/><circle class="fgc" id="ringfg" cx="80" cy="80" r="70" fill="none" stroke-width="12" stroke-linecap="round" ${pct===0?'stroke-opacity="0"':''} stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${(C*(1-pct/100)).toFixed(1)}"/></svg><div class="c"><div><b>${pct}%</b><br><span>${R.right} / ${Q.qs.length} คะแนน</span></div></div></div>
   <div class="rsum"><div class="eyebrow">${Q.mode==='exam'?'จำลองสอบ':'ฝึกทีละข้อ'} · ${Q.qs.length} ข้อ</div><h1>${msg}</h1><p>คะแนนเต็ม ${Q.qs.length} ได้ ${R.right} คะแนน${S.scores[Q.id]?` · คะแนนดีสุดของ${Q.id==='all'?'การสอบรวม':M().short+'นี้'} ${S.scores[Q.id].best}%`:''}</p>
   <div class="kpis"><div class="kpi ok"><b>${R.right}</b><span>ตอบถูก</span></div><div class="kpi no"><b>${R.wrong}</b><span>ตอบผิด</span></div><div class="kpi"><b>${R.skip}</b><span>ไม่ได้ตอบ</span></div></div></div></section>
  <div class="btns"><button class="btn pri" data-act="again">${ic('refresh',18)}ทำชุดใหม่ (${Q.qs.length} ข้อ)</button><button class="btn" data-act="setup" data-id="${Q.id}">เปลี่ยนจำนวนข้อ / โหมด</button></div>
  <section class="card"><h2 style="font-size:19px">หัวข้อที่ควรกลับไปอ่านซ้ำ</h2><div class="weak" style="margin-top:12px">${weak.length?weak.map(([k,v])=>{const[cid,tag]=k.split('|');const c=chById(cid);const s=c.sections.find(x=>x.tag===tag)||c.sections.find(x=>tag.includes(x.tag)||x.tag.includes(tag));return `<div class="weakrow"><span class="t">${esc(tag)}<small>${M().unit} ${c.num} · ผิด ${v.w} จาก ${v.n} ข้อ</small></span><button class="btn" data-act="jump" data-id="${cid}" data-sec="${s?cid+'-'+s.id:''}">${ic('book',16)}อ่านหัวข้อนี้</button></div>`}).join(''):'<p class="empty">ไม่มีหัวข้อที่ตอบผิด เยี่ยมมาก</p>'}</div></section>
  <section class="review"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:19px">เฉลยทุกข้อ</h2><div class="tabs"><button class="${f==='all'?'on':''}" data-act="rf" data-f="all">ทั้งหมด ${Q.qs.length}</button><button class="${f==='no'?'on':''}" data-act="rf" data-f="no">ผิด/ไม่ตอบ ${R.wrong+R.skip}</button><button class="${f==='ok'?'on':''}" data-act="rf" data-f="ok">ถูก ${R.right}</button></div></div>
  ${items.length?items.map(({q,i,a,ok})=>`<article class="card ritem ${ok?'ok':'no'}"><div class="chiprow" style="margin-bottom:6px"><span class="chip ${ok?'ok':''}">ข้อ ${i+1} · ${ok?'ถูก':'ผิด'}</span><span class="chip">${esc(q.tag)}</span></div><div class="rq">${esc(q.q)}</div><dl><dt>คำตอบของคุณ</dt><dd class="ya ${ok?'':'no'}">${q.t==='match'?ansText(q,a):esc(ansText(q,a))}</dd>${ok?'':`<dt>คำตอบที่ถูก</dt><dd class="ca">${q.t==='match'?correctText(q):esc(correctText(q))}</dd>`}<dt>คำอธิบาย</dt><dd>${esc(q.e)}</dd></dl></article>`).join(''):'<p class="empty">ไม่มีข้อในหมวดนี้</p>'}
  </section>
  <div class="btns"><button class="btn" data-act="home">กลับหน้าแรก</button><span id="rsz" style="flex:1 1 140px;display:flex"><button class="btn ghost bad" style="flex:1" data-act="askResetScore">รีเซ็ตคะแนน${Q.id==='all'?'การสอบรวม':M().short+'นี้'}</button></span></div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  document.body.dataset.subj=V.view==='pick'?'':V.subj;
  app.innerHTML=V.view==='pick'?pick():V.view==='home'?home():V.view==='read'?read():V.view==='setup'?setup():V.view==='quiz'?quiz():result();
  if(V.view==='result'){requestAnimationFrame(()=>{const r=$('#ringfg');if(r)r.style.strokeDashoffset=r.dataset.off;});}
  if(V.view==='read')observeEnd();
}
function rerenderQuiz(){const y=window.scrollY;render();window.scrollTo(0,y);}

/* reading progress */
let obs=null;
function observeEnd(){
  if(obs)obs.disconnect();const end=$('#endcard');if(!end||!('IntersectionObserver' in window))return;
  obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&!S.read[V.ch]){S.read[V.ch]=true;save();toast('บันทึกว่าอ่าน '+M().short+' นี้จบแล้ว');}});},{threshold:.3});obs.observe(end);
}
function saveReadPos(){if(V.view==='read'&&V.ch){S.pos[V.ch]=Math.round(window.scrollY);save();}}
let st=0;
window.addEventListener('scroll',()=>{
  if(V.view!=='read')return;const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);const b=$('#readbar');if(b)b.style.width=(p*100).toFixed(1)+'%';
  clearTimeout(st);st=setTimeout(saveReadPos,250);
},{passive:true});

/* ---------- quiz control ---------- */
function startQuiz(id,n,mode){
  const {qs}=sample(idsOf(id),n);
  Q={id,mode,qs,i:0,ans:qs.map(()=>null),checked:qs.map(()=>false),n};
  S.count=n;S.mode=mode;save();
  V.rf='all';go('quiz');
}
function finish(){
  const byTag={};let right=0,wrong=0,skip=0;
  Q.qs.forEach((q,i)=>{const k=q.ch+'|'+q.tag;byTag[k]=byTag[k]||{n:0,w:0};byTag[k].n++;if(!answered(q,Q.ans[i])){skip++;byTag[k].w++;}else if(isRight(q,Q.ans[i]))right++;else{wrong++;byTag[k].w++;}});
  const pct=Math.round(right/Q.qs.length*100);
  Q.result={right,wrong,skip,pct,byTag};
  const s=S.scores[Q.id]||{best:0,attempts:0};s.best=Math.max(s.best,pct);s.last=pct;s.attempts++;S.scores[Q.id]=s;save();
  V.rf='all';go('result');
}
function setCount(n){
  n=Math.max(1,Math.min(V.max,Math.round(+n||1)));V.n=n;
  const c=$('#cnt'),r=$('#rng');if(c&&+c.value!==n)c.value=n;if(r)r.value=n;
  document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  const eta=$('#eta');if(eta)eta.textContent=`ใช้เวลาประมาณ ${Math.max(1,Math.round(n*0.75))} นาที`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
  case 'home': go('home');break;
  case 'subjects': V.query='';go('pick');break;
  case 'subj': setSubj(el.dataset.s);V.query='';go('home');break;
  case 'read': go('read',{ch:id,section:null});break;
  case 'backRead': go(V.ch&&V.ch!=='all'?'read':'home',{section:null});break;
  case 'jump': V.query='';go('read',{ch:id,section:el.dataset.sec||null});break;
  case 'toc': {const t=document.getElementById(el.dataset.sec);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});break;}
  case 'setup': go('setup',{ch:id});break;
  case 'quick': startQuiz(id,+el.dataset.n,S.mode||'practice');break;
  case 'preset': setCount(+el.dataset.n);break;
  case 'mode': S.mode=el.dataset.m;save();document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));break;
  case 'start': startQuiz(V.ch,V.n,S.mode);break;
  case 'pick': {const q=Q.qs[Q.i],i=+el.dataset.i;if(q.t==='ms'){const a=new Set(Q.ans[Q.i]||[]);a.has(i)?a.delete(i):a.add(i);Q.ans[Q.i]=[...a];}else Q.ans[Q.i]=i;rerenderQuiz();break;}
  case 'check': {Q.checked[Q.i]=true;rerenderQuiz();const ok=isRight(Q.qs[Q.i],Q.ans[Q.i]);if(!ok){const c=$('#qcard');c&&c.classList.add('shake');}const fb=document.querySelector('.fb');if(fb&&fb.getBoundingClientRect().bottom>innerHeight)fb.scrollIntoView({behavior:'smooth',block:'nearest'});break;}
  case 'next': if(Q.i<Q.qs.length-1){Q.i++;go('quiz');}break;
  case 'prev': if(Q.i>0){Q.i--;go('quiz');}break;
  case 'goto': Q.i=+el.dataset.i;go('quiz');break;
  case 'finish': finish();break;
  case 'askSubmit': {const left=Q.qs.filter((q,i)=>!answered(q,Q.ans[i])).length;const z=$('#confirmZone');z.innerHTML=`<div class="confirm"><p>${left?`ยังไม่ได้ตอบ ${left} ข้อ ข้อที่ไม่ได้ตอบจะนับเป็นผิด`:'ตอบครบทุกข้อแล้ว'} ต้องการส่งคำตอบเลยไหม</p><div class="btns"><button class="btn pri" data-act="finish">ส่งคำตอบ</button><button class="btn" data-act="cancelZone">กลับไปทำต่อ</button></div></div>`;z.scrollIntoView({behavior:'smooth',block:'nearest'});break;}
  case 'cancelZone': {const z=el.closest('#confirmZone,#quitZone');if(z)z.innerHTML='';break;}
  case 'quitQuiz': {const z=$('#quitZone');z.innerHTML=`<div class="confirm"><p>ออกจากแบบทดสอบนี้? คำตอบในรอบนี้จะไม่ถูกบันทึก</p><div class="btns"><button class="btn bad" data-act="home">ออก</button><button class="btn" data-act="cancelZone">ทำต่อ</button></div></div>`;window.scrollTo({top:0,behavior:'smooth'});break;}
  case 'again': startQuiz(Q.id,Q.qs.length,Q.mode);break;
  case 'rf': V.rf=el.dataset.f;rerenderQuiz();break;
  case 'askResetScore': $('#rsz').innerHTML=`<span class="confirm" style="flex:1"><span>ลบคะแนนของ${Q.id==='all'?'การสอบรวม':M().short+'นี้'}? (ความคืบหน้าการอ่านยังอยู่)</span><span class="btns"><button class="btn bad" data-act="resetScore">ลบคะแนน</button><button class="btn" data-act="home">ยกเลิก</button></span></span>`;break;
  case 'resetScore': delete S.scores[Q.id];save();toast('รีเซ็ตคะแนนแล้ว');go('home');break;
  case 'askReset': $('#resetZone').innerHTML=`<span class="confirm"><span>ลบความคืบหน้าการอ่าน ตำแหน่งที่อ่านค้าง และคะแนนทั้งหมดของ${M().th}?</span><span class="btns"><button class="btn bad" data-act="resetAll">ลบทั้งหมด</button><button class="btn" data-act="home">ยกเลิก</button></span></span>`;break;
  case 'resetAll': {const nb=blank();nb.count=S.count;nb.mode=S.mode;STORE[V.subj]=nb;S=nb;save();}toast('รีเซ็ตความคืบหน้าแล้ว');go('home');break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='matchsel'){const q=Q.qs[Q.i];const a=(Q.ans[Q.i]||q.left.map(()=>'')).slice();a[+el.dataset.i]=el.value===''?'':+el.value;Q.ans[Q.i]=a;rerenderQuiz();const n=document.getElementById(el.id);n&&n.focus();}
  if(el.id==='cnt')setCount(el.value);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){V.query=el.value;$('#res').innerHTML=searchHTML(V.query);}
  if(el.id==='rng')setCount(el.value);
  if(el.id==='cnt'&&el.value!==''&&+el.value>=1){V.n=Math.min(V.max,Math.round(+el.value));document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('on',+b.dataset.n===V.n));const r=$('#rng');if(r)r.value=V.n;}
});
document.addEventListener('keydown',e=>{
  if(V.view!=='quiz'||e.target.matches('input,select,textarea'))return;
  const q=Q.qs[Q.i];const locked=Q.mode==='practice'&&Q.checked[Q.i];
  const k=e.key;const map={'1':0,'2':1,'3':2,'4':3,'ก':0,'ข':1,'ค':2,'ง':3};
  if(k in map&&!locked&&q.opts&&map[k]<q.opts.length){const b=document.querySelector(`[data-act="pick"][data-i="${map[k]}"]`);b&&b.click();e.preventDefault();}
  else if(k==='Enter'){const b=document.querySelector('.qnav .btn.pri:not([disabled])');if(b){b.click();e.preventDefault();}}
  else if(k==='ArrowRight'&&(Q.mode==='exam'||locked)){const b=document.querySelector('[data-act="next"]');b&&b.click();}
  else if(k==='ArrowLeft'){const b=document.querySelector('[data-act="prev"]:not([disabled])');b&&b.click();}
});

/* boot */
const h=(location.hash||'').slice(1);
for(const k in SUBJ){if(h===k){setSubj(k);V.view='home';}else if(SUBJ[k].some(c=>c.id===h)){setSubj(k);V.view='read';V.ch=h;}}
render();
if(V.view==='read'&&S.pos[V.ch])requestAnimationFrame(()=>window.scrollTo(0,S.pos[V.ch]));
window.__econ={sample,poolSize,isRight,prep,setSubj,get CH(){return CH}};
})();

</script>

</body></html>
