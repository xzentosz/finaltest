id:'ch13', num:13, icon:'growth', title:'การพัฒนาเศรษฐกิจและปรัชญาเศรษฐกิจพอเพียง', en:'Economic Development',
blurb:'Growth vs Development, GDP/GNP, Real GNP, Rostow, กลยุทธ์ แผนพัฒนาฯ เศรษฐกิจพอเพียง ทฤษฎีใหม่',
sections:[
{id:'s1', tag:'Growth vs Development', title:'การเจริญเติบโต vs การพัฒนาเศรษฐกิจ', html:`
<div class="cols"><div class="box"><h4>การเจริญเติบโตทางเศรษฐกิจ (Economic Growth)</h4><p>การเพิ่มขึ้นของ<b>รายได้ต่อบุคคลที่แท้จริง</b> วัดจาก Real per capita income<br>= การเปลี่ยนแปลง<b>ทางเศรษฐกิจเท่านั้น</b></p></div>
<div class="box"><h4>การพัฒนาเศรษฐกิจ (Economic Development)</h4><p>กระบวนการที่ทำให้รายได้ที่แท้จริงเฉลี่ยต่อบุคคลเพิ่มขึ้น<b>อย่างต่อเนื่อง</b> มี<b>การกระจายรายได้เป็นธรรม</b> ประชาชนมี<b>คุณภาพชีวิตที่ดี</b><br>= การเปลี่ยนแปลง<b>โครงสร้างทางเศรษฐกิจและสังคม</b></p></div></div>
<div class="formula">การเติบโตทางเศรษฐกิจเป็นเพียง “ส่วนหนึ่ง” ของการพัฒนาเศรษฐกิจ</div>`},
{id:'s2', tag:'เครื่องบ่งชี้และ HDI', title:'เครื่องบ่งชี้ระดับการพัฒนา และ HDI', html:`
<ul class="dots"><li>การเพิ่มขึ้นของรายได้ประชาชาติที่แท้จริงต่อบุคคล</li><li>อายุขัยโดยเฉลี่ยของประชากร</li><li>อัตราการรู้หนังสือ</li><li>ดัชนีการพัฒนามนุษย์ (HDI)</li><li>อัตราการเพิ่มของพลเมือง</li><li>ดัชนีชี้วัดการกระจายรายได้</li></ul>
<h4>HDI (Human Development Index) 3 มิติ</h4>
<div class="tbl"><table><tr><th>มิติ</th><th>วัดจาก</th></tr><tr><td>การมีอายุยืน</td><td>อายุขัยเฉลี่ย</td></tr><tr><td>การศึกษา</td><td>อัตราการอ่านออกเขียนได้ในวัยผู้ใหญ่ · สัดส่วนการเข้าศึกษาในระดับต่าง ๆ</td></tr><tr><td>มาตรฐานการครองชีพ</td><td>GDP ต่อหัวประชากร</td></tr></table></div>
<p><b>SDGs (Sustainable Development Goals)</b> เป้าหมายการพัฒนาที่ยั่งยืน <b>17 เป้าหมาย</b> เช่น ขจัดความยากจน ขจัดความหิวโหย การศึกษาที่มีคุณภาพ ลดความเหลื่อมล้ำ การรับมือการเปลี่ยนแปลงสภาพภูมิอากาศ</p>`},
{id:'s3', tag:'รายได้ประชาชาติ GDP GNP', title:'รายได้ประชาชาติ: GDP และ GNP', html:`
<p><b>รายได้ประชาชาติ (National Income)</b> คือมูลค่าหรือผลรวมของรายได้ประเภทต่าง ๆ ที่พลเมืองได้รับจากการมีส่วนร่วมในการผลิตสินค้าและบริการในรอบระยะเวลาหนึ่ง ตัวชี้วัด: GDP, GNP, GDP per capita (รายได้ต่อหัว)</p>
<div class="cols"><div class="box"><h4>GNP (ผลิตภัณฑ์ประชาชาติเบื้องต้น)</h4><p>มูลค่าตามราคาตลาดของสินค้าและบริการขั้นสุดท้ายที่ผลิตขึ้น<b>ด้วยทรัพยากรของประเทศ</b> (P×Q)<br>GNP ไทย = ผลผลิตที่<b>คนไทย</b>ผลิตได้<b>ทั้งในและต่างประเทศ</b></p></div>
<div class="box"><h4>GDP (ผลิตภัณฑ์ในประเทศเบื้องต้น)</h4><p>มูลค่ารวมของสินค้าและบริการขั้นสุดท้ายที่ผลิตขึ้น<b>ในประเทศ</b><br>GDP ไทย = ผลผลิตที่<b>ชาวไทยและชาวต่างประเทศ</b>ผลิตขึ้น<b>ในประเทศไทย</b></p></div></div>
<div class="memo"><b>เทคนิคจำ</b> GDP = “D-omestic = ในบ้าน” ดู<b>สถานที่</b> · GNP = “N-ational = สัญชาติ” ดู<b>คน</b></div>
<div class="trap"><b>จุดที่มักสับสน</b> คนไทยไปทำงานที่ญี่ปุ่น → นับใน GNP ไทย แต่<b>ไม่</b>นับใน GDP ไทย · บริษัทญี่ปุ่นผลิตรถในไทย → นับใน GDP ไทย แต่ไม่นับใน GNP ไทย</div>`},
{id:'s4', tag:'Nominal vs Real และรายได้ต่อหัว', title:'รายได้ประชาชาติที่เป็นตัวเงิน vs ที่แท้จริง และรายได้ต่อหัว', html:`
<div class="tbl"><table><tr><th>ที่เป็นตัวเงิน (Nominal)</th><th>ที่แท้จริง (Real)</th></tr>
<tr><td>Nominal GDP = Qₜ × Pₜ (ราคาปีที่ t)</td><td>Real GDP = Qₜ × P<sub>ปีฐาน</sub> (ราคาปีฐาน)</td></tr>
<tr><td>Nominal GNP = Qₜ × Pₜ</td><td>Real GNP = Qₜ × P<sub>ปีฐาน</sub></td></tr>
<tr><td>Nominal GDP per capita = (Qₜ × Pₜ) ÷ N</td><td>Real GDP per capita = (Qₜ × P<sub>ปีฐาน</sub>) ÷ N</td></tr></table></div>
<div class="formula">Real GNP = Money GNP × (ดัชนีราคาปีฐาน ÷ ดัชนีราคาปีเดียวกัน) = Money GNP × 100 ÷ ดัชนีราคาปีเดียวกัน</div>
<div class="example"><b>ตัวอย่างจากสไลด์</b> Money GNP = 30,000 ล้านบาท ดัชนีราคา = 120<br>Real GNP = 30,000 × 100 ÷ 120 = <b>25,000 ล้านบาท</b></div>
<div class="formula">รายได้เฉลี่ยต่อบุคคลต่อปี = Real GNP ÷ จำนวนประชากร<small>ใช้เปรียบเทียบฐานะทางเศรษฐกิจระหว่างประเทศ เพราะแต่ละประเทศมีจำนวนประชากรต่างกัน</small></div>`},
{id:'s5', tag:'การคำนวณรายได้ประชาชาติ', title:'การคำนวณรายได้ประชาชาติ 3 ด้าน', html:`
<ol class="steps"><li><b>ด้านผลผลิต</b> คำนวณจากสินค้าและบริการขั้นสุดท้ายที่ซื้อเพื่อการบริโภค</li><li><b>ด้านรายจ่าย</b> GDP = C + I + G + (X − M)<br><span class="muted">C = การบริโภค · I = การลงทุน · G = การใช้จ่ายของรัฐ · X − M = ส่งออกสุทธิ</span></li><li><b>ด้านรายได้</b> (จากการขายปัจจัยการผลิต) GDP = ค่าจ้าง + ค่าเช่า + ดอกเบี้ย + กำไร</li></ol>
<p class="muted">ข้อมูลประกอบ: ประมาณการเศรษฐกิจไทยปี 2565 (สศค.) ขยายตัว 3.5% (ปี 2564 = 1.5%, ปี 2563 = −6.2%) · อัตราการขยายตัว GDP ด้านการใช้จ่าย Q2 สูงสุดคือ Imports 31.4% และ Exports 27.5%</p>`},
{id:'s6', tag:'ปัจจัยและลักษณะประเทศกำลังพัฒนา', title:'ปัจจัยการพัฒนา และลักษณะประเทศกำลังพัฒนา', html:`
<h4>ปัจจัยที่มีอิทธิพลต่อการพัฒนาเศรษฐกิจ</h4><div class="chips"><span>ทรัพยากรมนุษย์</span><span>ทรัพยากรธรรมชาติ</span><span>การสะสมทุน</span><span>ความก้าวหน้าทางเทคโนโลยี</span></div>
<h4>ลักษณะของประเทศกำลังพัฒนา</h4><ul class="dots"><li>ประชากรส่วนใหญ่มีมาตรฐานการครองชีพต่ำ</li><li>มีอัตราการขยายตัวของประชากรสูง</li><li>ขาดความก้าวหน้าทางเทคโนโลยี</li><li>ขาดแคลนเงินออม</li><li>สภาพสังคมไม่เอื้ออำนวยต่อการพัฒนา</li><li>ต้องพึ่งพาและถูกครอบงำจากต่างประเทศ</li></ul>
<div class="tbl"><table><tr><th>Developing</th><th>Developed</th></tr><tr><td>รายได้ต่อหัวต่ำ มาตรฐานครองชีพต่ำ</td><td>รายได้ต่อหัวสูง มาตรฐานครองชีพสูง</td></tr><tr><td>เกษตรเป็นแหล่งจ้างงานหลัก</td><td>แรงงานส่วนใหญ่อยู่ในภาคอุตสาหกรรม</td></tr><tr><td>ประชากรเพิ่มเร็ว ว่างงานสูง</td><td>ประชากรเพิ่มช้า ว่างงานต่ำ</td></tr><tr><td>ออมต่ำ ขาดการสะสมทุน</td><td>ออมสูง สะสมทุนสูง</td></tr><tr><td>ส่งออกสินค้าขั้นปฐม ขาดดุลการค้า</td><td>ส่งออกสินค้าอุตสาหกรรมและบริการ</td></tr></table></div>`},
{id:'s7', tag:'ทฤษฎี Rostow', title:'ทฤษฎีการพัฒนาเศรษฐกิจของ Rostow (5 ขั้น)', html:`
<figure class="fig">${FIG.rostow()}</figure>
<div class="tbl"><table><tr><th>ขั้น</th><th>ลักษณะ</th></tr>${ROS.map((r,i)=>`<tr><td><b>${i+1}. ${r[0]}</b>${i===2?' <span class="examtag">***</span>':''}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<p class="muted">จากกราฟ Structure Change: Underdeveloped → Developing (ประมาณ 1,036 USD) → Developed (ประมาณ 12,235 USD)</p>
<div class="memo"><b>เทคนิคจำ</b> “ดั้งเดิม → เตรียม → เทคออฟ → เร่ง → อุดม” เหมือนเครื่องบิน: จอด (ดั้งเดิม) → เตรียมบิน → ทะยานขึ้น (Take-off ***) → ไต่ระดับ → บินระดับสูงสบาย ๆ</div>`},
{id:'s8', tag:'กลยุทธ์การพัฒนา', title:'กลยุทธ์การพัฒนาเศรษฐกิจ 4 แบบ', html:`
<div class="tbl"><table><tr><th>กลยุทธ์</th><th>สาระสำคัญ</th></tr>${STRAT.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td></tr>`).join('')}</table></div>
<ul class="dots"><li><b>Balance Growth</b>: Big Push → การผลิตสินค้าทุน + โครงการพื้นฐาน (คมนาคม ประปา ไฟฟ้า) → คนมีงานทำ อำนาจซื้อเพิ่ม → ตลาดใหญ่ขึ้นพอให้ลงทุนต่อ</li><li><b>Unbalance Growth</b>: เช่น ส่งเสริมอุตสาหกรรมรถยนต์ → เกิดอุตสาหกรรมชิ้นส่วนรถยนต์ (<b>Backward Linkage</b>) รัฐสนับสนุนบางอุตสาหกรรมเพื่อให้เชื่อมโยงต้นน้ำ-กลางน้ำ-ปลายน้ำ</li><li><b>Import Substitution</b>: อาจนำไปสู่ความสามารถส่งออกที่เพิ่มขึ้น มีเงินตราต่างประเทศเพิ่ม</li><li><b>Dual Economy</b>: ใช้ในประเทศที่ภาคเกษตรกับอุตสาหกรรมต่างกันมาก พัฒนาเกษตรให้เข้าถึงทุนและเทคโนโลยี</li></ul>`},
{id:'s9', tag:'แผนพัฒนาและปัญหาเศรษฐกิจไทย', title:'แผนพัฒนาฯ และปัญหาเศรษฐกิจไทย', html:`
<ul class="dots"><li>เริ่มจัดทำครั้งแรก <b>พ.ศ. 2504</b> หลังสงครามโลกครั้งที่ 2 โดย<b>ธนาคารโลก</b>เสนอแนะแนวทาง</li><li>เอกสารเรียกว่า “<b>แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ</b>” จัดทำโดย <b>สศช.</b> (สำนักงานสภาพัฒนาการเศรษฐกิจและสังคมแห่งชาติ)</li></ul>
<div class="tbl"><table><tr><th>แผน</th><th>จุดเด่น</th></tr>${PLAN.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}</table></div>
<h4>ปัญหาเศรษฐกิจไทย</h4><ol class="steps"><li>กระจายรายได้ไม่เสมอภาค (ปัญหาเรื้อรัง)</li><li>การออมต่ำ ทำให้การลงทุนต่ำ</li><li>ทรัพยากรธรรมชาติและสิ่งแวดล้อมเสื่อมโทรม</li><li>ขาดดุลการค้าและดุลการชำระเงิน</li><li>การว่างงาน</li><li>เงินเฟ้อ</li><li>ขาดแคลนสิ่งอำนวยความสะดวกพื้นฐาน เช่น ถนน ไฟฟ้า</li></ol>
<h4>วิกฤตต้มยำกุ้ง 2540 (สรุปโดย ศปร.)</h4><ol class="steps"><li>การขาดดุลบัญชีเดินสะพัด</li><li>ปัญหาหนี้ต่างประเทศ</li><li>การลงทุนเกินตัว และฟองสบู่อสังหาริมทรัพย์</li><li>ประสิทธิภาพการดำเนินงานของสถาบันการเงิน</li><li>ความไม่มีประสิทธิภาพในการดำเนินนโยบาย</li><li>การโจมตีค่าเงินบาท</li></ol>`},
{id:'s10', tag:'เศรษฐกิจพอเพียงและทฤษฎีใหม่', title:'ปรัชญาเศรษฐกิจพอเพียงและทฤษฎีใหม่', html:`
<blockquote>“…พอเพียง หมายความว่า พอประมาณ ไม่สุดโต่ง ไม่โลภอย่างมาก คนเราก็อยู่เป็นสุข…” <small>พระบรมราโชวาทของพระบาทสมเด็จพระเจ้าอยู่หัวภูมิพลอดุลยเดช ธันวาคม 2541</small></blockquote>
<figure class="fig">${FIG.sep()}</figure>
<div class="formula">3 ห่วง: พอประมาณ · มีเหตุผล · มีภูมิคุ้มกันในตัวที่ดี<small>2 เงื่อนไข: ความรู้ (รอบรู้ รอบคอบ ระมัดระวัง) · คุณธรรม (ซื่อสัตย์สุจริต ขยัน อดทน สติปัญญา แบ่งปัน)<br>นำไปสู่: เศรษฐกิจ/สังคม/สิ่งแวดล้อม/วัฒนธรรม สมดุล พร้อมรับต่อการเปลี่ยนแปลง (ยึดทางสายกลาง)</small></div>
<h4>ทฤษฎีใหม่ 3 ขั้น</h4>
<ol class="steps"><li><b>ขั้นต้น</b> พึ่งตนเองให้มากที่สุด จัดสรรพื้นที่ทำกินและที่อยู่อาศัยเป็น 4 ส่วน <b>30 : 30 : 30 : 10</b></li><li><b>ขั้นกลาง</b> รวมพลัง รวมกลุ่มกัน ร่วมมือกับทุกฝ่าย (เอกชนและภาครัฐ) เช่น โรงสีข้าวชุมชน</li><li><b>ขั้นก้าวหน้า</b> ติดต่อประสานงานกับภายนอกเพื่อหาแหล่งทุน เช่น ธนาคาร ห้างร้านเอกชน มาขยายกิจการและพัฒนาคุณภาพชีวิต</li></ol>
<div class="tbl"><table><tr><th>ส่วนของพื้นที่ (ขั้นต้น)</th><th>สัดส่วน</th></tr>${NEWTH.map(n=>`<tr><td>${n[0]}</td><td class="num">${n[1]}</td></tr>`).join('')}</table></div>`},
{id:'s11', tag:'Thailand 4.0 แผน 13 และ SDGs', title:'Thailand 4.0 แผนฯ 13 และ SDGs', html:`
<div class="flow"><span>Thailand 1.0 เกษตร (Agriculture)</span><i>→</i><span>2.0 อุตสาหกรรมเบา (Factory)</span><i>→</i><span>3.0 อุตสาหกรรมหนัก (Automation)</span><i>→</i><span class="hl">4.0 นวัตกรรม (Innovation)</span></div>
<p><b>กรอบแผนพัฒนาฯ ฉบับที่ 13 (พ.ศ. 2566–2570)</b> “พลิกโฉมประเทศไทยสู่ เศรษฐกิจสร้างคุณค่า สังคมเดินหน้าอย่างยั่งยืน” (Transformation to Hi-Value and Sustainable Thailand)</p>
<p><b>SDGs 17 เป้าหมาย</b> ของสหประชาชาติ เช่น No Poverty, Zero Hunger, Quality Education, Climate Action, Partnerships for the Goals</p>`}
],
terms:[['Economic Growth','รายได้ต่อบุคคลที่แท้จริงเพิ่มขึ้น (ทางเศรษฐกิจเท่านั้น)'],['Economic Development','รายได้เพิ่มต่อเนื่อง + กระจายเป็นธรรม + คุณภาพชีวิตดี (เปลี่ยนโครงสร้าง)'],['GDP','ผลผลิตที่ผลิตในประเทศ ไม่ว่าใครผลิต'],['GNP','ผลผลิตของคนชาตินั้น ไม่ว่าผลิตที่ไหน'],['Real GNP','Money GNP × 100 ÷ ดัชนีราคา'],['HDI','อายุยืน + การศึกษา + มาตรฐานครองชีพ'],['สศช.','ผู้จัดทำแผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ'],['ทฤษฎีใหม่','แบ่งที่ดิน 30:30:30:10']],

{t:'ms',tag:'Growth vs Development',q:'การพัฒนาเศรษฐกิจตามความหมายในบทเรียนต้องมีองค์ประกอบใด (เลือกทุกข้อที่ถูก)',o:['รายได้ที่แท้จริงเฉลี่ยต่อบุคคลเพิ่มขึ้นอย่างต่อเนื่อง','มีการกระจายรายได้เป็นธรรม','ประชาชนมีคุณภาพชีวิตที่ดี','จำนวนประชากรเพิ่มขึ้นเร็ว'],a:[0,1,2],e:'Development = รายได้แท้จริงต่อหัวเพิ่มต่อเนื่อง + กระจายรายได้เป็นธรรม + คุณภาพชีวิตดี'},
{t:'tf',tag:'Growth vs Development',q:'ประเทศที่ GDP ต่อหัวเพิ่มขึ้น แต่การกระจายรายได้แย่ลงมาก ถือว่ามีการพัฒนาเศรษฐกิจครบถ้วนแล้ว',a:false,e:'นั่นคือการเติบโต (Growth) แต่การพัฒนา (Development) ต้องมีการกระจายรายได้เป็นธรรมและคุณภาพชีวิตดีด้วย'},
{t:'mc',tag:'เครื่องบ่งชี้และ HDI',q:'ดัชนีการพัฒนามนุษย์ (HDI) ประกอบด้วยมิติใด',o:['การมีอายุยืน การศึกษา มาตรฐานการครองชีพ','GDP GNP และ NI','ส่งออก นำเข้า และดุลการค้า','เงินเฟ้อ ว่างงาน และดอกเบี้ย'],a:0,e:'HDI = การมีอายุยืน (อายุขัยเฉลี่ย) + การศึกษา + มาตรฐานการครองชีพ (GDP/หัว)'},

sections:[
{id:'s1',tag:'Communication & Big Picture',title:'Communication คืออะไร และ The Big Picture',html:`
<p class="lead"><b>Communication</b> คือการที่เราเข้าใจสิ่งที่คนอื่นพูดหรือสื่อสาร ส่วน <b>miscommunication</b> (การสื่อสารผิดพลาด) อาจทำให้สถานการณ์แย่ลง</p>
<p>ในยูนิตนี้: เรียนวิธีสื่อสาร คำศัพท์ใหม่ ไวยากรณ์ ฟังบทพูด และฝึกพูด</p>
<h4>The Big Picture: a special coffee shop</h4>
<ul class="dots"><li>ร้านกาแฟอยู่ที่ <b>Indonesia</b></li><li>พนักงานทุกคน <b>deaf</b> (หูหนวก) สื่อสารด้วยภาษามือ</li><li>ป้ายภาษามือแปลว่า <i>"Welcome to our coffee shop."</i></li><li>มีที่แบบนี้อีกหลายแห่ง (Yes, there are lots of other places like this.)</li></ul>`},
{id:'s2',tag:'Communication collocations',title:'1.1 Communication collocations',html:`
<p>อ่านบทความ <i>"A day in the life of…"</i>: <b>Simon</b> เป็น personal assistant ของดาราฮอลลีวูด (ทำงานที่ Hollywood) <b>makes appointments</b> และบางครั้ง <b>tells lies</b> (บอกว่าเจ้านายยุ่ง) · <b>Sonia</b> เป็นนักวิจัยเพนกวินที่ Antarctic <b>sends emails</b> (ถึงหัวหน้าวันละ 1–2 ครั้ง ถึงครอบครัวทุกวัน)</p>
<div class="tbl"><table><tr><th>Verb</th><th>+ Noun</th></tr>
<tr><td><b>ask for</b></td><td>help · advice · directions</td></tr>
<tr><td><b>send</b></td><td>a message · an email · a letter</td></tr>
<tr><td><b>tell</b></td><td>a story · a joke · a lie · the truth</td></tr>
<tr><td><b>make</b></td><td>an announcement · an appointment · a complaint</td></tr></table></div>
<div class="tbl"><table><tr><th>T/F จากบทความ</th><th></th></tr>
<tr><td>Simon only plans work meetings.</td><td>F</td></tr><tr><td>Simon doesn't get much time to relax.</td><td>T</td></tr><tr><td>Simon's boss likes talking to people.</td><td>F</td></tr><tr><td>Sonia never communicates with other people.</td><td>F</td></tr><tr><td>Sonia's brother hardly ever writes to her.</td><td>T</td></tr><tr><td>Sonia is always happy.</td><td>F</td></tr></table></div>
<div class="memo"><b>อาจารย์เสริม</b> for + V-ing / N ใช้บอกจุดประสงค์ เช่น <i>I want to buy flour for making cake.</i></div>`},
{id:'s3',tag:'Simple present & frequency',title:'1.1 Simple present + frequency adverbs & expressions',html:`
<p><b>Simple present</b> ใช้กับข้อเท็จจริงและกิจวัตร/นิสัย: <i>We live in San Francisco. My wife takes the bus every day.</i></p>
<div class="tbl"><table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td>+</td><td>speak</td><td>speak<b>s</b></td></tr><tr><td>−</td><td>don't speak</td><td>doesn't speak</td></tr><tr><td>?</td><td>Do … speak?</td><td>Does … speak?</td></tr><tr><td>Short</td><td>Yes, I do. / No, I don't.</td><td>Yes, she does. / No, she doesn't.</td></tr></table></div>
<h4>Frequency adverbs (0% → 100%)</h4>
<div class="flow">${FREQ.map(f=>`<span>${f[0]}</span>`).join('<i>→</i>')}</div>
<div class="formula">อยู่ <b>หลัง</b> verb to be · อยู่ <b>หน้า</b> verb อื่น<small>I'm sometimes late. · She hardly ever answers. · He often doesn't ask for help. · Are you always good at telling jokes?</small></div>
<p><b>Frequency expressions</b> (once a week, every day, once or twice a day) วางไว้ <b>ต้นประโยค หรือ ท้ายประโยค</b>: <i>Once a week, I call my parents. / I call my parents once a week.</i></p>
<div class="trap"><b>จุดที่มักผิด</b> <s>I am always wake up late.</s> → <b>I always wake up late.</b> (ไม่ใช้ am กับ verb แท้) · <s>before go to bed</s> → <b>before going to bed</b></div>
<h4>เสียง -s / -es ของ he/she/it</h4>
<div class="tbl"><table><tr><th>/s/</th><th>/z/</th><th>/ɪz/</th></tr><tr><td>eats, likes, walks</td><td>spends, feels, goes</td><td>watches, uses, practices</td></tr></table></div>
<p class="muted">ตัวอย่างจากแบบฝึก: Does your job involve…? · She doesn't want… · I usually tell a lie · How often do you speak…? · He always tells… · I don't want…</p>`},
{id:'s4',tag:'Present simple vs continuous',title:'1.2 Simple present vs present continuous',html:`
<div class="cols"><div class="box"><h4>Simple present</h4><p>เรื่องจริงทั่วไป หรือ นิสัย<br><i>I eat my lunch here every day.<br>Do young people often live with their parents?</i></p></div>
<div class="box"><h4>Present continuous (am/is/are + V-ing)</h4><p>ชั่วคราว หรือ กำลังเกิดขึ้นตอนนี้<br><i>Why is nobody dancing?<br>I'm staying with my brother for a week.<br>Kim is wearing a beautiful scarf today.</i></p></div></div>
<div class="formula">State verbs ไม่ใช้รูป continuous<small>be, like, love, hate, need, have, know, want, believe, understand<br><i>I believe her story.</i> NOT <s>I'm believing her story.</s> · <i>Do you know the answer?</i> NOT <s>Are you knowing…?</s></small></div>
<div class="memo"><b>Notice</b> ใช้ <b>always + present continuous</b> เพื่อ<b>บ่น</b>พฤติกรรมคนอื่น: <i>You're always telling me what to do! Paul's always forgetting to wash my cup.</i></div>
<h4>เฉลยแบบฝึก 5a</h4><ol class="steps"><li>Why <b>do you want</b> the job, Max?</li><li><b>I don't drink</b> anything with a lot of sugar in it.</li><li><b>Are they playing</b> right now?</li><li><b>I really like</b> this office. (state verb)</li><li>France <b>is already winning</b> 3–0!</li><li>Paul <b>is talking</b> about you all the time! (บ่น)</li></ol>
<h4>บทสนทนา David & Elena (Santiago)</h4><p class="muted">I <b>don't believe</b> it! · What <b>are</b> you <b>doing</b> here? · You <b>don't live</b> in Santiago. · I<b>'m visiting</b> my mother this week. · I<b>'m meeting</b> her for lunch now. · I <b>remember</b> her so well. · I<b>'m</b> late. · <b>Do</b> you <b>want</b> to get together? · I <b>always go</b> (dentist) · I <b>don't want</b> to miss you. · My mother <b>is waiting</b> for me. · I <b>don't have</b> your number. → David ดีใจที่เจอ Elena แต่ Elena ไม่ค่อยดีใจ</p>
<p>เสียง <b>-ing /ɪŋ/</b>: Are you listen<b>ing</b>? She's not eat<b>ing</b> anything. I'm wait<b>ing</b> for someone.</p>`},
{id:'s5',tag:'Making a good impression',title:'1.2 Making a good impression & commonly confused verbs',html:`
<div class="tbl"><table><tr><th>บทสนทนา</th><th>สถานการณ์</th><th>ผล</th></tr>
<tr><td>Conversation 1</td><td>meeting a partner's parents</td><td>ไม่สำเร็จ: Yolanda <b>criticizes</b> Mrs. Johnson และ Paul</td></tr>
<tr><td>Conversation 2</td><td>interviewing for a job</td><td>ไม่สำเร็จ: Max ไม่กระตือรือร้น อยากได้งานแค่เพื่อให้ชีวิตง่ายขึ้น</td></tr>
<tr><td>Conversation 3</td><td>meeting someone at a party</td><td>สำเร็จ</td></tr></table></div>
<p class="muted">รายละเอียด: Yolanda prefers coffee · Max wants the job because it pays well · Sal and Marco are brothers · Sal is unhappy about the soccer game</p>
<h4>Commonly confused verbs</h4>
<div class="tbl"><table><tr><th>คู่คำ</th><th>ใช้อย่างไร</th></tr>
<tr><td><b>discuss</b> vs argue</td><td>discuss = พูดคุยหารือ (I hardly ever discuss politics with new friends.) · argue = เถียง (Don't argue with them.)</td></tr>
<tr><td><b>meet</b> vs know</td><td>meet = เจอ/พบ (When I meet new people…)</td></tr>
<tr><td><b>see</b> vs look at</td><td>see = เห็น (I often see people embrace.) · look at = มองอย่างตั้งใจ (Don't look at the floor.)</td></tr>
<tr><td><b>say</b> vs tell</td><td>say + คำพูด (I always say "nice to meet you") · tell + คน/ข้อมูล (tell people your opinion)</td></tr>
<tr><td><b>hope</b> vs expect</td><td>hope = หวัง (I hope people like me.) · expect = คาดว่า (Don't expect to become friends immediately.)</td></tr>
<tr><td><b>realize</b> vs notice</td><td>realize = ตระหนัก/รู้ตัว (they always realize that I'm shy) · notice = สังเกตเห็น (Notice how the other person speaks.)</td></tr></table></div>`},
{id:'s6',tag:'Emotion adjectives & reading',title:'1.3 Showing your emotions: approach a text & emotion adjectives',html:`
<div class="formula">Skill: approach a text<small>ก่อนอ่าน ให้ทำความคุ้นเคยกับบทความ: ดูรูป อ่านชื่อเรื่องและหัวข้อ แล้วเดาเนื้อหา · อ่าน<b>ประโยคแรก</b>ของแต่ละย่อหน้า ซึ่งมักบอก <b>main idea</b></small></div>
<h4>The Secrets of Body Language</h4>
<div class="tbl"><table><tr><th>ย่อหน้า</th><th>Heading</th><th>ใจความ</th></tr>
<tr><td>1</td><td>Always communicating</td><td>มนุษย์ทำและจดจำสีหน้าราว <b>25,000</b> แบบต่อวัน แต่คนทั่วไปพูดเพียงราว <b>15,000</b> คำต่อวัน</td></tr>
<tr><td>2</td><td>Understanding other people</td><td>อารมณ์บางอย่างอ่านง่าย สีหน้า<b>เหมือนกันทั่วโลก</b> · เท้าชี้ออก = เพื่อนไม่เห็นด้วย · เกาจมูก/มองหลบ = อาจโกหก</td></tr>
<tr><td>3</td><td>Understanding yourself</td><td>จับคอ ดึงปกเสื้อ = <b>stressed</b> ให้หยุดพัก ทำตัวให้ calm</td></tr>
<tr><td>4</td><td>Improving relationships</td><td>เราเลียนแบบท่าทางคนที่สบายใจด้วย · เงยหน้า เปิดตัว ไม่กอดอก = <b>confident</b> ดูน่าดึงดูด · เลิกก้มดูโทรศัพท์</td></tr></table></div>
<p><b>Best summary:</b> c. Body language is an important part of how we communicate, and we can learn to control it.</p>
<p class="muted">T/F: Humans communicate more with faces and bodies than with words (T) · People in different countries make different expressions (F) · More than one sign that someone is lying (T) · Touching your neck is a sign of confidence (F) · Copying each other's body language is a good sign (T) · Looking at your phone makes you more attractive (F)</p>
<h4>Emotion adjectives</h4>
<div class="tbl"><table><tr><th>Word</th><th>Definition</th><th>+/−</th></tr>${EMO.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td>${e[2]==='+'?'Positive':'Negative'}</td></tr>`).join('')}</table></div>
<div class="memo"><b>เทคนิคจำ</b> Positive มี 4 คำ: <b>c</b>alm, <b>c</b>heerful, <b>c</b>onfident, surprised (3 ตัว C + surprised) ที่เหลือเป็น negative</div>`},
{id:'s7',tag:'Checking understanding',title:'1.4 What did you say? Checking understanding',html:`
<p>วิดีโอ <i>Patrick speaks</i> · ประโยคเช็กความเข้าใจ:</p>
<div class="tbl"><table>${CHK.map((c,i)=>`<tr><td class="num">${i+1}</td><td>${c[0].replace('___','<b>'+c[1]+'</b>')}</td></tr>`).join('')}</table></div>
<div class="cols"><div class="box"><h4>ขอให้พูดซ้ำ/ไม่เข้าใจ</h4><p>Sorry, could you say that again, please? · I'm sorry, but I don't understand.</p></div><div class="box"><h4>เช็กว่าเข้าใจถูก / ยืนยัน</h4><p>Did you say…? · Do you mean…? · Is that right? · OK, I've got it. · Oh, I see what you mean. · Exactly!</p></div></div>
<p class="muted">Speaking activity: How often do you call your parents?</p>`}

id:'u2',num:2,icon:'leaf',title:'Back to nature',en:'กลับสู่ธรรมชาติ',
blurb:'Simple past, -ed endings, past time expressions, past continuous, animals, geographical features, telling a story',
sections:[
{id:'s1',tag:'Big Picture',title:'Warm-up & The Big Picture: getting away from it all',html:`
<p>Warm-up สถานที่ธรรมชาติในไทย: <b>Phu Kradueng</b> · <b>Red Lotus Sea, Udon Thani</b> · <b>Koh Lipe</b> (Where is this place? How do you feel?)</p>
<ul class="dots"><li>Where is it? → <b>It's in Switzerland.</b></li><li>Time? → <b>It's early in the morning, in the spring.</b></li><li>What is the man doing? → <b>He's hiking/walking.</b></li></ul>
<p class="muted">Discuss: Where do you go if you want to "get away from it all"? — I sometimes go camping in the mountains with my friends. It's a nice change from city life.</p>`},
{id:'s2',tag:'Survival reading',title:'2.1 Survival: reading',html:`
<p>บทความทั้งสองเรื่องเกี่ยวกับ <b>คนที่รอดชีวิตหลังหลงทางในชนบท/ป่า</b></p>
<div class="cols"><div class="box"><h4>A Cold Walk Home</h4><p><b>Christopher Traverse</b> (ชาวแคนาดา) snowmobile <b>broke down</b> กลางฤดูหนาว รู้ว่าหลงทาง ไม่มีโทรศัพท์ จำรายการทีวี <b>Survivorman</b> (Les Stroud) ได้ · ทำ <b>shelters out of trees</b> · ดื่ม <b>snow</b> · ตื่นเช้าเดินทั้งวัน · <b>วันที่ 4</b> เจอถนนกลับบ้าน</p></div>
<div class="box"><h4>River Rescue</h4><p>A few years ago <b>Rory & Chiara Maddocks และ Rachel Hodson</b> หลงในป่าฝน <b>central Malaysia</b> กลัวสัตว์ป่า ไม่มีอาหาร น้ำ เครื่องมือ · จำเคล็ดลับจาก <b>Ray Mears's Extreme Survival</b> · <b>เดินตามแม่น้ำ</b>จนถึงทะเล ว่ายออกไป เด็กผู้ชายบนเรือช่วยไว้ <b>หลังจาก 2 คืน</b> · "You never know when you might need it."</p></div></div>`},
{id:'s3',tag:'Simple past',title:'2.1 Grammar: simple past (S + V2)',html:`
<div class="formula">Past simple: S + V2<small>ใช้กับเหตุการณ์ที่เกิดขึ้นใน<b>อดีตและจบไปแล้ว</b></small></div>
<div class="tbl"><table><tr><th></th><th>ตัวอย่าง</th></tr><tr><td>+</td><td>They <b>walked</b> along a river. They <b>saw</b> the sea.</td></tr><tr><td>−</td><td>He <b>didn't have</b> a cell phone with him.</td></tr><tr><td>?</td><td><b>Did</b> they <b>have</b> any water to drink? How <b>did</b> the three people <b>survive</b>?</td></tr></table></div>
<div class="cols"><div class="box"><h4>Regular (+ed)</h4><p>${REG.slice(0,6).map(r=>r[1]).join(', ')}</p></div><div class="box"><h4>Irregular</h4><p>was/were, broke, could, lost, swam, thought</p></div></div>
<h4>เสียง -ed</h4><div class="tbl"><table><tr><th>/t/</th><th>/d/</th><th>/ɪd/</th></tr><tr><td>finished, stopped, washed, reached</td><td>realized, stayed, tried, remembered</td><td>needed, started, wanted, decided</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> ลงท้ายด้วยเสียง <b>t / d</b> → อ่าน /ɪd/ · เสียงไม่ก้อง (p, k, s, sh, ch) → /t/ · ที่เหลือ → /d/</div>
<h4>Bear Grylls: แก้ 5 จุดผิด</h4><p><s>were</s> → <b>was</b> · <s>spended</s> → <b>spent</b> · <s>tryed</s> → <b>tried</b> · <s>didn't completed</s> → <b>didn't complete</b> · <s>breaked</s> → <b>broke</b></p>
<div class="trap"><b>จุดที่มักผิด</b> หลัง did / didn't ใช้ <b>V1</b> เสมอ: <s>didn't completed</s> → didn't complete</div>
<p class="muted">Megan Hine: How <b>did</b> Megan <b>learn</b> · she <b>climbed</b> the highest mountain in Wales (when she was six) · in 2006 she <b>lived</b> in a forest 3 months · <b>caught</b> fish · <b>washed</b> in a cold lake at 5:00 a.m. · <b>didn't take</b> a shower · Dec 2007 <b>got</b> very sick · almost <b>died</b> a few years ago (lions <b>tried</b> to eat her, Namibia) · What <b>did</b> she <b>do</b> in 2016? <b>decided</b> to write <i>Mind of a Survivor</i> · I <b>finished</b> it last night.</p>`},
{id:'s4',tag:'Past time expressions',title:'2.1 Vocabulary: past time expressions',html:`
<div class="tbl"><table><tr><th>รูปแบบ</th><th>ตัวอย่าง</th></tr>
<tr><td><b>in</b> + season / month / year</td><td>in the summer · in 2006 · in December</td></tr>
<tr><td><b>on</b> + day / date</td><td>on Sunday · on April 3rd</td></tr>
<tr><td><b>at</b> + celebrations / time of day</td><td>at New Year · at 5:00 a.m.</td></tr>
<tr><td>point in time + <b>ago</b></td><td>two days ago · a few years ago</td></tr>
<tr><td><b>when</b> + past clause</td><td>when I was a child · when she was six</td></tr>
<tr><td><b>last</b> + night / week / month / year</td><td>last week · last night</td></tr></table></div>
<div class="trap"><b>จุดที่มักผิด</b> ไม่ใช้ in/on/at กับ last และ ago: <s>in last week</s> → last week · <s>on two days ago</s> → two days ago</div>`},
{id:'s5',tag:'Past continuous',title:'2.2 Animals to the rescue: past continuous & simple past',html:`
<div class="formula">Past continuous: S + was/were + V-ing</div>
<div class="cols"><div class="box"><h4>Action in progress</h4><p>การกระทำที่<b>กำลังดำเนินอยู่</b>ในช่วงเวลาหนึ่งในอดีต<br><i>In 2019, I was working at the San Diego zoo.</i></p></div><div class="box"><h4>Completed action แทรก</h4><p>เหตุการณ์สั้นที่จบแล้ว (simple past) <b>แทรก</b>เหตุการณ์ที่กำลังทำอยู่<br><i>We saw a bear while we were driving.<br>We were driving when we saw a bear.</i></p></div></div>
<div class="memo"><b>เทคนิคจำ</b> <b>while</b> + was/were V-ing (เรื่องยาว) · <b>when</b> + V2 (เรื่องสั้นที่แทรก) เช่น He came while I was cooking. · I was sleeping when he came.</div>
<h4>Nan Hauser & the whale (Cook Islands, Oct 2017)</h4>
<p>She <b>was studying</b> whales · She and a photographer <b>were swimming</b> when she <b>saw</b> a whale · She <b>turned</b> around while she <b>was getting</b> out of the water.</p>
<p class="muted">T/F: Nan was alone (F) · The whale pushed her hard (F) · She was scared (T) · The whale saw the shark before Nan (T) · There are many stories of whales protecting humans (F)</p>
<p class="muted">João's party: were using a laptop · wasn't eating · was choosing music · weren't playing cards · were dancing · was reading · Story: The sun <b>was shining</b>, we <b>were riding</b> bikes when we <b>heard</b> dogs … while we <b>were coming</b> around a corner, a dog <b>jumped</b> out … we <b>screamed</b> … they <b>ran</b> away.</p>
<p>ออกเสียง <b>was/were</b> แบบ unstressed (weak form) ในประโยค: The family <i>was</i> sleeping.</p>`},
{id:'s6',tag:'Animals',title:'2.2 Vocabulary: animals',html:`
<div class="tbl"><table><tr><th>Bugs</th><th>Young animals</th><th>Sea animals</th><th>Wild animals</th></tr>
<tr><td>ant, bee, butterfly, mosquito, spider</td><td>kitten, lamb, puppy</td><td>dolphin, seal, shark, whale</td><td>camel, gorilla, tiger</td></tr></table></div>`},
{id:'s7',tag:'Geographical features',title:'2.3 Imagined landscapes: identify key points & geography',html:`
<div class="formula">Skill: identify key points<small>ฟังไม่ต้องเข้าใจทุกคำ แต่ต้องจับประเด็นหลัก: ฟังคำที่<b>ซ้ำ</b>หรือคำความหมายใกล้กัน · ฟังคำที่<b>เน้นเสียง</b> · ฟัง<b>เรื่องเล่า ตัวอย่าง คำอธิบาย</b>ที่เน้นประเด็น</small></div>
<div class="tbl"><table><tr><th>Place</th><th>Country</th><th>Movie / Series</th></tr>
<tr><td>Gaztelugatxe (a)</td><td>Spain</td><td>Game of Thrones</td></tr><tr><td>Koh Phi Phi Le (b)</td><td>Thailand</td><td>The Beach</td></tr><tr><td>Wadi Rum (c)</td><td>Jordan</td><td>Lawrence of Arabia, Rogue One, The Martian</td></tr></table></div>
<p class="muted">They film in Gaztelugatxe in the <b>winter</b> · There's not a <b>castle</b> on the island (computer generated) · Wadi Rum: location of <b>a lot of</b> movies · Tourists come to see the <b>cave art</b> · Before <i>The Beach</i>, Koh Phi Phi Le had a <b>beautiful and natural</b> beach · <b>Lots of tourists</b> destroyed the beach</p>
<h4>Geographical features</h4>
<div class="tbl"><table>${GEO.map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td></tr>`).join('')}</table></div>
<p class="muted">a: beach on the south coast, tall cliffs, yellow sand, cold ocean, big waves · b: jungle in Brazil, low valley, river full of rocks, small path · c: cave in Thailand, waterfall, water falls into a stream</p>`},
{id:'s8',tag:'Telling a story',title:'2.4 A great story: telling a story and reacting',html:`
<div class="cols"><div class="box"><h4>Telling a story</h4><p>That reminds me of … · Did I ever tell you about …? · It was … · One day, … · Anyway, … · I was … when suddenly … · In the end, …</p></div>
<div class="box"><h4>Reacting to a story</h4><p><b>Surprise:</b> Really? / No way!<br><b>Interest:</b> Keep going. / Then what happened?<br><b>Bad news:</b> Oh, no. / That's awful!<br><b>Good news:</b> That's great. / Lucky for you!</p></div></div>
<h4>เรียงเรื่อง wasps</h4><ol class="steps"><li>Did I ever tell you about the wasps?</li><li>It was last year when we were studying for our exams.</li><li>One day, we decided to go to Jenny's house.</li><li>Anyway, at lunchtime we decided to have a picnic.</li><li>We were just starting to eat when suddenly we saw lots of wasps.</li><li>In the end, I had to go home on the metro with wet clothes!</li></ol>
<p class="muted">Cows story: That <b>reminds</b> me … · It <b>happened</b> when I was visiting my grandparents · Keep <b>going</b> · when <b>suddenly</b> … cows · <b>Really</b>? · Oh <b>no</b>! · <b>No</b> way! · In the <b>end</b> …</p>
<p>Showing interest: น้ำเสียงต้อง<b>ขึ้นสูงและมีชีวิตชีวา</b>จึงฟังดูสนใจ</p>`}
],

{tag:'Simple past',f:()=>{const[v,p]=H.pick(REG.concat(IRR)),s=H.pick(['She','They','My brother','We','He']);const neg=Math.random()<.5;return{t:'mc',q:neg?`Make it negative: "${s} ${p.split('/')[0]} it yesterday."`:`Make a question: "${s} ${p.split('/')[0]} it yesterday."`,o:neg?H.opts(`${s} didn't ${v} it yesterday.`,[`${s} didn't ${p.split('/')[0]} it yesterday.`,`${s} don't ${v} it yesterday.`,`${s} wasn't ${v} it yesterday.`]):H.opts(`Did ${s.toLowerCase()==='i'?'I':s.toLowerCase()} ${v} it yesterday?`,[`Did ${s.toLowerCase()} ${p.split('/')[0]} it yesterday?`,`Does ${s.toLowerCase()} ${v} it yesterday?`,`Was ${s.toLowerCase()} ${v} it yesterday?`]),a:0,e:'did / didn\'t + V1'}}},
{tag:'Simple past',f:()=>{const[w,s]=H.pick(ED);return{t:'mc',q:`How is the -ed ending in "${w}" pronounced?`,o:H.opts(s,['/t/','/d/','/ɪd/']),a:0,e:'/t/ finished, stopped, washed · /d/ realized, stayed, tried · /ɪd/ needed, started, wanted'}}},
{tag:'Past time expressions',f:()=>{const[n,p]=H.pick(TIME);return{t:'mc',q:`Complete: "I saw her ___ ${n}."`,o:H.opts(p,['in','on','at']),a:0,e:'in + season/month/year · on + day/date · at + celebration/time of day'}}},
{tag:'Past continuous',f:()=>{const s=H.pick([['I','was','cooking','dinner','the phone rang','cooked'],['They','were','playing','soccer','it started to rain','played'],['She','was','walking','the dog','she saw a snake','walked'],['We','were','watching','TV','the lights went out','watched'],['He','was','driving','to work','he had an accident','drove'],['My mom','was','reading','a book','I came home','read'],['The kids','were','swimming','in the lake','they heard a noise','swam'],['I','was','studying','for my exam','my friend called','studied']]);const[sub,be,ing,rest,cl,v2]=s;return{t:'mc',q:`"${sub} ___ ${rest} when ${cl}."`,o:H.opts(`${be} ${ing}`,[v2,`${be==='was'?'were':'was'} ${ing}`,`is ${ing}`]),a:0,e:'Long action in progress → was/were + V-ing; the short action (when …) → simple past'}}},

{id:'s1',tag:'Icon & Big Picture',title:'What is an icon? & The Big Picture',html:`
<div class="formula">icon (noun)<small>An icon can be an image, a person, or a building that people recognize immediately. It usually represents something. (อาจารย์: icon = something "outstanding")</small></div>
<h4>Lunch at the top of a skyscraper</h4>
<ul class="dots"><li>คนอยู่บน skyscraper ใน <b>New York City และ London</b> · กำลัง <b>having lunch</b></li><li>ภาพที่ 1: <b>workers</b> ที่กำลังสร้างตึก · ขาวดำ · ผู้ชายทั้งหมด ดูจริงจัง</li><li>ภาพที่ 2: คนที่ <b>ชนะการแข่งขัน</b>ของบริษัท food delivery · ภาพสี · ผู้หญิงทั้งหมด หัวเราะ</li></ul>`},

{id:'s3',tag:'Frida Kahlo',title:'3.1 Listening: Frida Kahlo',html:`
<p>โปสเตอร์นิทรรศการ <b>Frida Kahlo, Museum of Modern Art, May 4 – July 31</b></p>
<div class="formula">Why is Frida Kahlo an icon?<small>She is an icon because of her <b>work</b>, but also because of her <b>life</b>. She faced a lot of problems, and she represents a <b>strong, independent woman</b> at a time when a lot of people thought women were less important than men.</small></div>
<div class="tbl"><table><tr><th>Statement</th><th>T/F</th></tr><tr><td>It's easy to buy tickets for the exhibit today.</td><td>F</td></tr><tr><td>There are lots of products with Frida Kahlo's image.</td><td>T</td></tr><tr><td>Frida Kahlo was a doctor before she was an artist.</td><td>F</td></tr><tr><td>She started painting because she couldn't walk.</td><td>T</td></tr><tr><td>A lot of her paintings are about her personal feelings.</td><td>T</td></tr><tr><td>The exhibit doesn't have any of her paintings.</td><td>F</td></tr></table></div>
<h4>An Indian Icon: Mahatma Gandhi</h4><p>Mural of <b>Mahatma Gandhi</b> → icon because he <b>campaigned for Indian independence from the UK</b>. นักการเมืองและผู้นำสิทธิพลเมือง ไปลอนดอนตอนอายุ 18 เรียนกฎหมาย เป็นทนายใน South Africa กลับอินเดีย 1915 รณรงค์กว่า 30 ปีด้วย <b>peaceful protest</b> · ถนนกว่า 50 สาย ใช้ชื่อเขา · อยู่บนแสตมป์และธนบัตร · mural สูง <b>46 เมตร</b></p>`},
{id:'s4',tag:'Questions',title:'3.1 Grammar: question review',html:`
<div class="formula">Question word + Auxiliary verb + Subject + Main verb<small>What <b>did</b> she <b>have</b>? · Why <b>do</b> people <b>love</b> Frida?</small></div>
<div class="tbl"><table><tr><th>Wh-</th><th>ถามเกี่ยวกับ</th><th>ตัวอย่าง</th></tr>${WH.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td><i>${w[2]}</i></td></tr>`).join('')}</table></div>
<h4>Auxiliary verbs</h4><p>Verb to be · can, could · do, does · will, would · have, has</p>
<div class="cols"><div class="box"><h4>do/does/did + V1</h4><p><i>Do you know him?</i> Yes, I do. / No, I don't.</p></div><div class="box"><h4>be + noun/adjective</h4><p><i>Is he a singer?</i> Yes, he is. / No, he isn't.</p></div></div>
<p class="muted">เฉลย 6a: <b>Are</b> tickets selling well? · Why <b>do</b> people love Frida? · What problems <b>did</b> she have? · What <b>was</b> she planning to study? · What <b>can</b> you see?</p>
<div class="memo"><b>Intonation</b> Yes/No question → เสียง<b>ขึ้น</b> ↗ ท้ายประโยค · Wh- question → เสียง<b>ลง</b> ↘ ท้ายประโยค</div>`},

<h4>Podcast</h4><div class="tbl"><table><tr><th>Building</th><th>Why famous</th></tr>
<tr><td>Leaning Tower of Pisa, Italy (tower)</td><td>it looks dangerous · 2001 declared safe for another <b>200</b> years</td></tr>

<tr><td>Notre Dame, Paris (cathedral)</td><td>inspired <i>The Hunchback of Notre Dame</i> (<b>1831</b>)</td></tr>
<tr><td>The Blue Mosque, Istanbul (mosque)</td><td>famous for <b>20,000</b> blue tiles</td></tr>
<tr><td>Bran Castle, Romania (castle)</td><td>described in the novel <i>Dracula</i> · built in <b>1211</b></td></tr></table></div>`},
{id:'s6',tag:'Relative clauses',title:'3.2 Grammar: relative clauses',html:`
<div class="tbl"><table><tr><th>Relative pronoun</th><th>ใช้กับ</th></tr><tr><td><b>who / that</b></td><td>people</td></tr><tr><td><b>where</b></td><td>places</td></tr><tr><td><b>when</b></td><td>times</td></tr><tr><td><b>that / which</b></td><td>things</td></tr></table></div>
<h4>รวมประโยค (ตัดสรรพนามที่ซ้ำ)</h4>
<ul class="dots"><li>This is the photo. I took <s>it</s> on vacation. → This is the photo <b>that/which</b> I took on vacation last year.</li><li>These are the people. We met <s>them</s> at the hotel. → These are the people <b>who/that</b> we met at the hotel.</li><li>That was the night. We arrived at the hotel. → That was the night <b>when</b> we arrived (ใช้ that แทน when ได้)</li></ul>
<div class="memo"><b>Stress</b> who/when/where/which ถูก<b>เน้นเสียง</b>เมื่อเป็นคำถาม (<u>Who</u> do you live with?) แต่<b>ไม่เน้น</b>เมื่อเป็น relative clause (This is the friend who I live with.)</div>
<p class="muted">Bristol: bridge, cathedral, skyscraper, tower · the place <b>where</b> you can see all of Bristol = top of Cabot Tower · the place <b>that</b> shows foreign films = the Watershed · a time <b>when</b> the streets are full · the one person <b>who</b> everyone wants to see = Banksy · the thing <b>that</b> tourists love = Clifton Suspension Bridge</p>`},
{id:'s7',tag:'Agreeing & disagreeing',title:'3.4 That\'s a good point! Agreeing and disagreeing',html:`
<div class="tbl"><table><tr><th>Agreeing</th><th>Disagreeing</th><th>Partly agreeing</th></tr>
<tr><td>That's a good point. · I totally agree. · That's (so) true. · Absolutely! · I guess/suppose so.</td><td>I'm not sure I agree with that. · I'm afraid I disagree. · I don't think so. · I completely disagree. · No way!</td><td>I see your point, but … · I know what you mean, but … · True, but, actually, …</td></tr></table></div>
<div class="tbl"><table><tr><th>Expression</th><th>Strong / Weak</th></tr><tr><td>Absolutely! I totally agree.</td><td>Strong</td></tr><tr><td>I'm not sure I agree with that.</td><td>Weak</td></tr><tr><td>No way! I completely disagree.</td><td>Strong</td></tr><tr><td>I suppose so.</td><td>Weak</td></tr></table></div>

id:'u4',num:4,icon:'cap',title:'Learning by doing',en:'เรียนรู้จากการลงมือทำ',
blurb:'Skill vs degree, education collocations, going to & present continuous, can\'t/have to, dependent prepositions, -ed/-ing, making plans',
sections:[
{id:'s1',tag:'Skills & Big Picture',title:'Warm-up: skill, degree, experience & The Big Picture',html:`
<div class="tbl"><table><tr><th>Word</th><th>Meaning</th></tr><tr><td><b>Skill</b> (n)</td><td>ability to do an activity well</td></tr><tr><td><b>Degree</b> (n)</td><td>level of education</td></tr><tr><td><b>Experience</b> (n)</td><td>process of getting knowledge and skill</td></tr><tr><td><b>Connection</b> (n)</td><td>being related to someone or something</td></tr></table></div>
<div class="formula">Degree vs Skill: The Simple Truth<small>A degree can help you get a job, but your skills help you keep the job and grow in it.</small></div>
<div class="cols"><div class="box"><h4>Hard skills</h4><p>subject matter expertise · math & statistics knowledge · data & technical skill</p></div><div class="box"><h4>Soft skills</h4><p>problem solving · storytelling · curiosity · communication · creativity</p></div></div>
<h4>The Big Picture: learning languages</h4><p>ผู้ชายอยู่ใน <b>college Language Center</b> เรียน <b>French และ Italian</b> · ดีเพราะ<b>พัฒนาการออกเสียง</b>และ<b>เรียนตามความเร็วตัวเอง</b> · น่าเบื่อเพราะบางทีแค่ฟังแล้วพูดตาม · อยากเป็น <b>diplomat</b></p>`},
{id:'s2',tag:'Education collocations',title:'4.1 Skills or degree? Education collocations',html:`
<p>บล็อก <i>"College wasn't for me"</i> (Ben Frankle): อยากทำงานท่องเที่ยว → สอบผ่านตอน ม.ปลาย → ไปเรียนภาษาที่ college แต่ไม่ได้ปริญญา → <b>fail</b> สอบเยอรมันปีแรก เลยลาออก → ตอนนี้เรียนทำอาหาร part time → ได้ work experience ที่โรงแรม → practical ไม่ต้องสอบหรือเขียน essay → อยากเป็น <b>chef</b></p>
<div class="tbl"><table><tr><th>Verb</th><th>Collocation</th></tr>${EDU.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td></tr>`).join('')}</table></div>
<div class="memo"><b>Notice</b> Compulsory education = elementary school, middle school, high school · หลังจากนั้นเลือกไป <b>college</b> เพื่อ get a degree หรือ <b>vocational school</b> เพื่อเรียนหลักสูตรเชิงปฏิบัติ</div>
<h4>Listening: Beth & Tom</h4><ul class="dots"><li>Beth อยากทำงาน <b>computer animation</b> · Tom อยากทำงาน <b>computer technology</b></li><li>Tom วางแผนหา <b>work experience</b> (ทำงานกับเพื่อนพ่อ) · Beth จะเรียน <b>degree</b> (University of Rochester)</li><li>Beth คิดว่าหางาน computer animation ยาก · ทำงานระหว่างเรียนเพราะ <b>ต้องการเงิน</b></li><li>Tom มีงานรอแล้วตอนจบ ม.ปลาย · ไม่เรียน college เพราะ <b>industry changes very quickly</b></li></ul>`},
{id:'s3',tag:'Plans & intentions',title:'4.1 Grammar: going to & present continuous for plans',html:`
<div class="cols"><div class="box"><h4>be going to + V1 = Intentions</h4><p>ความตั้งใจ<br><i>I am going to take a Thai food cooking class.<br>Are you going to study abroad?<br>She is going to join the music contest.</i></p></div>
<div class="box"><h4>Present continuous (be + V-ing) = Plans/arrangements</h4><p>แผนที่นัดหมาย/จัดเตรียมแล้ว หรือกำลังทำตอนนี้<br><i>I am watching a movie this weekend.<br>I am not going anywhere today.<br>They are playing a game tonight.</i></p></div></div>
<div class="memo"><b>เทคนิคจำ</b> มีตั๋ว/นัด/เวลาชัดเจน → present continuous (We <b>are going</b> to a festival tomorrow. We have our tickets.) · แค่ตั้งใจ → going to (I<b>'m going to buy</b> new shoes soon.)</div>
<p>ออกเสียง <b>going to</b> เป็น "gonna" เมื่อตามด้วย base form · Time expressions: next month, next week, next year, this evening, tomorrow</p>
<p class="muted">เฉลย 9a: are going · 'm playing · are … going to get · 'm going to give · 's traveling · is … going to stay/staying · 's living/going to live · 'm not writing · 'm going · are … going to do · 's visiting · 'm going to buy · Are … going to try</p>`},
{id:'s4',tag:'can\'t / have to',title:'4.2 School days: can\'t, (don\'t) have to, must',html:`
<div class="tbl"><table><tr><th>Form</th><th>ความหมาย</th><th>ตัวอย่าง</th></tr>
<tr><td><b>can't</b> + V1</td><td>ผิดกฎ / ไม่อนุญาต</td><td>You can't wear a bikini in the classroom.</td></tr>
<tr><td><b>have to</b> + V1</td><td>กฎ / ข้อบังคับ (จำเป็น)</td><td>I have to go to work at 9 o'clock.</td></tr>
<tr><td><b>don't have to</b> + V1</td><td>ไม่จำเป็น แต่ถ้าอยากทำก็ทำได้</td><td>You don't have to do this exercise.</td></tr>
<tr><td><b>must</b> + V1</td><td>ความจำเป็นจากความตั้งใจของตัวเอง</td><td>I must leave home early; I want to buy breakfast.</td></tr></table></div>
<div class="trap"><b>จุดที่มักสับสน</b> <b>can't</b> = ห้าม · <b>don't have to</b> = ไม่ต้องก็ได้ (ไม่ใช่ห้าม)</div>
<h4>Swimming Pool (Adults $5.00, Children free)</h4><p>Adults <b>have to pay</b> · Children <b>don't have to pay</b> · You <b>can't run</b> · You <b>have to take</b> a shower · You <b>can't eat</b> in the pool</p>
<h4>School rules around the world</h4><ul class="dots"><li>U.S.: students <b>have to</b> wear special indoor shoes</li><li>China: students <b>have to</b> sleep 30 minutes after lunch at their desks</li><li>UK: some teachers <b>can't</b> use a red pen; they <b>have to</b> use purple or green</li><li>Sydney: children <b>can't</b> stand on their hands in the playground</li><li>Japan: students <b>don't have to</b> stay in every night, but some <b>have to</b> ask their teacher</li><li>France: students <b>can't</b> have tomato ketchup ("too American")</li></ul>
<p>ออกเสียง: have to /hæftə/ · has to /hæstə/</p>`},

{id:'s6',tag:'-ed / -ing adjectives',title:'4.3 Learning about cultures: -ed/-ing adjectives',html:`
<div class="formula">Skill: listen for specific information<small>ก่อนฟัง ดูโน้ตแล้วเดาว่าข้อมูลที่ขาดเป็นประเภทอะไร (สถานที่ ตัวเลข เครื่องดนตรี สี การกระทำ สิ่งของ)</small></div>
<h4>Museum of Romani Culture, Brno, Czech Republic</h4><ul class="dots"><li>Roma people originally came from <b>India</b> · moved to Europe <b>1,500</b> years ago · more than <b>one million</b> live in the U.S.</li><li>prefer small instruments like the <b>violin</b> · inspired Django Reinhardt</li><li>many Romani clothes are <b>red</b> (lucky color)</li><li>many Roma people don't <b>read</b> or <b>write</b> the language · enjoy telling <b>stories</b></li></ul>
<div class="cols"><div class="box"><h4>-ed</h4><p>บอก<b>ความรู้สึกของเรา</b><br><i>I am bored with this class.</i></p></div><div class="box"><h4>-ing</h4><p>บอก<b>สิ่ง/คนที่ทำให้เรารู้สึก</b><br><i>This class is boring.</i></p></div></div>
<div class="tbl"><table><tr><th>Positive</th><th>Negative</th></tr><tr><td>amazing/amazed · exciting/excited · relaxing/relaxed · interesting/interested</td><td>boring/bored · confusing/confused · disappointing/disappointed · embarrassing/embarrassed · shocking/shocked · tiring/tired</td></tr></table></div>
<h4>Word stress</h4><div class="tbl"><table><tr><th>Oo</th><th>oO</th><th>oOo</th><th>Ooo</th></tr><tr><td>boring, shocking, tiring</td><td>annoyed, amazed, confused</td><td>excited, confusing, embarrassed</td><td>interested, interesting</td></tr></table></div>`},
{id:'s7',tag:'Making plans',title:'4.4 What are you doing this weekend? Making plans',html:`
<div class="tbl"><table><tr><th>Asking</th><th>Responding</th></tr>
<tr><td>What are you doing / up to …?</td><td>Nothing special. / Not much. / I'm … / I have …</td></tr>

<div class="memo"><b>Notice</b> <b>How/What about …?</b> และ <b>Do you feel like …?</b> ตามด้วย <b>V-ing</b>: How about go<b>ing</b> for a walk? Do you feel like hav<b>ing</b> pizza?</div>

{id:'s1',tag:'Asking for help',title:'Getting help: phrases',html:`

<div class="chips"><span>Could you do me a favor?</span><span>I need help. / Do me a favor.</span><span>Can you help me?</span><span>Can you give me a hand?</span><span>Would you mind helping me?</span></div>
<div class="memo"><b>Notice</b> Would you mind + <b>V-ing</b>: Would you mind help<b>ing</b> me?</div>`},
{id:'s2',tag:'have take do make',title:'5.1 Help! Be Happy podcast & collocations with have, take, do, make',html:`
<p>Podcast <b>Be Happy</b>: Marina Gonzales ตอบอีเมลคนที่ต้องการคำแนะนำเรื่องความสุข</p>
<div class="tbl"><table><tr><th>คน</th><th>ปัญหา</th><th>คำแนะนำของ Marina</th></tr>
<tr><td><b>Harry, 19</b></td><td>ย้ายไปเรียนเมืองอื่น เหงา (lonely, miserable) รูมเมตไม่คุยด้วย ต้องสอบเดือนหน้า อยากย้ายกลับบ้าน ต้อง make a decision</td><td>(c) <b>exercising / go to the gym</b> · I think you should join a club · you can't compare their lives to your own</td></tr>
<tr><td><b>Tanya, 24</b></td><td>เปลี่ยนงานแล้วคิดว่า made a mistake ออฟฟิศยุ่ง ไม่มีใคร take a break ต้อง make excuses กับหัวหน้า ได้เงินมากขึ้นแต่ไม่มีความสุข ควร take a chance and quit ไหม</td><td>(b) <b>taking a break / going for a walk</b> · You have to take breaks at work! · I don't think you should quit your job</td></tr>
<tr><td><b>Esther, 22</b></td><td>ชีวิตดีทุกอย่าง แต่รู้สึกไม่มีความหมาย</td><td>(a) <b>volunteering / helping people</b> · you should find out who needs help in your community · You shouldn't feel silly</td></tr></table></div>
<div class="tbl"><table><tr><th>have</th><th>take</th><th>do</th><th>make</th></tr>
<tr><td>an argument, fun, a problem</td><td>advantage of, a break, a chance, a class, an exam, a nap, my/your time</td><td>my/your best, homework, someone a favor, something wrong</td><td>a decision, an effort, an excuse, a mistake, money</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> <b>make</b> = สร้าง/ผลิตบางอย่างขึ้นมา (decision, money, mistake) · <b>do</b> = งาน/กิจกรรม (homework, best) · <b>take</b> = ใช้/ถือเอา (break, chance, exam) · <b>have</b> = ประสบ (fun, problem, argument)</div>`},
{id:'s3',tag:'Advice grammar',title:'5.1 Grammar: should, have to, can\'t for advice',html:`
<div class="tbl"><table><tr><th>ระดับ</th><th>รูปแบบ</th><th>ตัวอย่าง</th></tr>
<tr><td><b>Strong advice</b></td><td>have to + base form · can't + base form</td><td>You have to take breaks at work! · You can't tell him.</td></tr>
<tr><td><b>Direct advice</b></td><td>should + base form · shouldn't + base form</td><td>You should go to Scotland. · You shouldn't feel silly.</td></tr>
<tr><td><b>Indirect advice</b></td><td>I think you should … · I don't think you should …</td><td>I think you should join a club. · I don't think you should quit your job.</td></tr></table></div>
<div class="memo"><b>Notice</b> ใส่ <b>I (don't) think</b> ทำให้คำแนะนำ <b>less direct</b> (สุภาพขึ้น) · ประโยคที่แนะนำแรงที่สุดคือ have to / can't</div>
<div class="trap"><b>จุดที่มักผิด</b> ปฏิเสธแบบ indirect ใช้ <b>I don't think you should …</b> ไม่ใช่ <s>I think you shouldn't …</s></div>
<h4>Match problems & advice</h4><ul class="dots"><li>Exam tomorrow, nervous → <b>You should</b> do something relaxing (direct)</li><li>Tired, went to bed at 4 a.m. → <b>I don't think you should</b> stay out so late (indirect)</li><li>Forgot mother's birthday → <b>You have to</b> call her today and say you're sorry! (strong)</li><li>Brother lonely in a different city → <b>I think he should</b> call one of his friends (indirect)</li><li>Hurt arms lifting boxes → <b>You can't</b> lift anything heavy for the next week (strong)</li></ul>`},

{id:'s5',tag:'Predictions',title:'5.2 Grammar: will, may, might for predictions',html:`
<div class="formula">will + base form<small>ใช้ถามและทำนาย: Will you pass the test? — I will pass the test.</small></div>
<div class="tbl"><table><tr><th>รูปแบบ</th><th>ความมั่นใจ</th><th>ตัวอย่าง</th></tr>
<tr><td>will <b>definitely</b></td><td>pretty sure</td><td>She will definitely come to my house.</td></tr>
<tr><td>will <b>probably</b></td><td>not sure (แต่น่าจะ)</td><td>It will probably rain today.</td></tr>
<tr><td><b>may</b> / <b>might</b></td><td>maybe</td><td>She may come tomorrow. · She might come tomorrow.</td></tr>
<tr><td>may not / might not</td><td>maybe not</td><td>He might not come to the party. · He may not come to the party.</td></tr></table></div>
<div class="trap"><b>จุดที่มักผิด</b> หลัง will/may/might ใช้ <b>base form</b> เสมอ: <s>She will definitely comes</s> → She will definitely <b>come</b> · probably/definitely วาง <b>หลัง will</b> แต่ <b>หน้า won't</b> (They probably won't find a cure.)</div>
<h4>Predictions</h4><div class="tbl"><table>${PRED.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}</table></div>
<p class="muted">Will scientists find a cure for cancer? — They probably won't find a cure because there are a lot of different kinds of cancer.</p>`},
{id:'s6',tag:'-ful and -less',title:'5.3 Making a difference: suffixes -ful and -less',html:`
<div class="cols"><div class="box"><h4>-ful</h4><p>มีคุณสมบัตินั้น<b>มาก</b> (a lot of the quality)<br><i>I am <b>hopeful</b> about the future.</i></p></div><div class="box"><h4>-less</h4><p><b>ไม่มี</b>คุณสมบัตินั้นเลย (nothing of that quality)<br><i>Trying to solve the world's problems is <b>useless</b>.</i></p></div></div>
<div class="tbl"><table><tr><th>Root</th><th>-ful</th><th>-less</th></tr>${FUL.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</table></div>

{id:'s7',tag:'Asking & giving advice',title:'5.4 A helping hand: asking for and giving advice',html:`
<div class="tbl"><table><tr><th>Asking for advice</th><th>Giving advice</th></tr>
<tr><td>What would you do? · What do you think I should do? · Do you think I should …? · What do you suggest (I do)? · Can you give me some advice? · What would you recommend?</td><td>Why don't you …? · If I were you, I would … · I (don't) think you should … · It's (not) a good idea to … · How / What about …? · You should / ought to …</td></tr></table></div>
<div class="trap"><b>จุดที่มักผิด</b> <b>If I were you</b> (ใช้ were ไม่ใช่ am) · What do you <b>suggest</b>? (ไม่ใช่ advice ซึ่งเป็นคำนาม) · It's a good <b>idea</b> to … · You should / <b>ought</b> to …</div>
<p class="muted">Conversation A: What do you suggest? · If I were you, I would use this lamb. · Then why don't you use this beef? · B: It's a good idea to tell her… · Do you think I should tell Jan? · What about asking David? · C: What do you think I should do? · Well, what would you do? · I don't think you should tell Lily. · You should talk to her boyfriend first.</p>
<blockquote>"It's okay to not be okay."</blockquote>`}

{id:'s3',tag:'Comparatives & superlatives',title:'6.1 Grammar: comparatives, superlatives, as … as',html:`
<div class="tbl"><table><tr><th>ขั้น</th><th>โครงสร้าง</th><th>ตัวอย่าง</th></tr>
<tr><td><b>Positive</b> (ขั้นเท่ากัน)</td><td>as + adj + as · not as + adj + as</td><td>My brother is as tall as me. · The old house is not as good as the new one.</td></tr>
<tr><td><b>Comparative</b> (ขั้นกว่า)</td><td>-er + than · more + adj + than</td><td>My brother is taller than me. · Caring for others is more difficult than schoolwork.</td></tr>
<tr><td><b>Superlative</b> (ขั้นสูงสุด)</td><td>the -est · the most + adj</td><td>He is the shortest in this room. · Apple products are the most expensive.</td></tr></table></div>
<h4>กฎการเติม</h4><ul class="dots"><li>คำสั้น +er/+est: old → older → oldest</li><li>ลงท้าย -e เติม -r/-st: safe → safer → safest</li><li>พยัญชนะ+สระ+พยัญชนะ เบิ้ลตัวท้าย: hot → hotter → hottest · big → bigger → biggest</li><li>ลงท้าย -y เปลี่ยนเป็น -ier/-iest: busy → busier → busiest · silly → sillier · dry → drier</li><li>คำยาว ใช้ more/most: beautiful → more beautiful → most beautiful</li><li>Irregular: good → better → best · bad → worse → worst · far → farther/further → farthest/furthest</li></ul>
<div class="trap"><b>จุดที่มักผิด</b> <b>not as … as</b> = ฝ่ายแรก<b>น้อยกว่า</b>: Their new house isn't as big as their old one (= it's smaller) · อย่าใช้ more กับ -er ซ้อน: <s>more bigger</s></div>
<h4>Australian cities</h4><div class="tbl"><table><tr><th></th><th>Sydney</th><th>Melbourne</th><th>Perth</th></tr><tr><td>Population</td><td class="num">4 million</td><td class="num">3.5 million</td><td class="num">1.5 million</td></tr><tr><td>Avg. temperature</td><td class="num">26°</td><td class="num">27.2°</td><td class="num">31°</td></tr><tr><td>Rainfall/year</td><td class="num">1,200 mm</td><td class="num">650 mm</td><td class="num">790 mm</td></tr><tr><td>Avg. house price</td><td class="num">$815,000</td><td class="num">$650,000</td><td class="num">$470,000</td></tr></table></div>
<p>Weak forms: <i>than</i> /ðən/ และ <i>as</i> /əz/ ออกเสียงเบา · Is your little sister lazier than you? Yes, but she's not as lazy as our dad!</p>
<p class="muted">10a: It's more difficult to have a large family · Last year my course wasn't as difficult as this year · Living with parents isn't as stressful as living on your own · Relatives are more important than friends · My parents are more impatient than my teachers · My mom is my best friend!</p>`},
{id:'s4',tag:'Present perfect',title:'6.2 Try something new: present perfect with ever and never',html:`
<div class="formula">Present perfect: S + have/has + V3<small>Have you ever + V3 …? = เคยทำ…ไหม · Have you ever been to …? = เคยไป…ไหม · ever ใช้ถาม · never ใช้ตอบ</small></div>
<div class="cols"><div class="box"><h4>General experience → present perfect</h4><p><i>Have you ever tried salsa dancing?<br>Yes, I have. I've done it twice.<br>No, I haven't. I've never tried it.</i></p></div><div class="box"><h4>Specific event → simple past</h4><p><i>When did you try it?<br>I took a dance class last year.</i></p></div></div>
<div class="memo"><b>Notice</b> V3 ของ go คือ gone แต่เมื่อพูดถึงประสบการณ์มักใช้ <b>been</b>: <i>Charlotte has been to San Diego. She went in 2018.</i> (He's been to London = เคยไปแล้วกลับมา)</div>
<div class="trap"><b>จุดที่มักผิด</b> ถ้ามีเวลาเจาะจงในอดีต (last year, in 2019, when …) ต้องใช้ <b>simple past</b> ไม่ใช่ present perfect: <s>I have been there last year</s> → I went there last year</div>
<h4>Radio show: "You won't like it until you've tried it"</h4><p>Guest: actor <b>Anna Reed</b> tries three new activities: <b>eat vegetarian food, go ballroom dancing, go camping</b> · She enjoyed <b>ballroom dancing</b> the most.</p>
<p class="muted">Anna: Have you ever tried a dance class? — Yes, I have. · When did you do that? — I took ballet classes when I was younger. · Did you enjoy it? — No. I'm not very good at dancing. · Have you tried ballroom dancing? — No, I've never done that. → Q1 & 4 = general experience (present perfect) · Q2 & 3 = specific event (simple past)</p>
<h4>Irregular past participles: vowel sounds</h4><div class="tbl"><table><tr><th>/ʌ/</th><th>/oʊ/</th><th>/ə/</th></tr><tr><td>begun, done, drunk, swum</td><td>known, flown, grown, shown</td><td>eaten, driven, given, written</td></tr></table></div>`},

<p class="muted">Order in the show: I hang out with the same friends · Do you eat out much? · I sometimes run out of food · I'm looking forward to trying some nice food! · I try to go to the gym and work out · We stayed up until the next morning · I got along with my teacher · Do you think you'll keep on dancing? · I wanted to take up a new hobby · Are you going to give up meat?</p>
<div class="memo"><b>Notice</b> look forward to + <b>V-ing</b>: I'm looking forward to try<b>ing</b>…</div>`},

{id:'s1',tag:'อินเทอร์เน็ตและ ISP',title:'อินเทอร์เน็ตคืออะไร และ ISP',html:`
<p class="lead"><b>อินเทอร์เน็ต</b> คือเครือข่ายระดับโลกที่เชื่อมอุปกรณ์หลายพันล้านเครื่อง ใช้สื่อสารและแลกเปลี่ยนข้อมูลหลายรูปแบบ เป็นรากฐานของบริการดิจิทัล เช่น AI, IoT</p>
<div class="trap"><b>จุดที่มักสับสน</b> อินเทอร์เน็ต<b>ไม่ได้เก็บข้อมูลเอง</b> เป็นเพียงโครงสร้างพื้นฐาน ข้อมูลจริงอยู่บน<b>เครื่องเซิร์ฟเวอร์</b>ของผู้ให้บริการต่างๆ</div>
<h4>ISP (Internet Service Provider)</h4><ul class="dots"><li>ให้บริการเชื่อมต่ออินเทอร์เน็ตแก่บุคคลและองค์กร</li><li>รูปแบบเชื่อมต่อ: Fiber, Wi-Fi, Mobile Network</li><li>รองรับบริการขั้นสูง เช่น Cloud และ Video Conference</li></ul>
<h4>ความเป็นมา</h4><div class="flow"><span>ARPANET (สื่อสารแบบกระจายศูนย์)</span><i>→</i><span>การศึกษา</span><i>→</i><span>ใช้งานทั่วโลก</span></div>
<h4>อินเทอร์เน็ตในประเทศไทย</h4><ul class="dots"><li>มีผู้ใช้งานราว <b>85–90%</b> ของประชากร</li><li>ความเร็วอินเทอร์เน็ตติดอันดับโลก</li><li>อินเทอร์เน็ตมือถือมีผู้ใช้<b>มากกว่าจำนวนประชากร</b></li></ul>`},
{id:'s2',tag:'การเชื่อมต่อ',title:'อินเทอร์เน็ตเชื่อมต่อกันได้อย่างไร',html:`
<p>ต้องใช้อุปกรณ์ เช่น <b>โมเด็ม/เราเตอร์</b> · รูปแบบเชื่อมต่อ: Fiber, DSL, Wi-Fi, Mobile</p>
<div class="tbl"><table><tr><th>รูปแบบ</th><th>ลักษณะ</th></tr>${CONN.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td></tr>`).join('')}</table></div>
<div class="cols"><div class="box"><h4>ใช้ Wi-Fi เมื่อ</h4><p>ใช้ข้อมูลมาก อยู่ในอาคาร</p></div><div class="box"><h4>ใช้มือถือเมื่อ</h4><p>อยู่กลางแจ้ง งานเรียลไทม์</p></div></div>
<div class="memo"><b>เทคนิคจำ</b> ดาวเทียม <b>G</b>EO = <b>G</b>ว้างแต่ช้า (อยู่สูง) · <b>L</b>EO = <b>L</b>ow orbit หน่วงต่ำ (Starlink)</div>`},
{id:'s3',tag:'โปรโตคอล IP DNS',title:'โปรโตคอล TCP/IP, IP Address และ DNS',html:`
<p><b>โปรโตคอล (Protocols)</b> คือกติกาสำหรับสื่อสารบนอินเทอร์เน็ต เช่น TCP/IP, HTTP, FTP</p>
<div class="tbl"><table><tr><th>คำ</th><th>ความหมาย</th></tr>${PROTO.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}</table></div>
<div class="tbl"><table><tr><th>IP Address</th><th>ขนาด</th></tr><tr><td>IPv4</td><td class="num">32 บิต</td></tr><tr><td>IPv6</td><td class="num">128 บิต (รองรับจำนวนมาก)</td></tr></table></div>
<p><b>ชื่อโดเมน</b> ใช้ชื่อแทน IP เช่น google.com และ <b>DNS</b> ทำหน้าที่แปลงชื่อเป็น IP</p>`},
{id:'s4',tag:'เว็บ URL HTML',title:'เว็บ เว็บไซต์ URL และ Web 1.0–4.0',html:`
<p><b>เว็บ (Web)</b> เป็นบริการหลักบนอินเทอร์เน็ต ใช้ <b>Browser</b> เข้าถึงข้อมูล</p>
<div class="tbl"><table>${SITE.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td></tr>`).join('')}</table></div>
<div class="cols"><div class="box"><h4>HTTP</h4><p>โปรโตคอลเรียกเว็บ</p></div><div class="box"><h4>HTTPS</h4><p>ปลอดภัย มี<b>การเข้ารหัส</b></p></div></div>
<div class="formula">URL = Protocol + Domain + Path<small>Uniform Resource Locator ใช้เข้าถึงเว็บเพจแต่ละหน้า เช่น https:// + www.example.com + /about</small></div>
<div class="flow">${WEB.map(w=>`<span>${w[0]}: ${w[1]}</span>`).join('<i>→</i>')}</div>
<div class="cols"><div class="box"><h4>HTML</h4><p>ภาษาจัดหน้าเว็บ</p></div><div class="box"><h4>CSS3</h4><p>จัดสไตล์ และรองรับ Responsive</p></div></div>`},
{id:'s5',tag:'บริการออนไลน์',title:'E-mail, Social Media, วิดีโอออนไลน์ และ Digital TV',html:`
<ul class="dots"><li><b>E-mail</b>: ส่งข้อความและไฟล์แนบ · Mail Server มี <b>Incoming / Outgoing</b></li><li><b>Social Media</b>: ช่องทางสื่อสารและแชร์ข้อมูล เช่น Facebook, X, LINE, IG, YouTube, TikTok</li><li><b>วิดีโอออนไลน์</b>: รับชมแบบ <b>Streaming (OTT)</b> เช่น YouTube, Netflix, Disney+</li><li><b>Digital TV</b>: ใช้มาตรฐาน <b>DVB-T2</b> รับชมผ่านทีวีดิจิทัล กล่องสัญญาณ หรืออินเทอร์เน็ต</li></ul>`},
{id:'s6',tag:'Cloud Computing',title:'Cloud Computing',html:`
<p><b>Cloud Computing</b> คือการใช้คอมพิวเตอร์ผ่านอินเทอร์เน็ตแทนเครื่องตัวเอง · คุณสมบัติ: <b>On-Demand, Elasticity</b></p>
<div class="tbl"><table><tr><th>บริการ</th><th>ความหมาย</th></tr>${CLOUD.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td></tr>`).join('')}</table></div>
<div class="memo"><b>เทคนิคจำ</b> I-P-S เรียงจากล่างขึ้นบน: <b>I</b>nfrastructure (เครื่อง) → <b>P</b>latform (เครื่องมือพัฒนา) → <b>S</b>oftware (แอปพร้อมใช้ เช่น Gmail)</div>
<p><b>รูปแบบคลาวด์:</b> Private Cloud · Public Cloud · Hybrid Cloud</p>
<div class="cols"><div class="box"><h4>ข้อดี</h4><p>ประหยัดค่าใช้จ่าย · ขยายระบบง่าย · ทำงานร่วมกันสะดวก</p></div><div class="box"><h4>ความเสี่ยง</h4><p>ความปลอดภัยข้อมูล · ความพร้อมใช้งาน · ข้อกฎหมาย</p></div></div>`}
],

<h4>Privacy</h4><ul class="dots"><li>ความเสี่ยงจากการติดตามและบันทึกพฤติกรรม · ควรแจ้งและให้ผู้ใช้ยินยอม</li><li>เป็นทั้งเรื่องจริยธรรมและกฎหมาย</li><li>ยุคสังคมออนไลน์: ผู้ใช้แชร์ข้อมูลโดยไม่ตระหนักผลกระทบ เสี่ยงต่อทรัพย์สินและความปลอดภัย</li><li>ข้อมูลอ่อนไหว เช่น สุขภาพ ศาสนา เชื้อชาติ</li></ul>
<div class="cols"><div class="box"><h4>GDPR</h4><p>มาตรฐานสากลของ<b>สหภาพยุโรป</b> มีบทลงโทษรุนแรง</p></div><div class="box"><h4>PDPA</h4><p>กฎหมายคุ้มครองข้อมูลส่วนบุคคล<b>ของไทย</b></p></div></div>
<h4>Accuracy</h4><p>ข้อมูลออนไลน์มีจำนวนมากและไม่ได้ตรวจสอบเสมอ อาจมีอคติหรือบิดเบือน · อัลกอริทึมสร้าง <b>echo chamber</b> · การแชร์ต่อโดยไม่ตรวจสอบสร้างความเข้าใจผิด · ควรตรวจสอบแหล่งที่เชื่อถือได้ และองค์กรสื่อควรรับผิดชอบ</p>
<h4>Property</h4><p>การละเมิดลิขสิทธิ์ส่งผลเศรษฐกิจและสังคม จากแผ่นเถื่อนสู่การแจกไฟล์ออนไลน์ · <b>Generative AI</b> เพิ่มความท้าทาย · ผลงานดิจิทัลคือทรัพย์สินทางปัญญา การละเมิดผิดทั้งกฎหมายและจริยธรรม · ควรใช้ซอฟต์แวร์ถูกลิขสิทธิ์</p>
<h4>Accessibility</h4><p>กำหนดสิทธิ์โดยผู้ดูแลระบบ ป้องกันการรั่วไหลของข้อมูล และความเสี่ยงจากการเข้าถึงโดยไม่ได้รับอนุญาต</p>
<div class="memo"><b>เทคนิคจำ</b> PAPA = <b>P</b>rivacy (ของฉัน) · <b>A</b>ccuracy (ถูกไหม) · <b>P</b>roperty (ของใคร) · <b>A</b>ccessibility (ใครเข้าได้)</div>`},
{id:'s3',tag:'ลิขสิทธิ์และ License',title:'รูปแบบลิขสิทธิ์ และ License ≠ Copyright',html:`
<div class="tbl"><table>${LIC.map(l=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}</td></tr>`).join('')}</table></div>
<div class="trap"><b>License ≠ Copyright</b> ซื้อ license = ซื้อ<b>สิทธิ์ใช้งาน</b> ไม่ใช่เจ้าของผลงานหรือเจ้าของลิขสิทธิ์ ต้องปฏิบัติตามเงื่อนไขของผู้ขาย/เจ้าของลิขสิทธิ์ พบบ่อยใน software และ stock media</div>`},
{id:'s4',tag:'ความปลอดภัยข้อมูล',title:'การรักษาความปลอดภัยข้อมูลและ 2FA/MFA',html:`
<ul class="dots"><li>เก็บความลับรหัสผ่านและข้อมูลสำคัญ</li><li>ตั้งรหัสผ่านยาวและซับซ้อน · เปลี่ยนรหัสเป็นระยะ</li></ul>
<h4>การยืนยันตัวตนหลายขั้นตอน (2FA / MFA)</h4>
<div class="tbl"><table><tr><th>ปัจจัย</th><th>ตัวอย่าง</th></tr><tr><td><b>สิ่งที่รู้</b></td><td>รหัสผ่าน, PIN</td></tr><tr><td><b>สิ่งที่มี</b></td><td>OTP บนโทรศัพท์, บัตร</td></tr><tr><td><b>สิ่งที่เป็น</b></td><td>Biometrics เช่น ลายนิ้วมือ ใบหน้า</td></tr></table></div>
<p>เช่น รหัสผ่าน + OTP + Biometrics · เพิ่มความปลอดภัยเมื่อใช้งานอุปกรณ์ใหม่</p>
<h4>แนวปฏิบัติ</h4><ul class="dots"><li>บริการออนไลน์ควรเปิดใช้ 2FA</li><li>ไม่จดรหัสผ่านไว้ที่มองเห็นได้</li><li>ใช้ <b>passphrase</b> ยาว จดจำง่าย</li><li>กำหนดสิทธิ์การมองเห็นบน Social Media</li></ul>`}

<p><b>ตามนักจิตวิทยา:</b> ความสามารถในการปฏิบัติงานตามที่นักจิตวิทยาออกแบบสิ่งเร้าให้ผู้ถูกวัดแสดงเชาวน์ปัญญาออกมา · ผลการวัดด้วยแบบทดสอบเน้น<b>ความสามารถในการนำความรู้ที่มีอยู่มาใช้ให้เป็นประโยชน์</b></p>
<p><b>เชิงนามธรรม:</b> ความสามารถในการรู้ การเข้าใจทั่วไป การเรียนรู้ที่ซับซ้อนขึ้น การจดจำ การคิดริเริ่มขั้นพื้นฐาน การคิดอย่างมีคุณภาพ และจัดการสิ่งแวดล้อมได้อย่างมีประสิทธิภาพ</p>
<div class="memo"><b>เทคนิคจำ</b> Piaget = <b>ปรับตัว+แก้ปัญหา</b> · Wechsler = <b>มีจุดหมาย มีเหตุผล จัดการสิ่งแวดล้อม</b></div>`},

{id:'s5',tag:'แบบทดสอบเชาวน์ปัญญา',title:'แบบทดสอบ Stanford-Binet และ Wechsler',html:`
<h4>Stanford-Binet Intelligence Scale</h4><ul class="dots"><li><b>แบบทดสอบเชาวน์ปัญญาที่เป็นทางการฉบับแรก</b> โดย <b>Alfred Binet และ Theodore Simon</b> (ฝรั่งเศส) ชื่อ Binet-Simon Scale ใช้ปี <b>ค.ศ. 1905 (พ.ศ. 2448)</b></li><li>ข้อคำถาม <b>30 รายการ</b> วัดความคิด ความเข้าใจ การตัดสินใจเกี่ยวกับสังคม เช่น พูดซ้ำประโยค 15 คำเมื่อได้ยินครั้งเดียว</li><li>ใช้จัดนักเรียนเข้าชั้นเรียนปกติหรือมีความบกพร่องทางสติปัญญา</li><li><b>Lewis Terman</b> (Stanford) แปลและดัดแปลงเป็นภาษาอังกฤษ เป็นแม่บทของแบบทดสอบปัจจุบัน ฉบับปัจจุบัน <b>SB5</b> ใช้กับอายุ <b>2–85 ปี</b></li></ul>
<p class="muted">ตัวอย่างคำถาม: อายุ 2 ถามว่าสิ่งของคืออะไร · อายุ 4 นกบินในอากาศ ปลาว่ายใน… · อายุ 10 พูดตาม 4 8 3 7 1 4 · อายุ 14 สิ่งที่คล้ายกันระหว่างสูงกับต่ำ · ผู้ใหญ่ "คนที่อยู่บ้านกระจกไม่ควรขว้างหิน" หมายความว่าอย่างไร</p>
<h4>Wechsler Intelligence Scale (David Wechsler)</h4><p>มี <b>11 แบบทดสอบย่อย</b> แบ่ง 2 ส่วน: มาตรถ้อยคำ (Verbal) และมาตรปฏิบัติการ (Performance)</p>

<div class="cols"><div class="box"><h4>มาตรถ้อยคำ (Verbal Scale) 6 แบบย่อย</h4><p>${WV.map(w=>`<b>${w[0]}</b>: ${w[1]}`).join('<br>')}</p></div><div class="box"><h4>มาตรปฏิบัติการ (Performance Scale) 5 แบบย่อย</h4><p>${WP.map(w=>`<b>${w[0]}</b>: ${w[1]}`).join('<br>')}</p></div></div>
<h4>คุณสมบัติพื้นฐานของแบบทดสอบ</h4><p>ส่วนใหญ่ทดสอบ<b>รายบุคคล</b> · ผ่านกระบวนการมาตรฐาน: ความเที่ยงตรง (validity) ความเชื่อมั่น (reliability) อำนาจจำแนก ความยากง่าย ความเป็นปรนัย (objectivity) เกณฑ์ปกติวิสัย (norm)</p>`},
{id:'s6',tag:'การคำนวณ IQ',title:'ระดับสติปัญญาและวิธีคำนวณ IQ',html:`
<div class="formula">I.Q. = (M.A. ÷ C.A.) × 100<small>M.A. (Mental Age) อายุสมอง ได้จากแบบทดสอบมาตรฐาน · C.A. (Chronological Age) อายุปฏิทิน = อายุจริง · ทั้งคู่ใช้หน่วย<b>เดือน</b></small></div>
<div class="example"><b>ตัวอย่าง</b> เด็กอายุจริง 10 ปี (120 เดือน) อายุสมอง 12 ปี (144 เดือน) → IQ = 144 ÷ 120 × 100 = <b>120</b> (ฉลาด)</div>
<div class="tbl"><table><tr><th>IQ</th><th>ระดับ</th><th>% ประชากร</th></tr>${IQ.map(r=>`<tr><td class="num">${r[0]===140?'140 ขึ้นไป':r[1]===69?'ต่ำกว่า 70':r[0]+'–'+r[1]}</td><td>${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</table></div>
<div class="tbl"><table><tr><th>IQ</th><th>ความสามารถในการศึกษา</th></tr>${IQEDU.map(r=>`<tr><td class="num">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<div class="trap"><b>จุดที่มักผิด</b> แปลงอายุเป็น<b>เดือน</b>ก่อน หรือใช้หน่วยเดียวกันทั้งคู่ · M.A. อยู่<b>บน</b> C.A. อยู่<b>ล่าง</b></div>`},
{id:'s7',tag:'เด่นทางปัญญาและปัญญาอ่อน',title:'พวกเด่นทางปัญญา และความเป็นปัญญาอ่อน',html:`
<h4>พวกเด่นทางปัญญา (Mentally Gifted) IQ 130 ขึ้นไป</h4><ol class="steps"><li>เรียนรู้เร็วและง่ายกว่าเพื่อนวัยเดียวกัน</li><li>ชอบอยู่กับเด็กที่อายุมากกว่าและผู้ใหญ่</li><li>สนใจอธิบายและแก้ปัญหา</li><li>พูดสนทนาได้เกินวัย 2–3 ปี ใช้ศัพท์สูง</li><li>ความจำดีเยี่ยม</li><li>ทักษะศิลปะ ดนตรี ตัวเลขเกินวัย</li><li>สนใจหนังสือ อ่านเร็วกว่าวัย พบมากช่วง 3 ขวบ</li><li>มีเมตตา เข้าใจ และร่วมมือกับผู้อื่น</li></ol>
<h4>ความเป็นปัญญาอ่อน (IQ ต่ำกว่า 70 ประมาณ 2.6%)</h4>
<div class="tbl"><table><tr><th>ระดับ</th><th>IQ</th><th>อายุสมอง</th></tr>${MR.map(m=>`<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${m[2]}</td></tr>`).join('')}</table></div>
<p>ลักษณะ: เชาวน์ปัญญาต่ำ · พัฒนาการทางกายล่าช้า · เรียนรู้ได้น้อยหรือเรียนไม่ได้ · ปรับตัวต่อสิ่งแวดล้อมและสังคมไม่ได้</p>
<div class="tbl"><table><tr><th>ประเภท</th><th>IQ</th><th>การเรียน</th></tr><tr><td>เด็กเรียนช้า</td><td class="num">70–79</td><td>เรียน ป.1–ป.6 ในชั้นพิเศษของโรงเรียนปกติ อาจเรียนร่วมบางวิชา</td></tr><tr><td>ปัญญาอ่อนน้อย (พอเรียนได้)</td><td class="num">50–70</td><td>เทียบเด็ก 7–10 ปี เรียน ป.1–ป.4 หลักสูตรพิเศษ ชั้นละ 2–3 ปี</td></tr><tr><td>ปัญญาอ่อนปานกลาง (พอฝึกอบรมได้)</td><td class="num">35–49</td><td>เทียบเด็ก 3–7 ขวบ เรียนโรงเรียนพิเศษเฉพาะ อ่านเขียนง่ายๆ ทอนเงินได้</td></tr><tr><td>ปัญญาอ่อนมาก</td><td class="num">20–34</td><td>เทียบเด็ก 3 ปี เรียนไม่ได้ ช่วยตัวเองได้บ้าง</td></tr><tr><td>ปัญญาอ่อนมากที่สุด</td><td class="num">ต่ำกว่า 20</td><td>เทียบเด็ก 1–2 ปี ต้องดูแลใกล้ชิด</td></tr></table></div>
<p>เชาวน์ปัญญากับผลสัมฤทธิ์ทางการเรียนมีสหสัมพันธ์ <b>.60–.64</b> · ผลสัมฤทธิ์ยังขึ้นกับความขยันหมั่นเพียร แต่นักการศึกษาเชื่อว่าเชาวน์ปัญญาจำเป็นกว่า</p>`},
{id:'s8',tag:'ปัจจัยต่อเชาวน์ปัญญา',title:'ปัจจัยที่มีอิทธิพลต่อเชาวน์ปัญญา',html:`
<div class="chips"><span>พันธุกรรม</span><span>สิ่งแวดล้อม</span><span>เพศ</span><span>ขนาดของครอบครัว</span></div>
<h4>พันธุกรรม (ค่าสหสัมพันธ์ของ IQ)</h4><div class="tbl"><table>${TWIN.map(t=>`<tr><td>${t[0]}</td><td class="num">${t[1]}</td></tr>`).join('')}</table></div>
<p><b>สิ่งแวดล้อม:</b> เด็กกำพร้าที่ถูกรับเลี้ยงมีระดับสติปัญญาใกล้เคียง<b>มารดาที่เลี้ยงดู</b> · เด็กที่ได้รับความรักและมีสิ่งเร้ามาก IQ สูงขึ้น ส่วนเด็กในสถานกำพร้า IQ ต่ำกว่า</p>
<p><b>เพศ:</b> ชายเหนือกว่าในเรื่องหนึ่ง หญิงเหนือกว่าในอีกเรื่อง จึง<b>ไม่มีความแตกต่าง</b>ในระดับเชาวน์ปัญญาโดยทั่วไป</p>
<p><b>ขนาดครอบครัว:</b> เด็กจากครอบครัวใหญ่มี IQ <b>ต่ำกว่า</b>เด็กจากครอบครัวเล็ก</p>`}
],

gens:[
{tag:'การคำนวณ IQ',f:()=>{const ca=H.R(6,16),iq=H.pick([70,75,80,90,100,110,120,125,130,140,150]);const caM=ca*12,maM=caM*iq/100;if(!Number.isInteger(maM))return null;const unit=Math.random()<.5;const maY=Math.floor(maM/12),maR=maM%12;const maTxt=unit?`${maM} เดือน`:`${maY} ปี${maR?' '+maR+' เดือน':''}`;return{t:'mc',q:`เด็กอายุจริง ${ca} ปี มีอายุสมอง ${maTxt} มี IQ เท่าใด`,o:H.opts(String(iq),[String(Math.round(caM/maM*100)),String(iq+10),String(iq-10),String(maM-caM)].filter(x=>x!==String(iq))),a:0,e:`IQ = (${maM} ÷ ${caM}) × 100 = ${iq} (แปลงเป็นเดือน: ${ca} ปี = ${caM} เดือน) → ${iqLevel(iq)}`}}},

{id:'s1',tag:'ความหมายของพัฒนาการ',title:'ความหมายของพัฒนาการ',html:`
<p class="lead"><b>พัฒนาการ (Development)</b> คือการเปลี่ยนแปลงพฤติกรรมและ/หรือความสามารถต่างๆ ของบุคคลที่เกี่ยวข้องกับ<b>การเจริญเติบโตหรือวุฒิภาวะ</b> ศึกษาตั้งแต่<b>การปฏิสนธิจนถึงวาระสุดท้ายของชีวิต</b></p>
<p>แบ่งช่วงวัย: ปฏิสนธิถึงแรกเกิด · วัยทารกและวัยเด็ก · วัยรุ่น · วัยผู้ใหญ่ และแต่ละวัยดู 3 ด้าน: <b>ร่างกาย · การรู้คิด/ปัญญา · สังคมและอารมณ์</b></p>`},
{id:'s2',tag:'ปฏิสนธิถึงแรกเกิด',title:'ช่วงปฏิสนธิถึงแรกเกิด',html:`
<ul class="dots"><li>ปฏิสนธิระหว่างอสุจิกับไข่ ที่<b>ท่อนำไข่</b> · อสุจิและไข่มีโครโมโซมฝ่ายละ <b>23</b></li><li><b>ไซโกท (zygote)</b> = ไข่ที่ปฏิสนธิแล้ว มีโครโมโซม <b>23 คู่</b></li><li>คลอดราวสัปดาห์ที่ <b>37–42</b> (ประมาณ 9–10 เดือน)</li></ul>
<div class="tbl"><table><tr><th>ระยะ</th><th>ช่วงเวลา</th><th>ลักษณะสำคัญ</th></tr>${PRE.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join('')}</table></div>
<h4>บลาสโตซิสท์ (blastocyst) 3 ชั้น</h4><div class="tbl"><table>${BLAST.map(b=>`<tr><td><b>${b[0]}</b></td><td>${b[1]}</td></tr>`).join('')}</table></div>
<h4>ความผิดปกติ</h4><ul class="dots"><li><b>ดาวน์ซินโดรม</b>: โครโมโซมคู่ที่ <b>21 เกินมา 1 แท่ง</b> สติปัญญาบกพร่อง อายุ 40–50 ปี · แม่อายุ 18 ปี ~1 ใน 2,000 · แม่อายุ 45 ปี ~1 ใน 30</li><li>ยาแก้แพ้ท้อง <b>ทาลิโดไมด์</b> มีผลต่อการเจริญเติบโตของแขนขา</li><li>ยาแก้ซึมเศร้า ทำให้คลอดก่อนกำหนดสูงกว่าปกติ</li></ul>`},
{id:'s3',tag:'ทารกและเด็ก: ร่างกาย',title:'วัยทารกและวัยเด็ก: ร่างกาย ระบบประสาท และปฏิกิริยาสะท้อน',html:`
<p>วัยทารกและวัยเด็ก: คลอดถึงประมาณ <b>11 ปี</b></p>
<ul class="dots"><li>2–3 วันหลังคลอดน้ำหนักลดเล็กน้อย · 28 วัน ยาว 30–50 ซม. หนัก 2,800–3,500 กรัม · 1 ขวบ ยาว 60–75 ซม. น้ำหนัก <b>3 เท่า</b>ของแรกเกิด</li><li>นอน <b>16–18 ชั่วโมง/วัน</b> ส่วนใหญ่แบบ <b>REM</b> ช่วยเชื่อมระบบประสาท · ร้องไห้ราว 2–3 ชั่วโมง</li><li>มองตามวัตถุไม่ได้เพราะ <b>ไซแนปส์</b>ยังไม่พัฒนา · สมองเชื่อมต่อกันได้ใช้เวลาราว <b>3 ปี</b> · สิ่งเร้ามากช่วยให้ไซแนปส์พัฒนา ส่วนที่ไม่ใช้อาจหยุดทำงาน</li></ul>
<p><b>ปฏิกิริยาสะท้อน (Reflex)</b> = พฤติกรรมที่ติดตัวมาแต่กำเนิด เกิดขึ้นอัตโนมัติ ช่วยให้ทารกรอดและเรียนรู้สิ่งแวดล้อม</p>
<div class="tbl"><table>${REFLEX.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table></div>
<div class="trap"><b>จุดที่มักสับสน</b> Rooting = เขี่ย<b>แก้ม</b> หันหา · Sucking = แตะ<b>ริมฝีปาก</b> ดูด · Babinski = <b>เท้า</b> กางนิ้ว · Moro = <b>หงายหัว</b> กางแขนคว้ากอด</div>`},
{id:'s4',tag:'ทารกและเด็ก: การรับรู้และเคลื่อนไหว',title:'วัยทารกและวัยเด็ก: การรับรู้ การเคลื่อนไหว และการรู้คิด',html:`
<ul class="dots"><li><b>การมองเห็น:</b> เห็นเฉพาะวัตถุใกล้ ใช้ตาข้างเดียวก่อน ชอบวัตถุซับซ้อนและหน้าคน · <b>3 เดือน</b> แยกหน้าคนเลี้ยงกับคนแปลกหน้าได้</li><li><b>การรับรู้ความลึก:</b> Gibson & Walk (1960) สร้าง <b>หน้าผาจำลอง (visual cliff)</b> พบว่าทารกราว <b>6 เดือน</b> ลังเลที่จะคลานข้าม</li><li><b>การได้ยิน:</b> ตอบสนองเสียงตั้งแต่ในครรภ์ ชอบเสียงเบาเป็นจังหวะ · <b>รส:</b> ชอบหวาน · <b>กลิ่น:</b> อายุ 3 วันแยกกลิ่นแม่ได้ · <b>สัมผัส:</b> เด็กได้รับสัมผัสมากเติบโตดีกว่า</li></ul>
<div class="cols"><div class="box"><h4>Gross motor skills</h4><p>กล้ามเนื้อมัดใหญ่ (biceps, quadriceps) เช่น วิ่ง เดิน กระโดด</p></div><div class="box"><h4>Fine motor skills</h4><p>กล้ามเนื้อมัดเล็ก เช่น เขียนหนังสือ ใช้อุปกรณ์ เล่นดนตรี</p></div></div>
<p>locomotive ability = ความสามารถที่จะเคลื่อนที่ไปรอบๆ · ราว 2 ปีเดิน วิ่งได้</p>
<div class="tbl"><table><tr><th>อายุ</th><th>การเคลื่อนไหว</th></tr>${MOTOR.map(m=>`<tr><td class="num">${m[0]}</td><td>${m[1]}</td></tr>`).join('')}</table></div>
<p><b>การรู้คิด (cognition)</b>: 18 เดือนใช้ความคิดและจินตนาการแก้ปัญหา · 2 ขวบเริ่มประเมินผลที่ตามมา · 2–7 ขวบใช้วัตถุ/คำแทนของ ยึดตัวเองเป็นศูนย์กลาง · 7 ขวบขึ้นไปคิดมีเหตุผลมากขึ้นแต่ยังไม่คิดนามธรรม</p>
<p><b>อารมณ์ (Thomas & Chess):</b> ต่างกันตั้งแต่ 2–3 เดือนแรก แบ่ง 3 กลุ่ม: <b>ทางบวก</b> (สุข กระตือรือร้น) · <b>ทางลบ</b> (โกรธ กลัว ละอาย) · <b>ควบคุมได้</b> (ตั้งใจ ยับยั้งชั่งใจ) · เด็กขี้กลัว/ละอายเสี่ยงวิตกกังวลและซึมเศร้า เด็กโกรธบ่อยเสี่ยงก้าวร้าว</p>`},
{id:'s5',tag:'วัยรุ่นและผู้ใหญ่',title:'พัฒนาการวัยรุ่นและวัยผู้ใหญ่',html:`
<div class="tbl"><table><tr><th>วัยรุ่น</th><th></th></tr><tr><td><b>ร่างกาย</b></td><td>วัยหนุ่มสาว (puberty) หญิงราว 10 ปี ชายราว 12 ปี · ลักษณะทุติยภูมิทางเพศจากฮอร์โมน · ใช้เวลา 4–5 ปี</td></tr><tr><td><b>สติปัญญา</b></td><td>เริ่มคิด<b>เชิงนามธรรม</b> คิดแบบวิทยาศาสตร์ ตั้งสมมติฐาน วิเคราะห์ วิจารณ์</td></tr><tr><td><b>สังคม/อารมณ์</b></td><td>"<b>วัยพายุบุแคม</b>" อารมณ์เปลี่ยนเร็ว อยากแก้ปัญหาเอง มีความฝันแบบผู้ใหญ่</td></tr></table></div>
<div class="tbl"><table><tr><th>วัยผู้ใหญ่</th><th>อายุ</th><th>ร่างกาย/สติปัญญา</th></tr>${ADULT.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${a[2]}</td></tr>`).join('')}</table></div>
<p>คนชราที่ได้ทำงาน ค้นคว้าอยู่เสมอ สมองทำงานได้ดี และอาจวิเคราะห์ได้ดีกว่าสมัยหนุ่มสาว · ผู้ใหญ่ตอนต้นศูนย์กลางสัมพันธภาพคือครอบครัว · ผู้ใหญ่ตอนปลายเปลี่ยนจากหัวหน้าครอบครัวเป็นผู้พึ่งพา</p>
<h4>ปฏิกิริยาตอบสนองต่อความตาย (Elizabeth Kübler-Ross สัมภาษณ์ผู้ป่วยระยะสุดท้าย 200+ คน)</h4>
<div class="flow">${KR.map(k=>`<span>${k[0]}</span>`).join('<i>→</i>')}</div>
<div class="tbl"><table>${KR.map(k=>`<tr><td><b>${k[0]}</b></td><td>${k[1]}</td></tr>`).join('')}</table></div>
<div class="memo"><b>เทคนิคจำ</b> "ปฏิ-โก-ต่อ-ซึม-ยอม" (DABDA: Denial, Anger, Bargaining, Depression, Acceptance)</div>`},
{id:'s6',tag:'ทฤษฎี Piaget',title:'ทฤษฎีพัฒนาการทางสติปัญญาของเพียเจท์',html:`
<p><b>Jean Piaget (1896–1980) ชาวสวิส</b> ศึกษาพัฒนาการด้านสติปัญญาของเด็กด้วยการสังเกตและสัมภาษณ์ · พัฒนาการทางสติปัญญา = การปรับพฤติกรรมให้เข้ากับสภาพแวดล้อม แบ่ง <b>4 ขั้น</b>ตามอายุ</p>
<div class="tbl"><table><tr><th>ขั้น</th><th>อายุ</th><th>ลักษณะ</th></tr>${PIAGET.map((p,i)=>`<tr><td><b>${i+1}. ${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join('')}</table></div>
<div class="trap"><b>จุดที่มักสับสน</b> <b>Conservation</b> ยัง<b>ไม่มี</b>ในขั้นก่อนรูปธรรม จะเข้าใจได้ในขั้นรูปธรรม · ความคิด<b>นามธรรม</b>เกิดในขั้นที่ 4 เท่านั้น</div>`},
{id:'s7',tag:'ทฤษฎี Kohlberg',title:'ทฤษฎีพัฒนาการทางจริยธรรมของโคลเบอร์ก',html:`
<p><b>Lawrence Kohlberg (1927–1987)</b> ความสามารถตัดสินถูกผิดขึ้นกับระดับสติปัญญา ต้องผ่านขั้นต่ำก่อน · ไม่กำหนดอายุชัดเจน · <b>6 ขั้น 3 ระดับ</b></p>
<div class="tbl"><table><tr><th>ขั้น</th><th>ระดับ</th><th>ตัวอย่าง</th></tr>${KOHL.map(k=>`<tr><td><b>${k[0]}</b></td><td>${k[1]}</td><td>${k[2]}</td></tr>`).join('')}</table></div>
<p class="muted">ระดับ 1 พบในเด็ก (≤10 ขวบ) เพื่อรางวัล/เลี่ยงโทษ · ระดับ 2 วัยรุ่นและผู้ใหญ่ส่วนใหญ่ (10–20 ปี) เน้นการยอมรับจากคนอื่นและกฎสังคม · ระดับ 3 ผู้ใหญ่บางคน (20 ปีขึ้นไป) เพื่อประโยชน์ส่วนรวมและสิทธิมนุษยชน</p>`},
{id:'s8',tag:'ทฤษฎี Erikson',title:'ทฤษฎีพัฒนาการทางสังคมและอารมณ์ของอีริคสัน',html:`
<p><b>Erik Erikson</b> นำทฤษฎีจิตวิเคราะห์ของฟรอยด์มาพัฒนา มี <b>8 ขั้น</b></p>
<div class="tbl"><table><tr><th>ขั้น</th><th>วัย/อายุ</th></tr>${ERIK.map((e,i)=>`<tr><td><b>${i+1}. ${e[0]}</b></td><td>${e[1]}</td></tr>`).join('')}</table></div>
<ul class="dots"><li>ขั้น 1: ได้รับการดูแลดี → ไว้วางใจ · ถูกทอดทิ้ง → ไม่ไว้วางใจ</li><li>ขั้น 2: เลี้ยงแบบบังคับ ควบคุม → อาย สงสัยตัวเอง</li><li>ขั้น 3: ดุ/ตีเมื่ออยากรู้ → รู้สึกผิด</li><li>ขั้น 4: ไม่ได้รับคำชม คาดหวังสูงเกินไป → ปมด้อย</li><li>ขั้น 5: ตอบไม่ได้ว่าตนเป็นใคร → สับสนในบทบาท</li><li>ขั้น 6: กลัวสร้างความสัมพันธ์ → แปลกแยก</li><li>ขั้น 7: เลี้ยงดูลูก/สร้างสรรค์งาน · ไม่ทำ → เฉื่อยชา</li><li>ขั้น 8: ชีวิตสำเร็จ → ยอมรับความตายอย่างสงบ · ไม่สำเร็จ → สิ้นหวัง กลัวตาย</li></ul>`}
],

const EGRP=[['ยอมรับนับถือ','อารมณ์รัก'],['เชื่อใจ','อารมณ์รัก'],['อุทิศตน','อารมณ์รัก'],['หลงเสน่ห์','อารมณ์รัก'],['ร่าเริง','อารมณ์สนุกสนาน'],['ผ่อนคลาย','อารมณ์สนุกสนาน'],['ภูมิใจ','อารมณ์สนุกสนาน'],['ปลาบปลื้ม','อารมณ์สนุกสนาน'],['หวาดหวั่น','อารมณ์กลัว'],['ระมัดระวัง','อารมณ์กลัว'],['ลังเล','อารมณ์กลัว'],['อกสั่นขวัญแขวน','อารมณ์กลัว'],['ขุ่นเคือง','อารมณ์โกรธ'],['รำคาญ','อารมณ์โกรธ'],['เจตนาร้าย','อารมณ์โกรธ'],['ดูหมิ่นดูแคลน','อารมณ์โกรธ']];
const MEAS=[['วิธีสำรวจตนเอง (Self-report)','แบบทดสอบ การสำรวจ การสัมภาษณ์ นักจิตวิทยานิยมใช้'],['เครื่องจับเท็จ (Lie detector)','วัดการเปลี่ยนแปลงทางสรีระ เช่น การหายใจ กระแสไฟฟ้าที่ผิวหนัง ความดันโลหิต'],['การตรวจคลื่นสมอง (EEG)','บันทึกคลื่นสมองเป็นกราฟ มีอารมณ์กับไม่มีอารมณ์ต่างกัน แต่ไม่แปรตามชนิดอารมณ์'],['แบบทดสอบความซื่อสัตย์ (Integrity test)','วัดทัศนคติเกี่ยวกับความไม่ซื่อสัตย์ ใช้คัดเลือกบุคลากรแทนเครื่องจับเท็จ']];
const BMI=[[0,18.4,'น้ำหนักน้อย/ผอม'],[18.5,22.9,'ปกติ สุขภาพดี'],[23,24.9,'ท้วม / โรคอ้วนระดับ 1'],[25,29.9,'อ้วน / โรคอ้วนระดับ 2'],[30,99,'อ้วนมาก / โรคอ้วนระดับ 3']];
const EQ=[['การเข้าใจตนเอง','ตระหนักถึงอารมณ์ของตน รู้ว่ารู้สึกอย่างไรขณะนั้น'],['การบริหารอารมณ์','รักษาสมดุลอารมณ์ ไม่ให้อารมณ์ไม่ดีกระทบสิ่งที่ทำอยู่'],['การจูงใจตนเอง','มีความหวัง มองโลกในแง่ดีแม้พบอุปสรรค'],['การเข้าใจผู้อื่น','เข้าใจผู้อื่นผ่านน้ำเสียง ท่าทาง สีหน้า'],['การสร้างสัมพันธ์','โน้มน้าวผู้อื่น มีทักษะสร้างสัมพันธภาพที่ดี']];
