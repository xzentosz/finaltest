<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Econ & English Exam Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column (max 1080px); dashboard cards 1→2→3 columns; reading view narrows to ~720px for 65ch lines */
:root{
  --bg:#0a0b09; --surface:#141512; --surface2:#1b1c19; --line:#272924; --line2:#383b34;
  --fg:#f2f3ec; --fg2:#bfc1b8; --muted:#8a8c83;
  --accent:#c8f27a; --accent-ink:#13200a; --accent-dim:rgba(200,242,122,.12); --accent-line:rgba(200,242,122,.35);
  --bad:#ff7a66; --bad-dim:rgba(255,122,102,.12); --warn:#ffc960; --blue:#8fc7ff; --orange:#ffad66;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}
h1,h2,h3,h4{text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* top brand */
.brand{display:flex;align-items:flex-start;gap:14px;padding-top:22px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand .name{font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.1}
.brand .sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.pill{margin-left:auto;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-line);padding:5px 12px;border-radius:999px;white-space:nowrap}
.hero{padding:28px 0 18px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--fg2);margin-top:8px;font-size:17px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.prog{display:grid;gap:12px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prog-top b{font-size:18px;font-weight:600}
.big{font-family:var(--f-mono);font-size:30px;color:var(--accent);font-weight:500}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--fg2);font-size:14px}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}

.search{position:relative;margin:18px 0 0}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px 13px 44px;font-size:16px}
.search input:focus{border-color:var(--accent-line);outline:none;box-shadow:0 0 0 3px var(--accent-dim)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{margin-top:10px;display:grid;gap:6px}
.res{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.res:hover{border-color:var(--line2)}
.res .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:3px;flex:none;width:34px}
.res .t{font-weight:600}
.res .d{color:var(--muted);font-size:14px}
mark{background:var(--accent-dim);color:var(--accent);border-radius:3px;padding:0 2px}

.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px;margin:30px 0 14px}
.sechead h2{font-size:22px;font-weight:700}
.sechead span{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}
.lesson{display:flex;flex-direction:column;gap:14px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;min-width:0}
.lesson:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(0,0,0,.9)}
.lesson-top{display:flex;gap:14px;align-items:flex-start}
.ico{width:50px;height:50px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.lesson .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.lesson h3{font-size:19px;font-weight:600;margin-top:2px}
.lesson .en{color:var(--muted);font-size:14px}
.lesson .bl{color:var(--fg2);font-size:14px;flex:1}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line2);color:var(--fg2);border-radius:99px;padding:2px 10px;white-space:nowrap}
.chip.ok{border-color:var(--accent-line);color:var(--accent);background:var(--accent-dim)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:15px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad);border-color:rgba(255,122,102,.4);background:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns .btn{flex:1 1 140px}
.all{grid-column:1/-1;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px;background:linear-gradient(120deg,var(--surface) 55%,rgba(200,242,122,.07));}
.all .txt{flex:1 1 260px;min-width:0}
.all h3{font-size:20px}
.foot{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,11,9,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px}
.topbar .ttl{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn:hover{border-color:var(--line2)}
.readbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .1s}

/* reading */
.rhead{padding:26px 0 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--accent)}
.rhead h1{font-size:clamp(26px,5vw,38px);font-weight:700;margin-top:6px}
.rhead .en{color:var(--muted);margin-top:4px}
.toc{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none;margin:0 -2px}
.toc::-webkit-scrollbar{display:none}
.toc button{flex:none;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;color:var(--fg2)}
.toc button:hover{border-color:var(--accent-line);color:var(--fg)}
.sec{padding:26px 0;border-top:1px solid var(--line);scroll-margin-top:80px}
.sec:first-of-type{border-top:0}
.sec h2{font-size:22px;font-weight:700;display:flex;gap:12px;align-items:baseline}
.sec h2 .i{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500;flex:none}
.sec h4{font-size:16px;font-weight:600;margin:18px 0 8px;color:var(--fg)}
.sec .body{margin-top:12px;display:grid;gap:12px;color:var(--fg2)}
.sec .body b{color:var(--fg);font-weight:600}
.lead{font-size:17px;color:var(--fg)!important}
.dots{margin:0;padding-left:20px;display:grid;gap:4px}
.dots li::marker{color:var(--accent)}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;position:relative;padding-left:34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:7px;background:var(--surface2);border:1px solid var(--line2);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--surface2);color:var(--fg);font-weight:600;font-size:14px}
.tbl td.up{color:var(--accent)} .tbl td.down{color:var(--bad)}
.formula{background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;padding:14px 16px;font-family:var(--f-mono);color:var(--accent);font-size:15px;line-height:1.6}
.formula small{display:block;font-family:var(--f-body);color:var(--fg2);font-size:14px;margin-top:6px}
.example{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--fg)!important}
.memo,.trap{border-radius:12px;padding:12px 16px;font-size:15px}
.memo{background:var(--accent-dim);color:var(--fg)!important}
.memo>b:first-child{color:var(--accent);display:block;font-size:13px;letter-spacing:.04em;margin-bottom:2px}
.trap{background:rgba(255,201,96,.08);border:1px dashed rgba(255,201,96,.4);color:var(--fg)!important}
.trap>b:first-child{color:var(--warn);display:block;font-size:13px;letter-spacing:.04em;margin-bottom:2px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow span{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:14px;color:var(--fg)}
.flow span.hl{border-color:var(--accent-line);color:var(--accent)}
.flow i{font-style:normal;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:14px;color:var(--fg)}
.cols{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.box h4{margin:0 0 6px;font-size:15px}
blockquote{margin:0;border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--fg);font-style:italic}
blockquote small{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
.examtag{display:inline-block;font-size:12px;font-weight:700;background:var(--bad);color:#1a0703;border-radius:6px;padding:0 8px;margin-right:4px;font-style:normal;vertical-align:2px}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:300px;max-width:620px;margin:0 auto;height:auto}
.fig figcaption{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
svg .ax{stroke:var(--muted);stroke-width:1.4;fill:none}
svg .axh{stroke:var(--muted);stroke-width:1.4;fill:none}
svg .lb{fill:var(--fg2);font-size:11px;font-family:var(--f-body)}
svg .lb.small{font-size:9.5px}
svg .lb.strong{fill:var(--fg);font-weight:600;font-size:12px}
svg .lb.ink{fill:var(--accent-ink);font-weight:600}
svg .t1{fill:var(--accent)} svg .t2{fill:var(--blue)} svg .t3{fill:var(--orange)}
svg .c1{stroke:var(--accent);fill:none} svg .c2{stroke:var(--blue);fill:none} svg .c3{stroke:var(--orange);fill:none} svg .fg{stroke:var(--fg);fill:none}
svg .thick{stroke-width:2.4} svg .dash{stroke-width:2;stroke-dasharray:6 5} svg .arr{stroke-width:1.8;fill:none}
svg .guide{stroke:var(--line2);stroke-dasharray:3 4;stroke-width:1}
svg .dot1{fill:var(--accent)} svg .dot2{fill:var(--blue)} svg .dot3{fill:var(--orange)}
svg .step{fill:var(--surface2);stroke:var(--line2)} svg .stepHi{fill:var(--accent);stroke:var(--accent)}
svg .ring{fill:none;stroke-width:2.2} svg .r1{stroke:var(--accent)} svg .r2{stroke:var(--blue)} svg .r3{stroke:var(--orange)}
svg .cond{fill:var(--accent)}
.terms{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:640px){.terms{grid-template-columns:1fr 1fr}}
.term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.term dt{font-weight:600;color:var(--accent)}
.term dd{margin:2px 0 0;color:var(--fg2);font-size:14px}
.endcard{margin-top:26px;text-align:center;display:grid;gap:12px;justify-items:center;padding:26px 20px}
.endcard h3{font-size:20px}
.endcard .btns{width:100%;max-width:420px}

/* setup */
.sheet{max-width:560px;margin:24px auto 0;display:grid;gap:18px}
.sheet h1{font-size:26px}
.label{font-size:13px;font-family:var(--f-mono);letter-spacing:.1em;color:var(--muted);margin-bottom:8px;display:block}
.countbox{display:grid;gap:14px}
.countrow{display:flex;align-items:center;gap:12px}
.countrow input[type=number]{width:96px;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-family:var(--f-mono);font-size:22px;text-align:center;color:var(--accent)}
.countrow input[type=number]:focus{outline:none;border-color:var(--accent)}
.countrow .of{color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{min-width:58px;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-family:var(--f-mono);font-size:15px}
.presets button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.presets button[disabled]{opacity:.35}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;text-align:left;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.mode .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:3px;display:grid;place-items:center}
.mode.on{border-color:var(--accent-line);background:var(--accent-dim)}
.mode.on .rd{border-color:var(--accent)}
.mode.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.mode b{display:block}
.mode span{color:var(--fg2);font-size:14px}
.hint{color:var(--muted);font-size:13px}

/* quiz */
.qwrap{max-width:760px;margin:0 auto;padding-top:18px;display:grid;gap:16px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-mono);font-size:14px;color:var(--fg2)}
.qno b{color:var(--accent);font-size:22px;font-weight:500}
.qtags{display:flex;gap:6px;flex-wrap:wrap}
.qcard{padding:22px}
.qtext{font-size:19px;font-weight:600;line-height:1.55;color:var(--fg)}
.qhelp{color:var(--muted);font-size:14px;margin-top:6px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;min-height:54px;transition:border-color .12s,background .12s;font-size:16px;line-height:1.5}
.opt:hover{border-color:var(--line2)}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt.sq .key{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-dim)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--accent);background:var(--accent-dim)}
.opt.right .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-dim)}
.opt.wrong .key{background:var(--bad);color:#1a0703;border-color:var(--bad)}
.opt.locked{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tfrow .opt{justify-content:center;font-weight:600;font-size:18px;min-height:64px;align-items:center}
.match{display:grid;gap:10px;margin-top:18px}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px}
@media(min-width:640px){.mrow{grid-template-columns:1fr 1.1fr;align-items:center}}
.mrow .l{font-weight:600}
.mrow select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:15px}
.mrow.right{border-color:var(--accent)} .mrow.wrong{border-color:var(--bad)}
.mrow .fix{grid-column:1/-1;color:var(--accent);font-size:14px}
.fb{border-radius:14px;padding:16px;display:grid;gap:6px;animation:rise .25s ease}
.fb.ok{background:var(--accent-dim);border:1px solid var(--accent-line)}
.fb.no{background:var(--bad-dim);border:1px solid rgba(255,122,102,.4)}
.fb .h{font-weight:700;font-size:17px}
.fb.ok .h{color:var(--accent)} .fb.no .h{color:var(--bad)}
.fb .ans{color:var(--fg)}
.fb .ex{color:var(--fg2);font-size:15px}
.qnav{display:flex;gap:10px}
.qnav .btn{flex:1}
.qnav .btn.sm{flex:0 0 auto}
.dotsnav{display:flex;flex-wrap:wrap;gap:6px}
.dotsnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dotsnav button.done{color:var(--fg);border-color:var(--line2);background:var(--surface2)}
.dotsnav button.cur{border-color:var(--accent);color:var(--accent)}
.dotsnav button.r{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.dotsnav button.w{background:var(--bad-dim);border-color:rgba(255,122,102,.4);color:var(--bad)}
.confirm{border:1px solid var(--line2);background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:12px;animation:rise .2s ease}
.confirm p{color:var(--fg)}

/* results */
.rtop{display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media(min-width:720px){.rtop{grid-template-columns:auto 1fr}}
.sring{width:170px;height:170px;position:relative;margin:0 auto}
.sring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sring .bg{stroke:var(--surface2)} .sring .fgc{stroke:var(--accent);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.sring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.sring .c b{font-family:var(--f-mono);font-size:34px;font-weight:500;color:var(--accent);line-height:1}
.sring .c span{color:var(--muted);font-size:13px}
.rsum h1{font-size:26px}
.rsum p{color:var(--fg2);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.ok b{color:var(--accent)} .kpi.no b{color:var(--bad)}
.review{display:grid;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--fg2)}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.ritem{border-left:3px solid var(--line2)}
.ritem.ok{border-left-color:var(--accent)} .ritem.no{border-left-color:var(--bad)}
.ritem .rq{font-weight:600;color:var(--fg)}
.ritem dl{margin:10px 0 0;display:grid;gap:4px;font-size:15px}
.ritem dt{color:var(--muted);font-size:12px;font-family:var(--f-mono);letter-spacing:.06em}
.ritem dd{margin:0 0 6px;color:var(--fg2)}
.ritem dd.ya.no{color:var(--bad)} .ritem dd.ca{color:var(--accent)}
.weak{display:grid;gap:8px}
.weakrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.weakrow .t{font-weight:600;min-width:0}
.weakrow .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.weakrow .btn{min-height:38px;padding:6px 14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;animation:rise .2s ease}

.view{animation:fadein .28s ease}
@keyframes fadein{from{opacity:.65;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:.65;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

return g+'</g>'};return `<svg viewBox="0 0 600 196" role="img" aria-label="กราฟเงินเฟ้อจากอุปสงค์และจากต้นทุน">${panel(0,'Demand Pull: D เลื่อนขวา',true)}${panel(305,'Cost Push: S เลื่อนซ้าย',false)}</svg><figcaption>Demand Pull: ราคาขึ้น ปริมาณขึ้น · Cost Push: ราคาขึ้น ปริมาณลด</figcaption>`},

CH.push({
id:'ch8', num:8, icon:'bank', title:'การคลังรัฐบาล', en:'Public Finance',
blurb:'รายรับ ภาษี การใช้จ่าย งบประมาณแผ่นดิน และหนี้สาธารณะ',
sections:[
{id:'s1', tag:'ความหมายการคลัง', title:'ความหมายและผลกระทบของนโยบายการคลัง', html:`
<p class="lead"><b>การคลัง</b> คือการศึกษา <b>รายรับ</b> การจัดทำ<b>งบประมาณแผ่นดิน</b> <b>การใช้จ่าย</b> การบริหาร<b>หนี้สาธารณะ</b> และการดำเนิน<b>นโยบายการคลัง</b>ของรัฐบาล</p>
<div class="flow"><span>รายรับของรัฐบาล</span><i>→</i><span>จัดทำงบประมาณแผ่นดิน</span><i>→</i><span>การใช้จ่ายของรัฐบาล</span></div>
<p>นโยบายการคลังมีผลต่อ<b>การเติบโตทางเศรษฐกิจ</b> เพราะการใช้จ่ายของรัฐ (G) เป็นส่วนหนึ่งของ GDP</p>
<div class="formula">GDP = C + I + G + (X − M)<small>เมื่อ G เพิ่มขึ้น → GDP เพิ่มขึ้น</small></div>
<p>ในแผนภาพการไหลเวียน รัฐบาลอยู่ตรงกลาง เก็บ<b>ภาษี</b>จากครัวเรือนและธุรกิจ แล้วคืนกลับเป็น<b>บริการภาครัฐ</b></p>`},
{id:'s2', tag:'รายรับรัฐบาล', title:'รายรับของรัฐบาล = รายได้ + เงินกู้ + เงินคงคลัง', html:`
<div class="formula">รายรับของรัฐบาล = รายได้ + เงินกู้ + เงินคงคลัง</div>
<h4>รายได้ 4 ประเภท</h4>
<div class="tbl"><table><tr><th>ประเภท</th><th>ตัวอย่าง</th></tr>
<tr><td>1. ภาษีอากร (Taxes and Duties)</td><td>ภาษีเงินได้ ภาษีสรรพสามิต ภาษีการค้า ภาษีทรัพย์สิน ภาษีศุลกากร</td></tr>
<tr><td>2. รายได้จากรัฐพาณิชย์ (State Enterprise)</td><td>กำไรและเงินปันผลจากรัฐวิสาหกิจ เช่น ยาสูบ สลากกินแบ่งรัฐบาล</td></tr>
<tr><td>3. รายได้จากการขายและบริการ (Sale and Services)</td><td>ค่าเช่าที่ดิน ค่าสนามบิน ขายอสังหาริมทรัพย์ ขายของกลางที่ยึดได้</td></tr>
<tr><td>4. รายได้อื่น ๆ (Other Sources)</td><td>ค่าแสตมป์ ค่าธรรมเนียม ค่าปรับต่าง ๆ</td></tr></table></div>
<h4>เงินกู้ของรัฐบาล = หนี้สาธารณะ (Public Debt)</h4>
<p>หนี้ที่รัฐบาล (กระทรวงการคลัง) เป็นผู้กู้ยืม <b>รวมถึงการค้ำประกันเงินกู้</b>ให้หน่วยงานรัฐและรัฐวิสาหกิจ มาจากแหล่งเงินกู้<b>ภายในประเทศ</b>และ<b>ภายนอกประเทศ</b></p>
<h4>เงินคงคลัง</h4>
<p>เปรียบเสมือน<b>เงินออมของรัฐบาล</b> เป็นเงินที่เหลือจากปีก่อน ๆ ที่มีรายได้มากกว่ารายจ่าย แสดงฐานะทางการเงินของรัฐบาล เก็บในรูปเงินฝากธนาคารและสถาบันการเงิน ตาม พ.ร.บ.เงินคงคลัง และ พ.ร.บ.วิธีการงบประมาณ</p>`},
{id:'s3', tag:'หนี้สาธารณะ', title:'หนี้สาธารณะและกรอบวินัยการคลัง', html:`
<p>กรอบวินัยการคลัง (ตาม พ.ร.บ.วินัยการเงินการคลัง 2561) ข้อมูล ณ 31 มี.ค. 2565</p>
<div class="tbl"><table><tr><th>สัดส่วน</th><th>กรอบที่กำหนด</th><th>เกิดขึ้นจริง</th></tr>
<tr><td>หนี้สาธารณะ / GDP</td><td class="num">ไม่เกิน 70%</td><td class="num">60.58%</td></tr>
<tr><td>ภาระหนี้ / ประมาณการรายได้</td><td class="num">ไม่เกิน 35%</td><td class="num">26.77%</td></tr>
<tr><td>หนี้ต่างประเทศ / หนี้สาธารณะทั้งหมด</td><td class="num">ไม่เกิน 10%</td><td class="num">1.79%</td></tr>
<tr><td>หนี้ต่างประเทศ / รายได้จากการส่งออกสินค้าและบริการ</td><td class="num">ไม่เกิน 5%</td><td class="num">0.07%</td></tr></table></div>
<ul class="dots"><li>หนี้สาธารณะต่อ GDP เพิ่มจาก 41.76% (มี.ค.63) → 54.41% (มี.ค.64) → 60.17% (ก.พ.65) รวมเพิ่ม 2.81 ล้านล้านบาท</li>
<li>สัดส่วนใหญ่ที่สุดคือ <b>รัฐบาลกู้โดยตรง 81.65%</b></li>
<li>ช่วงโควิด-19 (2020 เป็นต้นไป) งบประมาณรายจ่ายสูงกว่ารายได้สุทธิ ช่องว่างกว้างขึ้น หนี้จึงเพิ่มเร็ว</li></ul>`},
{id:'s4', tag:'ภาษีอากร', title:'ภาษีอากร: แหล่งรายรับสำคัญที่สุด', html:`
<ul class="dots"><li>เป็น<b>แหล่งรายรับที่สำคัญที่สุด</b></li><li>เป็นเงินที่รัฐ<b>บังคับ</b>จัดเก็บจากประชาชน</li><li>เป็น<b>เครื่องมือทางการคลัง</b>ของรัฐ</li>
<li>หน่วยงานที่จัดเก็บคือ <b>กระทรวงการคลัง</b> ผ่าน <b>กรมศุลกากร กรมสรรพสามิต และกรมสรรพากร</b></li></ul>
<div class="tbl"><table><tr><th>กลุ่มภาษี</th><th>ตัวอย่าง</th></tr>
<tr><td>(1) ภาษีสรรพากร</td><td>ภาษีเงินได้บุคคลธรรมดา ภาษีเงินได้นิติบุคคล ภาษีมูลค่าเพิ่ม</td></tr>
<tr><td>(2) ภาษีศุลกากร</td><td>ภาษีนำเข้า ภาษีส่งออก</td></tr>
<tr><td>(3) ภาษีสรรพสามิต</td><td>ภาษีเหล้า ภาษีบุหรี่ ภาษีน้ำมัน ภาษีสินค้าฟุ่มเฟือย</td></tr>
<tr><td>(4) ภาษีอื่น ๆ</td><td>ภาษีที่ดิน ภาษีมรดก ภาษีรถยนต์</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> “สรรพากร = เงินได้ + VAT”, “ศุลกากร = ข้ามพรมแดน (เข้า/ออก)”, “สรรพสามิต = ของบาป + ของฟุ่มเฟือย (เหล้า บุหรี่ น้ำมัน)”</div>`},
{id:'s5', tag:'ประเภทและอัตราภาษี', title:'ภาษีทางตรง ทางอ้อม และอัตราภาษี 3 แบบ', html:`
<div class="cols"><div class="box"><h4>ภาษีทางตรง (Direct Taxes)</h4><ul class="dots"><li>ผู้เสียภาษี<b>ผลักภาระไปให้ผู้อื่นไม่ได้</b> หรือทำได้ยาก</li><li>เก็บจากฐาน<b>รายได้หรือทรัพย์สิน</b></li><li>เช่น ภาษีเงินได้ ภาษีที่ดิน มรดก</li></ul></div>
<div class="box"><h4>ภาษีทางอ้อม (Indirect Taxes)</h4><ul class="dots"><li>ผู้เสียภาษี<b>ผลักภาระให้ผู้อื่นได้</b> (มากหรือน้อยขึ้นกับความยืดหยุ่นของ D และ S)</li><li>เก็บจากฐาน<b>การบริโภคหรือการขาย</b> ผู้ขายบวกภาษีเข้าไปในราคาสินค้า</li><li>เช่น ภาษีการค้า ภาษีสรรพสามิต ภาษีมูลค่าเพิ่ม</li></ul></div></div>
<h4>อัตราภาษี 3 อัตรา</h4>
<div class="tbl"><table><tr><th>อัตรา</th><th>ความหมาย</th><th>ผล</th></tr>
<tr><td><b>ก้าวหน้า</b></td><td>รายได้สูง เสียอัตรา<b>สูงกว่า</b>คนรายได้ต่ำ</td><td>ช่วยกระจายรายได้ให้เป็นธรรม</td></tr>
<tr><td><b>คงที่</b></td><td>จัดเก็บอัตราเดียว</td><td>ใช้กระตุ้นเศรษฐกิจ</td></tr>
<tr><td><b>ถอยหลัง</b></td><td>รายได้สูง รับภาระในอัตรา<b>ต่ำกว่า</b>คนรายได้ต่ำ</td><td>—</td></tr></table></div>
<div class="trap"><b>จุดที่มักสับสน</b> ภาษีสรรพสามิตเป็น<b>ภาษีทางอ้อม</b> (ผู้ขายบวกในราคา) ไม่ใช่ทางตรง ส่วนภาษีมรดกเป็น<b>ทางตรง</b> เพราะเก็บจากทรัพย์สิน</div>`},
{id:'s6', tag:'คำนวณภาษีเงินได้', title:'อัตราภาษีเงินได้บุคคลธรรมดา 2565 และตัวอย่างคำนวณ', html:`
<div class="tbl"><table><tr><th>รายได้สุทธิต่อปี (บาท)</th><th>อัตรา</th></tr>
<tr><td>0 – 150,000</td><td class="num">ยกเว้น</td></tr><tr><td>150,001 – 300,000</td><td class="num">5%</td></tr><tr><td>300,001 – 500,000</td><td class="num">10%</td></tr><tr><td>500,001 – 750,000</td><td class="num">15%</td></tr><tr><td>750,001 – 1,000,000</td><td class="num">20%</td></tr><tr><td>1,000,001 – 2,000,000</td><td class="num">25%</td></tr><tr><td>2,000,001 – 5,000,000</td><td class="num">30%</td></tr><tr><td>5,000,001 ขึ้นไป</td><td class="num">35%</td></tr></table></div>
<div class="example"><b>ตัวอย่างจากสไลด์</b> นาย A มีรายได้สุทธิ 291,000 บาท อยู่ในขั้นสูงสุด 5%<br>150,000 บาทแรกยกเว้นภาษี → ส่วนที่ต้องเสีย = 291,000 − 150,000 = 141,000 บาท<br>ภาษี = 141,000 × 5% = <b>7,050 บาท</b></div>
<div class="trap"><b>จุดที่มักสับสน</b> อัตราก้าวหน้าคิด<b>เป็นขั้น</b> ไม่ใช่เอาอัตราสูงสุดคูณทั้งก้อน เช่น รายได้สุทธิ 400,000 → (150,000×5%) + (100,000×10%) = 7,500 + 10,000 = 17,500 บาท</div>`},
{id:'s7', tag:'วัตถุประสงค์ภาษีและการใช้จ่าย', title:'วัตถุประสงค์ของการเก็บภาษีและการใช้จ่ายของรัฐ', html:`
<div class="tbl"><table><tr><th>วัตถุประสงค์ของการเก็บภาษี</th><th>ตัวอย่าง</th></tr>
<tr><td>1) เป็นรายได้ของรัฐ</td><td>ภาษีทุกประเภท</td></tr>
<tr><td>2) รักษาเสถียรภาพทางเศรษฐกิจ</td><td>เพิ่มภาษีเงินได้บุคคลธรรมดา ให้อำนาจซื้อลดลง แก้เงินเฟ้อ</td></tr>
<tr><td>3) กระจายรายได้ให้เป็นธรรม</td><td>เก็บภาษีอัตราก้าวหน้า ผู้มีรายได้มากจ่ายมาก</td></tr>
<tr><td>4) พัฒนาเศรษฐกิจ</td><td>ลดภาษีเงินได้นิติบุคคล ลดภาษีนำเข้าเครื่องจักร เพื่อกระตุ้นการลงทุน</td></tr>
<tr><td>5) แก้ปัญหาขาดดุลการค้า/ดุลชำระเงิน</td><td>เพิ่มภาษีนำเข้า ลดการนำเข้า</td></tr>
<tr><td>6) ชำระหนี้สาธารณะ</td><td>ภาษีทุกประเภทนำมาชำระหนี้</td></tr></table></div>
<div class="flow"><span>D &gt; S</span><i>→</i><span>ระดับราคาเพิ่ม</span><i>→</i><span>เงินเฟ้อ</span><i>→</i><span class="hl">เพิ่มอัตราภาษี</span><i>→</i><span>อำนาจซื้อลดลง</span><i>→</i><span>D ลดลง</span><i>→</i><span>ระดับราคาลดลง</span></div>
<h4>การใช้จ่ายของรัฐบาล</h4>
<div class="tbl"><table><tr><th>วัตถุประสงค์</th><th>ตัวอย่าง</th></tr>
<tr><td>1) สร้างการเติบโตทางเศรษฐกิจ</td><td>ลงทุนสาธารณูปโภคพื้นฐาน ถนน ไฟฟ้า เขื่อน การศึกษา โรงพยาบาล</td></tr>
<tr><td>2) รักษาเสถียรภาพทางเศรษฐกิจ</td><td>เงินเฟ้อ: ลดรายจ่ายรัฐ + เก็บภาษีเพิ่ม / เศรษฐกิจซบเซา: เพิ่มรายจ่าย + ลดภาษี ลดการว่างงาน</td></tr>
<tr><td>3) กระจายรายได้ให้เป็นธรรม</td><td>โครงการเพื่อคนยากจน พยุงราคาสินค้าเกษตร ภาษีทางตรงอัตราก้าวหน้า</td></tr></table></div>`},
{id:'s8', tag:'งบประมาณแผ่นดิน', title:'งบประมาณแผ่นดิน', html:`
<p><b>งบประมาณแผ่นดิน</b> = <b>แผน</b>การใช้จ่ายและการหารายได้ของรัฐบาลในรอบระยะเวลาหนึ่ง โดยปกติ <b>1 ปี</b></p>
<div class="example">ปีงบประมาณ 2567 = <b>1 ตุลาคม 2566 ถึง 30 กันยายน 2567</b></div>
<h4>ขั้นตอนจัดทำงบประมาณของไทย</h4>
<ol class="steps"><li><b>จัดเตรียมงบประมาณ</b> ส่วนราชการ/รัฐวิสาหกิจส่งคำของบประมาณไปยังสำนักงบประมาณ</li><li><b>อนุมัติงบประมาณ</b> รัฐบาลเสนอร่างงบประมาณให้รัฐสภาพิจารณาและอนุมัติ</li><li><b>บริหารงบประมาณ</b> สำนักงบประมาณแจ้งผลให้ส่วนราชการ/รัฐวิสาหกิจทำเรื่องเบิกจ่าย</li></ol>
<div class="tbl"><table><tr><th>งบประมาณ</th><th>เงื่อนไข</th></tr>
<tr><td>เกินดุล</td><td class="num">รายจ่าย &lt; รายได้</td></tr><tr><td>สมดุล</td><td class="num">รายจ่าย = รายได้</td></tr><tr><td>ขาดดุล</td><td class="num">รายจ่าย &gt; รายได้</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> ดูจาก “เงินเหลือไหม” เหลือ = เกินดุล (ใช้แก้เงินเฟ้อ), ขาด = ขาดดุล (ใช้กระตุ้นเศรษฐกิจ/แก้เงินฝืด)</div>`}
],
terms:[['การคลัง','การศึกษารายรับ งบประมาณ การใช้จ่าย หนี้สาธารณะ และนโยบายการคลังของรัฐบาล'],['หนี้สาธารณะ','หนี้ที่กระทรวงการคลังกู้ รวมการค้ำประกันเงินกู้ให้หน่วยงานรัฐและรัฐวิสาหกิจ'],['เงินคงคลัง','เงินออมของรัฐบาล เหลือจากปีที่รายได้มากกว่ารายจ่าย'],['ภาษีทางตรง','ผลักภาระไม่ได้ เก็บจากรายได้/ทรัพย์สิน'],['ภาษีทางอ้อม','ผลักภาระได้ เก็บจากการบริโภค/การขาย'],['อัตราก้าวหน้า','รายได้สูงเสียอัตราสูงกว่า'],['งบประมาณแผ่นดิน','แผนรายจ่ายและรายได้ของรัฐในรอบ 1 ปี (1 ต.ค. – 30 ก.ย.)']],
q:[
{t:'mc',tag:'ความหมายการคลัง',q:'ข้อใดไม่ใช่ขอบเขตของ “การคลัง” ตามความหมายในบทเรียน',o:['การกำหนดอัตราดอกเบี้ยนโยบาย','การจัดทำงบประมาณแผ่นดิน','การบริหารหนี้สาธารณะ','รายรับของรัฐบาล'],a:0,e:'การคลังศึกษารายรับ งบประมาณ การใช้จ่าย หนี้สาธารณะ และนโยบายการคลัง ส่วนอัตราดอกเบี้ยนโยบายเป็นเครื่องมือของนโยบายการเงินโดย ธปท.'},
{t:'mc',tag:'ความหมายการคลัง',q:'เหตุใดนโยบายการคลังจึงมีผลต่อการเติบโตทางเศรษฐกิจ',o:['เพราะ G เป็นองค์ประกอบของ GDP = C + I + G + (X − M)','เพราะรัฐบาลเป็นผู้พิมพ์ธนบัตร','เพราะรัฐบาลกำหนดอัตราแลกเปลี่ยน','เพราะภาษีไม่มีผลต่อการบริโภค'],a:0,e:'GDP = C + I + G + (X − M) เมื่อ G เพิ่มขึ้น GDP จะเพิ่มขึ้น'},
{t:'tf',tag:'ความหมายการคลัง',q:'เมื่อรัฐบาลเพิ่มการใช้จ่าย (G) โดยปัจจัยอื่นคงที่ GDP จะลดลง',a:false,e:'G เป็นส่วนประกอบของ GDP เมื่อ G เพิ่ม GDP จะเพิ่มขึ้น'},
{t:'ms',tag:'รายรับรัฐบาล',q:'รายรับของรัฐบาลประกอบด้วยข้อใดบ้าง (เลือกทุกข้อที่ถูก)',o:['รายได้','เงินกู้','เงินคงคลัง','เงินสำรองระหว่างประเทศ'],a:[0,1,2],e:'รายรับของรัฐบาล = รายได้ + เงินกู้ + เงินคงคลัง ส่วนเงินสำรองระหว่างประเทศดูแลโดย ธปท.'},
{t:'mc',tag:'รายรับรัฐบาล',q:'“เงินคงคลัง” เปรียบได้กับข้อใด',o:['เงินออมของรัฐบาล','เงินกู้ระยะสั้นของรัฐบาล','เงินสำรองระหว่างประเทศ','เงินฝากของประชาชนที่ ธปท.'],a:0,e:'เงินคงคลังเปรียบเสมือนเงินออมของรัฐบาล เป็นเงินที่เหลือจากปีก่อน ๆ ที่มีรายได้มากกว่ารายจ่าย'},

{t:'mc',tag:'งบประมาณแผ่นดิน',q:'ลำดับขั้นตอนการจัดทำงบประมาณแผ่นดินของไทยข้อใดถูกต้อง',o:['จัดเตรียม → อนุมัติ → บริหาร','อนุมัติ → จัดเตรียม → บริหาร','บริหาร → จัดเตรียม → อนุมัติ','จัดเตรียม → บริหาร → อนุมัติ'],a:0,e:'จัดเตรียมงบประมาณ → อนุมัติงบประมาณ → บริหารงบประมาณ'},
{t:'tf',tag:'งบประมาณแผ่นดิน',q:'งบประมาณขาดดุล คือการที่รัฐบาลมีรายจ่ายน้อยกว่ารายได้',a:false,e:'ขาดดุล = รายจ่ายมากกว่ารายได้ ส่วนรายจ่ายน้อยกว่ารายได้คือเกินดุล'},
{t:'match',tag:'งบประมาณแผ่นดิน',q:'จับคู่ประเภทงบประมาณกับเงื่อนไข',pairs:[['งบประมาณเกินดุล','รายจ่าย < รายได้'],['งบประมาณสมดุล','รายจ่าย = รายได้'],['งบประมาณขาดดุล','รายจ่าย > รายได้']],e:'เกินดุล: จ่ายน้อยกว่ารับ / สมดุล: เท่ากัน / ขาดดุล: จ่ายมากกว่ารับ'},
{t:'match',tag:'ภาษีอากร',q:'จับคู่ภาษีกับกลุ่มภาษีตามสไลด์',pairs:[['ภาษีเงินได้นิติบุคคล','ภาษีสรรพากร'],['ภาษีส่งออก','ภาษีศุลกากร'],['ภาษีบุหรี่','ภาษีสรรพสามิต'],['ภาษีรถยนต์','ภาษีอื่น ๆ']],e:'สรรพากร: เงินได้/VAT, ศุลกากร: นำเข้า-ส่งออก, สรรพสามิต: เหล้า บุหรี่ น้ำมัน ฟุ่มเฟือย, อื่น ๆ: ที่ดิน มรดก รถยนต์'}
],
gens:[
{tag:'คำนวณภาษีเงินได้',f:()=>{const inc=H.R(16,240)*10000+H.pick([0,5000]);const br=[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[1e15,.35]];let tax=0,prev=0,steps=[],top=0;for(const[lim,r]of br){if(inc>prev){const part=Math.min(inc,lim)-prev;if(r>0&&part>0){tax+=part*r;steps.push(H.n(part)+'×'+(r*100)+'%');}top=r;}prev=lim;}tax=Math.round(tax);const wrong1=Math.round(inc*top),wrong2=Math.round((inc-150000)*top),wrong3=Math.round(tax*1.5/100)*100||tax+5000;return{t:'mc',q:`ผู้มีรายได้สุทธิ ${H.n(inc)} บาทต่อปี ต้องเสียภาษีเงินได้บุคคลธรรมดาเท่าใด (ใช้อัตราปี 2565)`,o:H.opts(H.n(tax)+' บาท',[H.n(wrong1)+' บาท',H.n(wrong2)+' บาท',H.n(wrong3)+' บาท',H.n(tax+7500)+' บาท']),a:0,e:`คิดเป็นขั้น: 150,000 แรกยกเว้น แล้ว ${steps.join(' + ')} = ${H.n(tax)} บาท (อัตราสูงสุดที่ถึงคือ ${top*100}%)`}}},
{tag:'งบประมาณแผ่นดิน',f:()=>{const rev=H.R(25,35)*100000,d=H.pick([-1,0,1]),exp=d===0?rev:rev+d*H.R(1,6)*50000;const ans=d<0?'งบประมาณเกินดุล':d>0?'งบประมาณขาดดุล':'งบประมาณสมดุล';return{t:'mc',q:`รัฐบาลประมาณการรายได้ ${H.n(rev)} ล้านบาท และตั้งรายจ่าย ${H.n(exp)} ล้านบาท งบประมาณนี้เป็นแบบใด`,o:H.opts(ans,['งบประมาณเกินดุล','งบประมาณขาดดุล','งบประมาณสมดุล','งบประมาณก้าวหน้า']),a:0,e:`รายจ่าย ${exp<rev?'<':exp>rev?'>':'='} รายได้ → ${ans}`}}},
{tag:'งบประมาณแผ่นดิน',f:()=>{const y=H.R(2560,2575);return{t:'mc',q:`ปีงบประมาณ ${y} เริ่มต้นและสิ้นสุดเมื่อใด`,o:H.opts(`1 ต.ค. ${y-1} – 30 ก.ย. ${y}`,[`1 ม.ค. ${y} – 31 ธ.ค. ${y}`,`1 ต.ค. ${y} – 30 ก.ย. ${y+1}`,`1 เม.ย. ${y} – 31 มี.ค. ${y+1}`]),a:0,e:`ปีงบประมาณไทยเริ่ม 1 ตุลาคมของปีก่อนหน้า ปีงบ ${y} จึงเป็น 1 ต.ค. ${y-1} – 30 ก.ย. ${y}`}}},
{tag:'ประเภทและอัตราภาษี',f:()=>{const d=['ภาษีเงินได้บุคคลธรรมดา','ภาษีเงินได้นิติบุคคล','ภาษีที่ดิน','ภาษีมรดก'],i=['ภาษีมูลค่าเพิ่ม','ภาษีสรรพสามิต','ภาษีการค้า','ภาษีบุหรี่','ภาษีน้ำมัน'];const isD=Math.random()<.5,x=H.pick(isD?d:i);return{t:'tf',q:`${x} เป็นภาษีทางตรง`,a:isD,e:isD?`${x} เก็บจากฐานรายได้หรือทรัพย์สิน ผลักภาระไม่ได้ จึงเป็นภาษีทางตรง`:`${x} เก็บจากฐานการบริโภคหรือการขาย ผลักภาระได้ จึงเป็นภาษีทางอ้อม`}}},
{tag:'ภาษีอากร',f:()=>{const m=[['ภาษีเงินได้บุคคลธรรมดา','กรมสรรพากร'],['ภาษีเงินได้นิติบุคคล','กรมสรรพากร'],['ภาษีมูลค่าเพิ่ม','กรมสรรพากร'],['ภาษีนำเข้า','กรมศุลกากร'],['ภาษีส่งออก','กรมศุลกากร'],['ภาษีเหล้า','กรมสรรพสามิต'],['ภาษีบุหรี่','กรมสรรพสามิต'],['ภาษีน้ำมัน','กรมสรรพสามิต'],['ภาษีสินค้าฟุ่มเฟือย','กรมสรรพสามิต']];const[x,g]=H.pick(m);return{t:'mc',q:`“${x}” จัดเก็บโดยกรมใด`,o:H.opts(g,['กรมสรรพากร','กรมศุลกากร','กรมสรรพสามิต','กรมธนารักษ์']),a:0,e:`${x} อยู่ในกลุ่ม${g.replace('กรม','ภาษี')} จัดเก็บโดย${g}`}}},
{tag:'รายรับรัฐบาล',f:()=>{const m=[['กำไรจากโรงงานยาสูบ','รายได้จากรัฐพาณิชย์'],['กำไรจากสลากกินแบ่งรัฐบาล','รายได้จากรัฐพาณิชย์'],['ค่าเช่าที่ดินของรัฐ','รายได้จากการขายและบริการ'],['ค่าสนามบิน','รายได้จากการขายและบริการ'],['การขายของกลางที่ยึดได้','รายได้จากการขายและบริการ'],['การขายอสังหาริมทรัพย์ของรัฐ','รายได้จากการขายและบริการ'],['ค่าแสตมป์','รายได้อื่น ๆ'],['ค่าธรรมเนียม','รายได้อื่น ๆ'],['ค่าปรับต่าง ๆ','รายได้อื่น ๆ'],['ภาษีศุลกากร','ภาษีอากร'],['ภาษีทรัพย์สิน','ภาษีอากร']];const[x,g]=H.pick(m);return{t:'mc',q:`“${x}” จัดเป็นรายได้ของรัฐบาลประเภทใด`,o:H.opts(g,['ภาษีอากร','รายได้จากรัฐพาณิชย์','รายได้จากการขายและบริการ','รายได้อื่น ๆ']),a:0,e:`${x} จัดอยู่ใน “${g}” ตามตารางรายได้ 4 ประเภท`}}},
{tag:'หนี้สาธารณะ',f:()=>{const v=H.R(45,85)+H.pick([.2,.5,.8]);if(Math.abs(v-70)<1)return null;const ok=v<=70;return{t:'tf',q:`ถ้าหนี้สาธารณะต่อ GDP เท่ากับ ${v.toFixed(1)}% ถือว่ายังอยู่ภายในกรอบวินัยการคลัง`,a:ok,e:`กรอบหนี้สาธารณะ/GDP ไม่เกิน 70% ค่า ${v.toFixed(1)}% จึง${ok?'อยู่ในกรอบ':'เกินกรอบ'}`}}},
{tag:'ความหมายการคลัง',f:()=>{const C=H.R(40,70)*10,I=H.R(10,30)*10,G=H.R(10,25)*10,X=H.R(20,50)*10,M=H.R(20,50)*10,g=H.R(2,8)*10;const a=C+I+G+X-M,b=a+g;return{t:'mc',q:`ถ้า C = ${C}, I = ${I}, G = ${G}, X = ${X}, M = ${M} (พันล้านบาท) หากรัฐเพิ่ม G อีก ${g} โดยอื่นคงที่ GDP ใหม่เท่าใด`,o:H.opts(H.n(b),[H.n(a),H.n(b+2*(M-X)),H.n(a-g)]),a:0,e:`GDP เดิม = ${C}+${I}+${G}+(${X}−${M}) = ${a} เมื่อ G เพิ่ม ${g} → GDP = ${b}`}}}
]
});

CH.push({
id:'ch9', num:9, icon:'coins', title:'การเงินและการธนาคาร', en:'Money & Banking',
blurb:'เงิน ปริมาณเงิน M1/M2 ตลาดเงิน นโยบายการเงินของ ธปท. และ CBDC',
sections:[
{id:'s1', tag:'ความหมายและลักษณะของเงิน', title:'ความหมายและลักษณะของเงินที่ดี', html:`
<p class="lead"><b>เงิน</b> คือสิ่งที่คนในสังคมเดียวกันยอมรับ และใช้เป็นสื่อกลางในการแลกเปลี่ยน ใช้ชำระหนี้ได้ตามกฎหมาย</p>
<div class="flow"><span>อดีต: ของแลกของ (Barter system)</span><i>→</i><span>ปัจจุบัน: เงิน (Money system)</span></div>
<h4>ลักษณะของเงินที่ดี 6 ข้อ</h4>
<div class="chips"><span>สังคมยอมรับ</span><span>มีค่าคงที่</span><span>หาได้ยาก เลียนแบบยาก</span><span>มีความคงทน</span><span>สะดวกในการเคลื่อนย้าย</span><span>แบ่งเป็นหน่วยย่อยได้</span></div>`},
{id:'s2', tag:'หน้าที่ของเงิน', title:'หน้าที่และประโยชน์ของเงิน', html:`
<ol class="steps"><li>เป็น<b>สื่อกลางในการแลกเปลี่ยน</b></li><li>เป็น<b>มาตรฐานในการวัดมูลค่า</b></li><li>เป็น<b>สิ่งสะสมมูลค่า</b></li><li>เป็น<b>มาตรฐานในการชำระหนี้ในอนาคต</b></li></ol>
<div class="memo"><b>เทคนิคจำ</b> “แลก – วัด – เก็บ – จ่ายหนี้” ซื้อของ (แลก) ดูป้ายราคา (วัด) ออมไว้ (เก็บ) ผ่อนบ้าน (จ่ายหนี้อนาคต)</div>`},
{id:'s3', tag:'ผู้ผลิตเงิน', title:'ผู้ผลิตเงิน', html:`
<div class="tbl"><table><tr><th>ชนิดของเงิน</th><th>ผู้ผลิต</th></tr>
<tr><td>เหรียญกษาปณ์</td><td>กรมธนารักษ์ กระทรวงการคลัง</td></tr>
<tr><td>ธนบัตร</td><td>ธนาคารแห่งประเทศไทย</td></tr>
<tr><td>เช็ค (เงินฝากกระแสรายวัน)</td><td>ธนาคารพาณิชย์</td></tr></table></div>
<div class="trap"><b>จุดที่มักสับสน</b> เหรียญ ≠ ธปท. เหรียญผลิตโดย<b>กรมธนารักษ์</b> ส่วน ธปท. ผลิต<b>ธนบัตร</b></div>`},
{id:'s4', tag:'ปริมาณเงิน M1 M2', title:'ปริมาณเงินหรืออุปทานของเงิน (M1, M2)', html:`
<div class="formula">M1 = ธนบัตร + เหรียญกษาปณ์ + เงินฝากกระแสรายวัน (เช็ค)<small>ปริมาณเงินตามความหมายแคบ: เงินที่หมุนเวียนในระบบเศรษฐกิจ</small></div>
<div class="formula">M2 = M1 + Near Money<small>Near Money (กึ่งเงิน) = สิ่งที่เปลี่ยนเป็นเงินได้ง่าย เช่น เงินฝากออมทรัพย์ เงินฝากประจำ ตั๋วเงินคลัง พันธบัตร</small></div>
<h4>เส้นอุปทานของเงิน (MS)</h4>
<figure class="fig">${FIG.ms()}</figure>
<ul class="dots"><li>MS เป็น<b>เส้นตั้งฉาก</b> ปริมาณเงิน ณ ขณะหนึ่งคงที่ ไม่ว่าอัตราดอกเบี้ยจะสูงหรือต่ำ</li><li>การเปลี่ยนแปลงปริมาณเงินเกิดจาก<b>ธนาคารกลางและนโยบายการเงิน</b> (เส้นย้ายซ้าย = ลดปริมาณเงิน, ย้ายขวา = เพิ่ม)</li></ul>
<div class="trap"><b>จุดที่มักสับสน</b> เงินฝาก<b>กระแสรายวัน</b>อยู่ใน M1 แต่เงินฝาก<b>ออมทรัพย์/ประจำ</b>เป็น Near Money จึงอยู่ใน M2 เท่านั้น</div>`},
{id:'s5', tag:'อุปสงค์ของเงิน', title:'ความต้องการถือเงินหรืออุปสงค์ของเงิน (MD)', html:`
<div class="tbl"><table><tr><th>วัตถุประสงค์การถือเงิน</th><th>ขึ้นกับอัตราดอกเบี้ย?</th></tr>
<tr><td>1) เพื่อใช้จ่ายประจำวัน</td><td>ไม่ขึ้นกับอัตราดอกเบี้ย</td></tr>
<tr><td>2) เพื่อใช้ยามฉุกเฉิน</td><td>ไม่ขึ้นกับอัตราดอกเบี้ย</td></tr>
<tr><td>3) เพื่อเก็งกำไร</td><td><b>ขึ้นอยู่กับอัตราดอกเบี้ย</b></td></tr></table></div>
<p>เส้น MD ลาดลงจากซ้ายไปขวา (ดอกเบี้ยสูง → ถือเงินน้อย) เส้นย้ายขวา = ความต้องการถือเงินเพิ่ม ย้ายซ้าย = ลดลง</p>`},
{id:'s6', tag:'ดุลยภาพตลาดเงิน', title:'ดุลยภาพของตลาดเงิน', html:`
<p>ดุลยภาพเกิดเมื่อ<b>เส้น MD ตัดกับเส้น MS</b> ทำให้เกิด<b>อัตราดอกเบี้ยดุลยภาพ</b> และเปลี่ยนแปลงได้</p>
<figure class="fig">${FIG.moneyEq()}</figure>
<div class="tbl"><table><tr><th>เหตุการณ์</th><th>อัตราดอกเบี้ยดุลยภาพ</th></tr>
<tr><td>ความต้องการถือเงินลดลง (MD⁰ → MD¹)</td><td>ลดลง (r⁰ → r¹)</td></tr>
<tr><td>ความต้องการถือเงินเพิ่มขึ้น (MD⁰ → MD²)</td><td>เพิ่มขึ้น (r⁰ → r²)</td></tr>
<tr><td>ธนาคารกลาง<b>ลด</b>ปริมาณเงิน (MS⁰ → MS¹)</td><td>เพิ่มขึ้น</td></tr>
<tr><td>ธนาคารกลาง<b>เพิ่ม</b>ปริมาณเงิน (MS⁰ → MS²)</td><td>ลดลง</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> ดอกเบี้ย = “ราคาของเงิน” เงินหายาก (MS ลด หรือ MD เพิ่ม) → ราคาแพงขึ้น → ดอกเบี้ยขึ้น</div>`},
{id:'s7', tag:'อิทธิพลของปริมาณเงิน', title:'อิทธิพลของปริมาณเงินต่อระบบเศรษฐกิจ (Keynes)', html:`
<p><b>1. ปริมาณเงินเพิ่ม → เศรษฐกิจขยายตัว</b> (GDP = C + I + G + (X−M))</p>
<div class="flow"><span>M ↑</span><i>→</i><span>r ↓</span><i>→</i><span>การลงทุน (I) ↑</span><i>→</i><span>การจ้างงาน ↑</span><i>→</i><span>ผลผลิตและการบริโภค ↑</span><i>→</i><span class="hl">รายได้ประชาชาติ ↑</span></div>
<p><b>2. ปริมาณเงินเพิ่ม → อาจเกิดเงินเฟ้อ</b></p>
<div class="flow"><span>M ↑ &gt; ผลผลิต ↑</span><i>→</i><span>D &gt; S</span><i>→</i><span class="hl">P ↑</span></div>
<div class="formula">MV = PQ<small>M = ปริมาณเงิน, V = อัตราการหมุนเวียนของเงิน, P = ราคาสินค้า, Q = ปริมาณสินค้า<br>ในระยะสั้น V และ Q คงที่ ดังนั้นเมื่อ M เพิ่ม P จะเพิ่ม → เงินเฟ้อ</small></div>`},
{id:'s8', tag:'นโยบายการเงิน', title:'นโยบายการเงินของ ธปท.', html:`
<p><b>นโยบายการเงิน</b> คือเครื่องมือของธนาคารกลางในการ<b>กำหนดต้นทุนการกู้ยืม หรือปริมาณเงินในระบบเศรษฐกิจ</b> ซึ่งส่งผลต่อการทำงานของระบบเศรษฐกิจและราคาสินค้า</p>
<ul class="dots"><li>ธปท. ใช้<b>อัตราดอกเบี้ยนโยบาย</b>เป็นเครื่องมือหลัก</li><li>อัตราดอกเบี้ยนโยบาย = <b>อัตราดอกเบี้ยธุรกรรมซื้อคืนพันธบัตรแบบทวิภาคี ระยะ 1 วัน (RP 1 วัน)</b> (Bilateral Repurchase Transactions)</li><li>ธปท. ทำ <b>OMOs</b> (Open Market Operations) เพื่อดูแลดอกเบี้ยระยะสั้นในตลาดเงินให้สอดคล้องกับดอกเบี้ยนโยบาย และมีหน้าต่างตั้งรับ (±50 bps.)</li></ul>
<h4>ขั้นตอนการดำเนินนโยบาย</h4>
<ol class="steps"><li>ข้อมูล → ประชุม <b>กนง. 8 ครั้งต่อปี</b></li><li>กนง. ประกอบด้วย ผู้บริหาร ธปท. <b>3 ท่าน</b> + ผู้ทรงคุณวุฒิภายนอก <b>4 ท่าน</b> (รวม 7)</li><li>ตัดสินนโยบาย: ขึ้น / คง / ลด RP 1 วัน</li><li>แถลงข่าวผลการประชุม</li><li>ทำ OMOs เพื่อรักษาระดับดอกเบี้ยนโยบาย</li><li>รายงานนโยบายการเงิน</li></ol>
<h4>เป้าหมายของนโยบายการเงิน</h4>
<p>ใช้<b>กรอบเป้าหมายเงินเฟ้อแบบยืดหยุ่น (Flexible Inflation Targeting)</b> 3 เป้าหมาย:</p>
<div class="chips"><span>เสถียรภาพด้านราคาในระยะปานกลาง</span><span>เศรษฐกิจเติบโตอย่างยั่งยืน</span><span>เสถียรภาพของระบบการเงิน</span></div>
<p>เครื่องมือที่ผสมผสาน: นโยบายการเงิน มาตรการดูแลอัตราแลกเปลี่ยน มาตรการดูแลเงินทุนเคลื่อนย้าย มาตรการทางการเงิน มาตรการดูแลเสถียรภาพระบบการเงิน</p>`},
{id:'s9', tag:'สถาบันการเงิน', title:'สถาบันการเงินที่เกี่ยวกับนโยบายการเงิน', html:`
<div class="cols"><div class="box"><h4>ธนาคาร</h4><div class="chips"><span>ธนาคารกลาง</span><span>ธนาคารพาณิชย์</span><span>ธนาคารเฉพาะกิจ</span></div></div>
<div class="box"><h4>ไม่ใช่ธนาคาร</h4><div class="chips"><span>ตลาดหลักทรัพย์แห่งประเทศไทย</span><span>บริษัทหลักทรัพย์</span><span>สหกรณ์ออมทรัพย์</span><span>สถาบันอื่น ๆ</span></div></div></div>`},
{id:'s10', tag:'สกุลเงินดิจิทัลและ CBDC', title:'สกุลเงินดิจิทัล (Cryptocurrency) และ CBDC', html:`
<p><b>Cryptocurrency</b> คือสินทรัพย์ดิจิทัลที่ออกแบบมาเพื่อเป็นสื่อกลางในการแลกเปลี่ยน: ใช้แลกเปลี่ยนสิ่งของ ใช้สะสมมูลค่า มีจำนวนจำกัด เช่น Bitcoin (BTC), Ethereum (ETH), Ripple (XRP), Litecoin (LTC)</p>
<div class="cols"><div class="box"><h4>สกุลเงินปกติ</h4><p>มีตัวกลางควบคุม (Centralize)</p></div><div class="box"><h4>สกุลเงินดิจิทัล</h4><p>ไม่มีตัวกลางควบคุม (Decentralize) จับต้องไม่ได้ ใช้ระบบ Blockchain<br>จุดเด่น: โปร่งใสตรวจสอบได้ · ทำธุรกรรมเร็ว ค่าธรรมเนียมต่ำ · น่าเชื่อถือ ปลอดภัยสูง</p></div></div>
<p><b>CBDC (Central Bank Digital Currency)</b> คือสกุลเงินดิจิทัลที่<b>ออกโดยธนาคารกลาง</b>ของแต่ละประเทศ ใช้งานไม่ต่างจากเงินสด เป็นเงินของรัฐแต่อยู่ในรูปดิจิทัล ไม่ต้องพิมพ์เงิน ส่วนใหญ่มี Blockchain เป็นส่วนประกอบ</p>
<p><b>ทำไมต้องมี CBDC</b> ต้องการยกระดับการทำธุรกรรมระหว่างธนาคารหรือการโอนข้ามประเทศ (Cross-border Payment) และสร้างโครงสร้างพื้นฐานทางการเงินในระดับถัดไป เช่น จีนและสวีเดนที่เป็นสังคมไร้เงินสด (Cashless Society)</p>
<h4>ผลกระทบของ CBDC</h4><ul class="dots"><li>ลดต้นทุนการผลิตเงินที่จับต้องได้</li><li>สกุลเงินแต่ละประเทศจะเหมือนสินค้าที่ผู้คนเลือกใช้ได้</li><li>แจกเงินแก่ประชาชนได้ง่ายขึ้นเมื่อเกิดวิกฤต</li><li>คำถามต่อบทบาทธนาคารพาณิชย์ เมื่อผู้คนทำธุรกรรมโดยไม่ต้องพึ่งธนาคาร</li><li>ข้อกังวลด้านความเป็นส่วนตัว (เงินสดเป็นส่วนตัวกว่า)</li><li>รัฐอาจระงับหรืออายัด CBDC ได้ เช่น ปฏิเสธ CBDC ที่เกี่ยวข้องกับการฟอกเงิน</li></ul>
<div class="trap"><b>จุดที่มักสับสน</b> Cryptocurrency = <b>ไม่มีตัวกลาง</b> (Decentralize) แต่ CBDC = <b>ธนาคารกลางเป็นผู้ออก</b> แม้ทั้งคู่จะเป็นดิจิทัล</div>`}
],

{t:'mc',tag:'สกุลเงินดิจิทัลและ CBDC',q:'CBDC คืออะไร',o:['สกุลเงินดิจิทัลที่ออกโดยธนาคารกลางของแต่ละประเทศ','สกุลเงินดิจิทัลที่ไม่มีผู้ควบคุม','บัตรเครดิตของธนาคารพาณิชย์','พันธบัตรรัฐบาลดิจิทัล'],a:0,e:'CBDC (Central Bank Digital Currency) คือสกุลเงินดิจิทัลที่ออกโดยธนาคารกลาง ใช้งานไม่ต่างจากเงินสด'},

gens:[
{tag:'ปริมาณเงิน M1 M2',f:()=>{const b=H.R(10,30)*100,c=H.R(1,5)*50,d=H.R(5,20)*100,s=H.R(10,40)*100,f=H.R(5,20)*100,tb=H.R(1,6)*100;const m1=b+c+d,m2=m1+s+f+tb,ask=H.pick(['M1','M2']),ans=ask==='M1'?m1:m2;return{t:'mc',q:`กำหนด (พันล้านบาท) ธนบัตร ${H.n(b)} เหรียญกษาปณ์ ${H.n(c)} เงินฝากกระแสรายวัน ${H.n(d)} เงินฝากออมทรัพย์ ${H.n(s)} เงินฝากประจำ ${H.n(f)} ตั๋วเงินคลัง ${H.n(tb)} จงหา ${ask}`,o:H.opts(H.n(ans),[H.n(ask==='M1'?m2:m1),H.n(b+c),H.n(b+c+s),H.n(m1+s)]),a:0,e:`M1 = ${H.n(b)}+${H.n(c)}+${H.n(d)} = ${H.n(m1)}; M2 = M1 + Near Money (${H.n(s)}+${H.n(f)}+${H.n(tb)}) = ${H.n(m2)}`}}},
{tag:'ปริมาณเงิน M1 M2',f:()=>{const m=[['ธนบัตร','M1'],['เหรียญกษาปณ์','M1'],['เงินฝากกระแสรายวัน','M1'],['เงินฝากออมทรัพย์','Near Money'],['เงินฝากประจำ','Near Money'],['ตั๋วเงินคลัง','Near Money'],['พันธบัตร','Near Money']];const[x,g]=H.pick(m);return{t:'tf',q:`“${x}” นับรวมอยู่ในปริมาณเงินตามความหมายแคบ (M1)`,a:g==='M1',e:g==='M1'?`${x} เป็นส่วนประกอบของ M1 (ธนบัตร + เหรียญ + เงินฝากกระแสรายวัน)`:`${x} เป็น Near Money จึงอยู่ใน M2 แต่ไม่อยู่ใน M1`}}},
{tag:'อิทธิพลของปริมาณเงิน',f:()=>{let M=H.R(2,12)*100,V=H.R(2,8),Q=H.R(4,20)*10;let P=M*V/Q;if(!Number.isInteger(P*100))return null;const ask=H.pick(['P','M','V']);let ans,ql;if(ask==='P'){ans=P;ql=`M = ${M}, V = ${V}, Q = ${Q}`}else if(ask==='M'){ans=M;ql=`V = ${V}, P = ${P}, Q = ${Q}`}else{ans=V;ql=`M = ${M}, P = ${P}, Q = ${Q}`}const d=[ans*2,ans/2,ans+V,ans*V].filter(x=>x!==ans).map(x=>+x.toFixed(2));return{t:'mc',q:`ใช้สมการ MV = PQ ถ้า ${ql} จงหาค่า ${ask}`,o:H.opts(String(+ans.toFixed(2)),d.map(String)),a:0,e:`MV = PQ → ${ask==='P'?'P = MV/Q = '+M+'×'+V+'/'+Q:ask==='M'?'M = PQ/V = '+P+'×'+Q+'/'+V:'V = PQ/M = '+P+'×'+Q+'/'+M} = ${+ans.toFixed(2)}`}}},
{tag:'ดุลยภาพตลาดเงิน',f:()=>{const s=[['ธนาคารกลางเพิ่มปริมาณเงิน (MS เลื่อนขวา)','ลดลง'],['ธนาคารกลางลดปริมาณเงิน (MS เลื่อนซ้าย)','เพิ่มขึ้น'],['ความต้องการถือเงินเพิ่มขึ้น (MD เลื่อนขวา)','เพิ่มขึ้น'],['ความต้องการถือเงินลดลง (MD เลื่อนซ้าย)','ลดลง']];const[x,g]=H.pick(s);return{t:'mc',q:`ในตลาดเงิน ถ้า${x} โดยปัจจัยอื่นคงที่ อัตราดอกเบี้ยดุลยภาพจะเป็นอย่างไร`,o:H.opts(g,['เพิ่มขึ้น','ลดลง','คงที่']),a:0,e:`ดอกเบี้ยคือราคาของเงิน: เงินหายากขึ้น (MS ลด/MD เพิ่ม) ดอกเบี้ยขึ้น, เงินมากขึ้น (MS เพิ่ม/MD ลด) ดอกเบี้ยลง → ${g}`}}},
{tag:'อุปสงค์ของเงิน',f:()=>{const s=[['นาย ก ถอนเงินสดไว้จ่ายค่าอาหารและค่าเดินทางในแต่ละวัน','เพื่อใช้จ่ายประจำวัน'],['นาง ข เก็บเงินสดไว้เผื่อเจ็บป่วยกะทันหัน','เพื่อใช้ยามฉุกเฉิน'],['นาย ค ถือเงินสดรอจังหวะซื้อหุ้นและพันธบัตรเมื่อดอกเบี้ยเปลี่ยน','เพื่อเก็งกำไร'],['บริษัทเก็บเงินสดไว้จ่ายเงินเดือนพนักงาน','เพื่อใช้จ่ายประจำวัน'],['ครอบครัวหนึ่งกันเงินไว้สำหรับซ่อมบ้านหากเกิดน้ำท่วม','เพื่อใช้ยามฉุกเฉิน']];const[x,g]=H.pick(s);return{t:'mc',q:`${x} เป็นการถือเงินตามวัตถุประสงค์ใด`,o:H.opts(g,['เพื่อใช้จ่ายประจำวัน','เพื่อใช้ยามฉุกเฉิน','เพื่อเก็งกำไร']),a:0,e:`${g} ${g==='เพื่อเก็งกำไร'?'ขึ้นอยู่กับอัตราดอกเบี้ย':'ไม่ขึ้นกับอัตราดอกเบี้ย'}`}}},
{tag:'สถาบันการเงิน',f:()=>{const b=['ธนาคารกลาง','ธนาคารพาณิชย์','ธนาคารเฉพาะกิจ'],n=['ตลาดหลักทรัพย์แห่งประเทศไทย','บริษัทหลักทรัพย์','สหกรณ์ออมทรัพย์'];const isB=Math.random()<.5,x=H.pick(isB?b:n);return{t:'tf',q:`“${x}” จัดเป็นสถาบันการเงินประเภทธนาคาร`,a:isB,e:`${x} อยู่ในกลุ่ม${isB?'ธนาคาร':'ไม่ใช่ธนาคาร'}`}}}
]
});

CH.push({
id:'ch10', num:10, icon:'trend', title:'เงินเฟ้อ เงินฝืด เงินตึง', en:'Inflation · Deflation · Tight Money',
blurb:'CPI การคำนวณอัตราเงินเฟ้อ สาเหตุ ระดับความรุนแรง ผลกระทบ และแนวทางแก้',
sections:[
{id:'s1', tag:'ความหมายและการคำนวณเงินเฟ้อ', title:'ความหมายของเงินเฟ้อและดัชนีราคาผู้บริโภค', html:`
<p class="lead"><b>ภาวะเงินเฟ้อ</b> คือภาวะที่<b>ระดับราคาสินค้าโดยทั่วไปสูงขึ้นเรื่อย ๆ อย่างต่อเนื่อง</b> โดยดูจาก<b>ดัชนีราคาผู้บริโภค (CPI)</b></p>
<div class="formula">ดัชนีราคาปีที่ t = (ราคาเฉลี่ยปีที่ t ÷ ราคาเฉลี่ยปีฐาน) × 100<small>ดัชนีราคาผู้บริโภค = ราคาเฉลี่ยของสินค้าและบริการปีที่ t เทียบกับปีฐาน หาก CPI มีแนวโน้มสูงขึ้น แสดงว่าอำนาจซื้อของผู้บริโภคลดลง</small></div>
<div class="formula">อัตราเงินเฟ้อ = (CPI ปีนี้ − CPI ปีก่อน) ÷ CPI ปีก่อน × 100</div>
<div class="example"><b>ตัวอย่างจากสไลด์</b> CPI ปี 2551 = 127.8, ปี 2552 = 128.2<br>อัตราเงินเฟ้อปี 2552 = (128.2 − 127.8) ÷ 127.8 × 100 = <b>0.31%</b></div>
<div class="trap"><b>จุดที่มักสับสน</b> หารด้วย <b>CPI ปีก่อน (ปีฐานของการเปรียบเทียบ)</b> ไม่ใช่ปีนี้ และอย่าลืม × 100</div>`},
{id:'s2', tag:'ประเภทอัตราเงินเฟ้อ', title:'อัตราเงินเฟ้อทั่วไป vs พื้นฐาน', html:`
<div class="cols"><div class="box"><h4>เงินเฟ้อทั่วไป (Headline Inflation)</h4><p>คำนวณจากสินค้า<b>ทุกประเภท</b> เป็นตัวเลขที่พบในข่าวเศรษฐกิจ: อาหาร/เครื่องดื่ม เครื่องใช้ส่วนตัว เครื่องใช้ในบ้าน ที่อยู่อาศัย การรักษาพยาบาล การคมนาคมขนส่ง พลังงาน</p></div>
<div class="box"><h4>เงินเฟ้อพื้นฐาน (Core Inflation)</h4><p><b>ไม่รวมอาหารสดและพลังงาน</b> (ข้าว เนื้อสัตว์ ผัก ผลไม้ ค่าไฟฟ้า ก๊าซหุงต้ม น้ำมันเชื้อเพลิง) เพราะผันผวนมากในระยะสั้น</p></div></div>
<div class="tbl"><table><tr><th>ข้อมูล (สนค.)</th><th>ม.ค. 2565</th><th>ม.ค. 2566</th><th>%YoY</th></tr>
<tr><td>CPI ทั่วไป</td><td class="num">103.01</td><td class="num">108.18</td><td class="num">5.02</td></tr>
<tr><td>Core CPI</td><td class="num">100.99</td><td class="num">104.06</td><td class="num">3.04</td></tr></table></div>`},
{id:'s3', tag:'สาเหตุของเงินเฟ้อ', title:'สาเหตุของเงินเฟ้อ 3 แบบ', html:`
<figure class="fig">${FIG.inflation()}</figure>
<div class="tbl"><table><tr><th>ชนิด</th><th>สาเหตุ</th><th>ผลบนกราฟ</th></tr>
<tr><td><b>Demand Pull</b><br>เงินเฟ้อเพราะอุปสงค์</td><td><b>ความต้องการซื้อ</b>เพิ่มขึ้น</td><td>D เลื่อนขวา ราคา↑ ปริมาณ↑ (จนถึงขีดจำกัดการผลิต แล้วราคาขึ้นอย่างเดียว)</td></tr>
<tr><td><b>Cost Push / Supply Push</b><br>เงินเฟ้อเพราะอุปทาน</td><td><b>ต้นทุนสินค้า</b>เพิ่มขึ้น</td><td>S ลดลง (เลื่อนซ้าย) ราคา↑ ปริมาณ↓</td></tr>
<tr><td><b>Mixed Inflation</b></td><td>ความต้องการซื้อ<b>และ</b>ต้นทุนเพิ่มขึ้นพร้อมกัน</td><td>D เลื่อนขวา + S เลื่อนซ้าย ราคาเพิ่มมาก</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> Demand <b>ดึง</b> (Pull) ราคาขึ้นจากฝั่งคนซื้อ / Cost <b>ดัน</b> (Push) ราคาขึ้นจากฝั่งต้นทุน</div>`},
{id:'s4', tag:'ระดับความรุนแรง', title:'ระดับความรุนแรงของเงินเฟ้อ', html:`
<div class="tbl"><table><tr><th>ระดับ</th><th>ราคาสินค้าสูงขึ้น</th><th>ผลต่อเศรษฐกิจ</th></tr>
<tr><td>1) เงินเฟ้ออย่างอ่อน</td><td class="num">ไม่เกิน 5% ต่อปี</td><td><b>ส่งผลดี</b> นักลงทุนผลิตเพิ่ม GDP เพิ่ม จ้างงานเพิ่ม รายได้เพิ่ม</td></tr>
<tr><td>2) เงินเฟ้อปานกลาง</td><td class="num">5–20% ต่อปี</td><td><b>ส่งผลเสีย</b> ผู้บริโภครีบใช้จ่าย การออมลด ค่าครองชีพสูง แรงงานเรียกร้องค่าจ้าง ต้นทุนเงินทุนเพิ่ม การลงทุนลด GDP ลด</td></tr>
<tr><td>3) เงินเฟ้อรุนแรง</td><td class="num">มากกว่า 20% ต่อปี</td><td><b>ส่งผลเสีย</b> กำลังซื้อลด เงินไม่มีค่า ใช้เป็นสื่อกลางไม่ได้ กลับไปใช้ระบบของแลกของ (Barter) กิจกรรมเศรษฐกิจหยุดชะงัก GDP ลด</td></tr></table></div>
<div class="flow"><span>เงินเฟ้ออย่างอ่อน</span><i>→</i><span>ราคาปัจจัยการผลิตเพิ่ม → ราคาสินค้าเพิ่ม</span><i>→</i><span class="hl">เงินเฟ้อปานกลาง</span><i>→</i><span class="hl">เงินเฟ้อรุนแรง</span></div>`},
{id:'s5', tag:'ผลกระทบของเงินเฟ้อ', title:'ลักษณะเศรษฐกิจที่มีเงินเฟ้อ และผลกระทบ', html:`
<h4>ลักษณะ</h4><ol class="steps"><li>ปริมาณเงินมาก <b>ปริมาณสินค้าไม่พอ</b> ราคาปรับสูงขึ้น</li><li>เศรษฐกิจเติบโต มี<b>อัตราการหมุนเวียนของเงินเพิ่มขึ้น</b></li></ol>
<h4>ผลกระทบ</h4><ol class="steps"><li>ประชาชนต้องการเปลี่ยนเงินเป็นสิ่งของ</li><li>ระบบเศรษฐกิจมีการออมต่ำ</li><li>รัฐบาลเก็บภาษีได้มากขึ้น</li><li>ดุลการค้าระหว่างประเทศแย่ลง ถ้าเงินเฟ้อในประเทศสูงกว่าต่างประเทศ สินค้าแพงขึ้นในสายตาต่างชาติ ส่งออกได้น้อยลง</li><li>การได้ประโยชน์-เสียประโยชน์ของแต่ละกลุ่มไม่เหมือนกัน</li></ol>
<div class="tbl"><table><tr><th>ได้ประโยชน์จากเงินเฟ้อ</th><th>เสียประโยชน์จากเงินเฟ้อ</th></tr>
<tr><td>ลูกหนี้ · ผู้รับจ้างอิสระ · ธุรกิจ (ผู้ผลิต-จำหน่ายสินค้า) · เจ้าของกิจการ</td><td>เจ้าหนี้ · ผู้มีรายได้ประจำ · ผู้บริโภค (อำนาจซื้อลดลง)</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> เงินเฟ้อทำให้ “เงินในอนาคตมีค่าน้อยลง” คนที่ต้อง<b>จ่าย</b>คืนทีหลัง (ลูกหนี้) ได้เปรียบ คนที่<b>รอรับ</b>เงินคงที่ (เจ้าหนี้ เงินเดือนประจำ) เสียเปรียบ</div>`},
{id:'s6', tag:'การแก้ปัญหาเงินเฟ้อ', title:'แนวทางแก้ปัญหาเงินเฟ้อ', html:`
<p>เป้าหมาย: <b>ควบคุมปริมาณเงินในระบบไม่ให้มากเกินไป</b></p>
<div class="cols"><div class="box"><h4>นโยบายการเงิน</h4><ol class="steps"><li>เพิ่มอัตราเงินสดสำรองตามกฎหมายของธนาคารพาณิชย์</li><li>เพิ่มอัตรารับช่วงซื้อลดตั๋วเงิน</li><li>ขายพันธบัตร</li></ol></div>
<div class="box"><h4>นโยบายการคลัง</h4><ol class="steps"><li>ใช้งบประมาณ<b>เกินดุล</b> (รายจ่าย &lt; รายได้)</li><li>เพิ่มภาษี (ให้ประชาชนมีเงินในมือน้อยลง)</li></ol></div></div>
<p><b>นโยบายอื่น ๆ</b> เพิ่มอุปทาน ควบคุมราคาปัจจัยการผลิตและค่าแรง ควบคุมการบริโภค ควบคุมการให้สินเชื่อ (บัตรเครดิต)</p>`},
{id:'s7', tag:'เงินฝืด', title:'เงินฝืดและแนวทางแก้', html:`
<ul class="dots"><li><b>เงินฝืด</b> คือภาวะที่<b>ระดับราคาสินค้าโดยทั่วไปลดลงเรื่อย ๆ อย่างต่อเนื่อง</b></li><li>เครื่องมือวัดคือ <b>ดัชนีราคา</b></li><li>สาเหตุ: <b>AD น้อยมาก</b> ประชาชนขาดอำนาจซื้อ ปริมาณเงินหมุนเวียนในระบบน้อยเกินไป</li><li>ผลกระทบ: การผลิตและการลงทุนหยุดชะงัก <b>การว่างงานเพิ่มขึ้น</b> เศรษฐกิจขยายตัวช้าหรือตกต่ำ</li></ul>
<p>เป้าหมายการแก้: <b>เพิ่มปริมาณเงินในระบบ</b> (ตรงข้ามกับการแก้เงินเฟ้อ)</p>
<div class="cols"><div class="box"><h4>นโยบายการเงิน</h4><ol class="steps"><li>ลดอัตราเงินสดสำรองตามกฎหมาย</li><li>ลดอัตรารับช่วงซื้อลดตั๋วเงิน</li><li>ซื้อพันธบัตร</li></ol></div>
<div class="box"><h4>นโยบายการคลัง</h4><ol class="steps"><li>ใช้งบประมาณ<b>ขาดดุล</b> (รายจ่าย &gt; รายได้)</li><li>ลดภาษี</li></ol></div></div>
<p><b>นโยบายอื่น ๆ</b> สนับสนุนการบริโภค ผ่อนคลายการให้สินเชื่อ (บัตรเครดิต) จัดหาแหล่งทุนให้ธนาคารพาณิชย์</p>
<div class="memo"><b>เทคนิคจำ</b> เฟ้อ = ดูดเงินออก (เพิ่ม/ขาย/เกินดุล/ขึ้นภาษี) · ฝืด = อัดเงินเข้า (ลด/ซื้อ/ขาดดุล/ลดภาษี)</div>
<div class="trap"><b>จุดที่มักสับสน</b> ธปท. <b>ขาย</b>พันธบัตร = ดึงเงินออกจากระบบ (แก้เงินเฟ้อ) · <b>ซื้อ</b>พันธบัตร = ปล่อยเงินเข้าระบบ (แก้เงินฝืด)</div>`},
{id:'s8', tag:'เงินตึง', title:'ภาวะเงินตึง', html:`
<ul class="dots"><li><b>เงินตึง</b> คือภาวะที่เกิด<b>เงินเฟ้อและการว่างงานขึ้นในขณะเดียวกัน</b> ระดับราคาสูงขึ้น แต่ปริมาณเงินกู้เพื่อดำเนินธุรกิจไม่เพียงพอ</li><li>สาเหตุ: <b>อุปสงค์ของสินเชื่อ &gt; อุปทานของสินเชื่อ</b></li></ul>
<div class="cols"><div class="box"><h4>อุปทานสินเชื่อ (ต่ำ เพราะ)</h4><p>อัตราการออมทรัพย์ต่ำ ปัญหา NPLs สถาบันการเงินขาดสภาพคล่อง การไหลของเงินทุนออกนอกประเทศ ดุลการชำระเงินขาดดุล</p></div><div class="box"><h4>อุปสงค์สินเชื่อ</h4><p>นักธุรกิจกู้มาเพื่อเก็งกำไร หรือลงทุน</p></div></div>
<p><b>ผลกระทบ</b> การลงทุนไม่ขยายตัว/ขาดสภาพคล่อง การผลิตและการจ้างงานลดลง นำไปสู่ภาวะเศรษฐกิจถดถอยได้</p>
<h4>การแก้เงินตึง → ภาวะเงินผ่อนคลาย</h4>

{t:'mc',tag:'เงินฝืด',q:'นโยบายการเงินที่ใช้แก้ปัญหาเงินฝืดคือข้อใด',o:['ลดอัตราเงินสดสำรอง ลดอัตรารับช่วงซื้อลด และซื้อพันธบัตร','เพิ่มอัตราเงินสดสำรองและขายพันธบัตร','ใช้งบประมาณเกินดุล','เพิ่มภาษี'],a:0,e:'แก้เงินฝืด = เพิ่มปริมาณเงิน: ลดเงินสดสำรอง ลดอัตรารับช่วงซื้อลด ซื้อพันธบัตร'},
{t:'mc',tag:'เงินฝืด',q:'นโยบายการคลังที่ใช้แก้ปัญหาเงินฝืดคือข้อใด',o:['งบประมาณขาดดุลและลดภาษี','งบประมาณเกินดุลและเพิ่มภาษี','งบประมาณสมดุล','ขายพันธบัตร'],a:0,e:'แก้เงินฝืดด้วยการคลัง: งบขาดดุล (รายจ่าย > รายได้) และลดภาษีให้ประชาชนมีเงินใช้จ่ายมากขึ้น'},
{t:'mc',tag:'เงินตึง',q:'ภาวะเงินตึงหมายถึงข้อใด',o:['ภาวะที่เกิดเงินเฟ้อและการว่างงานขึ้นในขณะเดียวกัน','ภาวะที่ราคาสินค้าลดลงต่อเนื่อง','ภาวะที่เศรษฐกิจขยายตัวรวดเร็ว','ภาวะที่มีเงินออมมากเกินไป'],a:0,e:'เงินตึงคือภาวะที่เกิดเงินเฟ้อและการว่างงานพร้อมกัน ระดับราคาสูงขึ้นแต่เงินกู้เพื่อดำเนินธุรกิจไม่เพียงพอ'},
{t:'mc',tag:'เงินตึง',q:'สาเหตุของภาวะเงินตึงคือข้อใด',o:['อุปสงค์ของสินเชื่อมากกว่าอุปทานของสินเชื่อ','อุปทานสินเชื่อมากกว่าอุปสงค์สินเชื่อ','อัตราการออมสูงเกินไป','ปริมาณเงินมากเกินไป'],a:0,e:'สาเหตุคืออุปสงค์ของสินเชื่อมีมากกว่าอุปทานของสินเชื่อ'},
{t:'ms',tag:'เงินตึง',q:'ข้อใดทำให้อุปทานของสินเชื่อต่ำ จนเกิดภาวะเงินตึง (เลือกทุกข้อที่ถูก)',o:['อัตราการออมทรัพย์ต่ำ','ปัญหา NPLs','การไหลของเงินทุนออกนอกประเทศ','นักธุรกิจกู้เงินไปลงทุน'],a:[0,1,2],e:'อุปทานสินเชื่อต่ำจาก: ออมต่ำ NPLs สถาบันการเงินขาดสภาพคล่อง เงินทุนไหลออก ดุลชำระเงินขาดดุล ส่วนนักธุรกิจกู้ไปลงทุนเป็นด้านอุปสงค์สินเชื่อ'},
{t:'mc',tag:'เงินตึง',q:'การแก้ปัญหาเงินตึงด้าน “อุปทานของสินเชื่อ” คือข้อใด',o:['เร่งระดมเงินออม และปรับดอกเบี้ยเงินฝากไม่ให้ต่ำเกินไป','ควบคุมการขยายตัวของสินเชื่อ','ควบคุมคุณภาพสินเชื่อ','ลดดอกเบี้ยเงินฝากให้ต่ำที่สุด'],a:0,e:'ด้านอุปทานสินเชื่อ: เร่งระดมเงินออม ปรับดอกเบี้ยเงินฝากไม่ให้ต่ำเกินไป แก้ปัญหาขาดดุลการชำระเงิน'},
{t:'mc',tag:'เงินตึง',q:'ผลลัพธ์ที่ต้องการหลังแก้ปัญหาเงินตึงคือภาวะใด',o:['ภาวะเงินผ่อนคลาย','ภาวะเงินเฟ้อรุนแรง','ภาวะเงินฝืด','ภาวะขาดดุล'],a:0,e:'ตามสไลด์ การแก้ปัญหาด้านอุปทานและอุปสงค์ของสินเชื่อนำไปสู่ภาวะเงินผ่อนคลาย'},
{t:'tf',tag:'เงินตึง',q:'ภาวะเงินตึงอาจนำไปสู่ภาวะเศรษฐกิจถดถอยได้',a:true,e:'ผลกระทบ: การลงทุนไม่ขยายตัว ขาดสภาพคล่อง การผลิตและการจ้างงานลดลง นำไปสู่ภาวะเศรษฐกิจถดถอยได้'},
{t:'match',tag:'เงินตึง',q:'จับคู่ภาวะเศรษฐกิจกับความหมาย',pairs:[['เงินเฟ้อ','ระดับราคาทั่วไปสูงขึ้นต่อเนื่อง'],['เงินฝืด','ระดับราคาทั่วไปลดลงต่อเนื่อง'],['เงินตึง','เงินเฟ้อและการว่างงานเกิดพร้อมกัน']],e:'เฟ้อ = ราคาขึ้น / ฝืด = ราคาลง / ตึง = ราคาขึ้น + ว่างงาน + สินเชื่อไม่พอ'}
],
gens:[
{tag:'ความหมายและการคำนวณเงินเฟ้อ',f:()=>{const y=H.R(2555,2566),a=H.R(1000,1200)/10,ch=H.pick([-1,1,1,1])*H.R(5,90)/10,b=+(a+ch).toFixed(1);const r=(b-a)/a*100,rs=r.toFixed(2);const w1=((b-a)/b*100).toFixed(2),w2=(b-a).toFixed(2),w3=(b/a*100).toFixed(2);return{t:'mc',q:`CPI ปี ${y} = ${a} และปี ${y+1} = ${b} อัตราเงินเฟ้อปี ${y+1} เท่ากับเท่าใด (ทศนิยม 2 ตำแหน่ง)`,o:H.opts(rs+'%',[w1+'%',w2+'%',w3+'%']),a:0,e:`(${b} − ${a}) ÷ ${a} × 100 = ${rs}%${r<0?' (ติดลบ = ระดับราคาลดลง)':''}`}}},
{tag:'ความหมายและการคำนวณเงินเฟ้อ',f:()=>{const base=H.R(20,80),t=base+H.pick([-1,1,1,1])*H.R(1,Math.min(30,base-5));const idx=(t/base*100);if(!Number.isInteger(idx*10))return null;const s=+idx.toFixed(1);return{t:'mc',q:`ตะกร้าสินค้ามีราคาเฉลี่ยปีฐาน ${base} บาท และปีปัจจุบัน ${t} บาท ดัชนีราคาปีปัจจุบันเท่ากับเท่าใด`,o:H.opts(String(s),[String(+(base/t*100).toFixed(1)),String(t-base),String(+(s-100).toFixed(1)),String(+(s+10).toFixed(1))]),a:0,e:`ดัชนีราคา = (${t} ÷ ${base}) × 100 = ${s}`}}},
{tag:'ระดับความรุนแรง',f:()=>{let v=+(H.R(5,350)/10).toFixed(1);if([5,20].includes(v))return null;const g=v<5?'เงินเฟ้ออย่างอ่อน':v<20?'เงินเฟ้อปานกลาง':'เงินเฟ้อรุนแรง';return{t:'mc',q:`ถ้าราคาสินค้าสูงขึ้นเฉลี่ย ${v}% ต่อปี จัดเป็นเงินเฟ้อระดับใด`,o:H.opts(g,['เงินเฟ้ออย่างอ่อน','เงินเฟ้อปานกลาง','เงินเฟ้อรุนแรง']),a:0,e:`อ่อน ≤ 5%, ปานกลาง 5–20%, รุนแรง > 20% → ${v}% = ${g}`}}},
{tag:'ผลกระทบของเงินเฟ้อ',f:()=>{const w=['ลูกหนี้','ผู้รับจ้างอิสระ','ธุรกิจผู้ผลิต-จำหน่ายสินค้า','เจ้าของกิจการ'],l=['เจ้าหนี้','ผู้มีรายได้ประจำ','ผู้บริโภค','พนักงานเงินเดือน (รายได้ประจำ)'];const win=Math.random()<.5,x=H.pick(win?w:l);return{t:'tf',q:`“${x}” เป็นกลุ่มที่ได้ประโยชน์จากภาวะเงินเฟ้อ`,a:win,e:win?`${x} อยู่ในกลุ่มผู้ได้ประโยชน์`:`${x} อยู่ในกลุ่มผู้เสียประโยชน์ เพราะรายรับคงที่แต่ราคาสูงขึ้น`}}},
{tag:'การแก้ปัญหาเงินเฟ้อ',f:()=>{const m=[['เพิ่มอัตราเงินสดสำรองตามกฎหมาย','เงินเฟ้อ'],['เพิ่มอัตรารับช่วงซื้อลดตั๋วเงิน','เงินเฟ้อ'],['ธปท. ขายพันธบัตร','เงินเฟ้อ'],['ใช้งบประมาณเกินดุล','เงินเฟ้อ'],['เพิ่มภาษี','เงินเฟ้อ'],['ควบคุมการให้สินเชื่อบัตรเครดิต','เงินเฟ้อ'],['ลดอัตราเงินสดสำรองตามกฎหมาย','เงินฝืด'],['ลดอัตรารับช่วงซื้อลดตั๋วเงิน','เงินฝืด'],['ธปท. ซื้อพันธบัตร','เงินฝืด'],['ใช้งบประมาณขาดดุล','เงินฝืด'],['ลดภาษี','เงินฝืด'],['ผ่อนคลายการให้สินเชื่อบัตรเครดิต','เงินฝืด'],['เร่งระดมเงินออม','เงินตึง'],['ควบคุมคุณภาพของสินเชื่อ','เงินตึง']];const[x,g]=H.pick(m);return{t:'mc',q:`มาตรการ “${x}” ใช้แก้ปัญหาภาวะใด`,o:H.opts('ภาวะ'+g,['ภาวะเงินเฟ้อ','ภาวะเงินฝืด','ภาวะเงินตึง']),a:0,e:g==='เงินเฟ้อ'?'มาตรการนี้ลดปริมาณเงิน/อำนาจซื้อในระบบ ใช้แก้เงินเฟ้อ':g==='เงินฝืด'?'มาตรการนี้เพิ่มปริมาณเงิน/อำนาจซื้อในระบบ ใช้แก้เงินฝืด':'มาตรการนี้อยู่ในแนวทางแก้เงินตึง (ด้านอุปทาน/อุปสงค์ของสินเชื่อ)'}}},
{tag:'สาเหตุของเงินเฟ้อ',f:()=>{const s=[['ประชาชนมีรายได้เพิ่มและแห่ซื้อสินค้าจนผลิตไม่ทัน','Demand Pull Inflation'],['รัฐแจกเงินจำนวนมาก ความต้องการซื้อพุ่งสูง','Demand Pull Inflation'],['ราคาน้ำมันและค่าแรงสูงขึ้น ผู้ผลิตต้องขึ้นราคาสินค้า','Cost Push Inflation'],['ค่าวัตถุดิบนำเข้าแพงขึ้นมาก ต้นทุนการผลิตเพิ่ม','Cost Push Inflation'],['ความต้องการซื้อเพิ่มขึ้นพร้อมกับต้นทุนวัตถุดิบที่สูงขึ้น','Mixed Inflation']];const[x,g]=H.pick(s);return{t:'mc',q:`สถานการณ์: ${x} เป็นเงินเฟ้อประเภทใด`,o:H.opts(g,['Demand Pull Inflation','Cost Push Inflation','Mixed Inflation','Core Inflation']),a:0,e:`${g==='Demand Pull Inflation'?'ความต้องการซื้อเพิ่ม = อุปสงค์ดึง':g==='Cost Push Inflation'?'ต้นทุนเพิ่ม = อุปทานดัน':'ทั้งอุปสงค์และต้นทุนเพิ่ม'} → ${g}`}}}
]

CH.push({
id:'ch11', num:11, icon:'ship', title:'การค้าระหว่างประเทศ', en:'International Trade',
blurb:'ประโยชน์การค้า ขั้นตอนส่งออก-นำเข้า อัตราแลกเปลี่ยน ดุลการค้า ดุลการชำระเงิน อุปสรรค',
sections:[
{id:'s1', tag:'ความหมายและประโยชน์', title:'ความหมายและประโยชน์ของการค้าระหว่างประเทศ', exam:true, html:`
<p class="lead"><span class="examtag">ออกสอบ</span> <b>การค้าระหว่างประเทศ</b> หมายถึงการแลกเปลี่ยนซื้อขายสินค้าและบริการระหว่างประเทศ ประกอบด้วย <b>การนำเข้า (Import: M)</b> และ<b>การส่งออก (Export: X)</b></p>
<p>สาเหตุที่ต้องนำเข้าและส่งออก: <b>ทุกประเทศไม่สามารถผลิตทุกอย่างได้เอง</b></p>
<h4>ประโยชน์ 6 ข้อ</h4>
<ol class="steps"><li>มีสินค้าสนองความต้องการของประชาชนในแต่ละประเทศเพิ่มขึ้น</li><li>ใช้ทรัพยากรได้เต็มประสิทธิภาพ</li><li>มีการแบ่งงานกันทำ (Division of Labor)</li><li>ทำให้เกิดความชำนาญเฉพาะอย่าง (Specialization)</li><li>ผู้บริโภคซื้อสินค้าราคาถูก คุณภาพสูง</li><li>เกิดการถ่ายทอดเทคโนโลยีทางการผลิต</li></ol>`},
{id:'s2', tag:'ขั้นตอนการส่งออกและนำเข้า', title:'ขั้นตอนการส่งออกและการนำเข้า', html:`
<div class="cols"><div class="box"><h4>ส่งออก: ไทย → สหรัฐอเมริกา</h4><ol class="steps"><li>ไทยส่งออกสินค้ามูลค่า $US 28,571</li><li>รับเงินค่าสินค้า $US 28,571</li><li>นำดอลลาร์ไปแลกที่ ธปท. ได้ 1,000,000 บาท</li><li>เงินสำรองระหว่างประเทศ: <b>+$US 28,571 และ −1,000,000 บาท</b></li></ol></div>
<div class="box"><h4>นำเข้า: จีน → ไทย</h4><ol class="steps"><li>ไทยนำเข้าสินค้า CNY 10,000</li><li>ต้องชำระค่าสินค้าเป็น CNY 10,000</li><li>นำ 53,500 บาท ไปแลก CNY ที่ ธปท.</li><li>เงินสำรองระหว่างประเทศ: <b>−CNY 10,000 และ +53,500 บาท</b></li></ol></div></div>
<div class="memo"><b>เทคนิคจำ</b> ส่งออก = เงินตราต่างประเทศ<b>ไหลเข้า</b> (ทุนสำรองเงินต่างประเทศเพิ่ม) · นำเข้า = เงินตราต่างประเทศ<b>ไหลออก</b></div>`},
{id:'s3', tag:'อัตราแลกเปลี่ยน', title:'อัตราแลกเปลี่ยนเงินตราและระบบอัตราแลกเปลี่ยน', html:`
<p><b>อัตราแลกเปลี่ยน (Foreign Exchange Rate)</b> คือราคาของเงินตราสกุลหนึ่ง 1 หน่วย คิดเทียบในหน่วยของเงินตราอีกสกุลหนึ่ง เช่น 1 $ = 30 ฿ หมายถึง 1 ดอลลาร์มีราคา 30 บาท</p>
<p>เกิดขึ้นเพราะประเทศคู่ค้าใช้สกุลเงินต่างกัน จึงต้องตกลงว่าจะใช้สกุลใดชำระค่าสินค้า</p>
<div class="tbl"><table><tr><th>ระบบ</th><th>ความหมาย</th></tr>
<tr><td>อัตราแลกเปลี่ยนเสรี/ลอยตัว (Flexible / Floating)</td><td>กำหนดจาก<b>ตลาด</b> (อุปสงค์และอุปทานของเงินตราต่างประเทศ) รัฐบาล<b>ไม่แทรกแซง</b></td></tr>
<tr><td>อัตราแลกเปลี่ยนคงที่ (Fixed)</td><td>กำหนดโดย<b>ธนาคารกลาง</b>ของประเทศนั้น ๆ</td></tr>
<tr><td><b>ลอยตัวแบบจัดการ (Managed Float)</b> ← ไทยใช้ปัจจุบัน</td><td>กำหนดโดยอุปสงค์และอุปทาน <b>แต่รัฐเข้าแทรกแซงได้ตามความจำเป็น</b> โดย ธปท. ซื้อขายเงินตราต่างประเทศโดยตรง</td></tr></table></div>
<div class="formula">มูลค่าเป็นบาท = จำนวนเงินตราต่างประเทศ × อัตราแลกเปลี่ยน (บาท/หน่วย)<small>ตัวอย่าง 28,571 $ × 35 ≈ 1,000,000 บาท · 10,000 CNY × 5.35 = 53,500 บาท</small></div>`},
{id:'s4', tag:'ผลของอัตราแลกเปลี่ยน', title:'ผลของอัตราแลกเปลี่ยนต่อส่งออก นำเข้า ดุลการค้า ดุลการชำระเงิน', html:`
<div class="tbl"><table><tr><th></th><th>บาทอ่อนค่า (Baht ↓)</th><th>บาทแข็งค่า (Baht ↑)</th></tr>
<tr><td>การส่งออก (X)</td><td class="up">เพิ่มขึ้น ↑</td><td class="down">ลดลง ↓</td></tr>
<tr><td>การนำเข้า (M)</td><td class="down">ลดลง ↓</td><td class="up">เพิ่มขึ้น ↑</td></tr>
<tr><td>ดุลการค้า</td><td class="up">เกินดุลเพิ่ม / ขาดดุลลด</td><td class="down">เกินดุลลด / ขาดดุลเพิ่ม</td></tr>
<tr><td>ดุลการชำระเงิน</td><td class="up">เพิ่มขึ้น / ขาดดุลลด</td><td class="down">ลดลง / ขาดดุลเพิ่ม</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> “บาทอ่อน ส่งออกรุ่ง” ของไทยถูกลงในสายตาต่างชาติ ขายได้มาก แต่ของนอกแพงขึ้น นำเข้าน้อยลง</div>
<div class="trap"><b>จุดที่มักสับสน</b> บาทอ่อนค่า = ใช้บาท<b>มากขึ้น</b>แลก 1 ดอลลาร์ (เช่น 30 → 35 บาท/$) ตัวเลขเพิ่มขึ้นแต่ค่าเงินบาท<b>ลดลง</b></div>`},
{id:'s5', tag:'ดุลการค้าและดุลการชำระเงิน', title:'ดุลการค้าและดุลการชำระเงิน', html:`
<div class="formula">ดุลการค้า = มูลค่าการส่งออก − มูลค่าการนำเข้า</div>
<div class="tbl"><table><tr><th>สถานะ</th><th>เงื่อนไข</th></tr><tr><td>ขาดดุล</td><td class="num">ส่งออก &lt; นำเข้า</td></tr><tr><td>สมดุล</td><td class="num">ส่งออก = นำเข้า</td></tr><tr><td>เกินดุล</td><td class="num">ส่งออก &gt; นำเข้า</td></tr></table></div>
<p><b>ดุลการชำระเงิน</b> คือผลต่างระหว่างเงินไหลเข้าจากต่างประเทศและเงินไหลออกไปต่างประเทศ (ดูได้จากบัญชีทุนสำรองระหว่างประเทศ)</p>
<div class="formula">ดุลการชำระเงิน = เงินไหลเข้า − เงินไหลออก<small>= รายรับสุทธิจากการค้าระหว่างประเทศ (ดุลการค้า) + รายรับสุทธิจากการกู้ยืมและชำระหนี้ต่างประเทศ + รายรับสุทธิจากเงินโอนหรือเงินช่วยเหลือระหว่างประเทศ</small></div>
<div class="tbl"><table><tr><th>สถานะ</th><th>เงื่อนไข</th></tr><tr><td>ขาดดุล</td><td class="num">รายรับจากต่างประเทศ &lt; รายจ่าย</td></tr><tr><td>สมดุล</td><td class="num">รายรับ = รายจ่าย</td></tr><tr><td>เกินดุล</td><td class="num">รายรับ &gt; รายจ่าย</td></tr></table></div>
<div class="trap"><b>จุดที่มักสับสน</b> ดุลการค้าดูเฉพาะ<b>สินค้า</b> (X − M) ส่วนดุลการชำระเงินกว้างกว่า รวม<b>เงินกู้ ชำระหนี้ และเงินโอน/เงินช่วยเหลือ</b>ด้วย</div>`},
{id:'s6', tag:'อุปสรรคทางการค้า', title:'อุปสรรคทางการค้า', html:`
<p><b>อุปสรรคทางการค้า</b> คือสิ่งที่ทำให้การค้าระหว่างประเทศทำได้ยากลำบากขึ้น แบ่งเป็น 2 แบบ</p>
<div class="cols"><div class="box"><h4>อุปสรรคด้านภาษี (Tariff barriers)</h4><p>ใช้ภาษี เช่น ภาษีนำเข้า</p></div><div class="box"><h4>อุปสรรคที่ไม่ใช่ภาษี (Non-Tariff barriers)</h4><p>มาตรการอื่นที่ไม่ใช่ภาษี</p></div></div>
<h4>สาเหตุของการเกิดอุปสรรคทางการค้า</h4>
<ol class="steps"><li>แก้ปัญหาการขาดดุลการค้าและดุลชำระเงิน</li><li>ปกป้องอุตสาหกรรมภายในประเทศ</li><li>กระตุ้นการจ้างงานภายในประเทศ</li><li>ลดการพึ่งพิงสินค้าจากต่างประเทศ</li></ol>`}
],

blurb:'เขตการค้าเสรี กลุ่มเศรษฐกิจ ASEAN+3/6/8/9 เสาหลัก AEC Blueprint 12 สาขา 8 วิชาชีพ',
sections:[
{id:'s1', tag:'ความร่วมมือทางเศรษฐกิจ', title:'ความหมายของความร่วมมือทางเศรษฐกิจ', html:`
<p class="lead"><b>ความร่วมมือทางเศรษฐกิจและการค้าระหว่างประเทศ</b> คือความพยายามใน<b>การลดข้อกีดกันทางการค้าและการลงทุน</b>ระหว่างประเทศ</p>
<h4>หลักการและเป้าหมาย</h4><ol class="steps"><li>การแก้ไขระบบภาษีศุลกากร</li><li>การจัดตั้งเขตการค้าเสรี</li><li>การเคลื่อนย้ายปัจจัยการผลิตอย่างเสรี</li><li>การกำหนดนโยบายร่วมกัน</li></ol>
<h4>ลักษณะการรวมกลุ่มทางเศรษฐกิจ 5 แบบ</h4><ol class="steps"><li>เขตการค้าเสรี</li><li>สหภาพศุลกากร</li><li>ตลาดร่วม</li><li>สหภาพเศรษฐกิจ</li><li>สหภาพเหนือชาติ</li></ol>`},
{id:'s2', tag:'เขตการค้าเสรีและกลุ่มเศรษฐกิจ', title:'เขตการค้าเสรีและกลุ่มความร่วมมือ', html:`
<p><b>เขตการค้าเสรี</b> คือการทำความตกลงทางการค้า โดยมีเป้าหมาย<b>ลดภาษีศุลกากรระหว่างกันภายในกลุ่ม</b> ให้เหลือน้อยที่สุดหรือเป็นร้อยละศูนย์ และใช้อัตราภาษีปกติที่<b>สูงกว่า</b>กับประเทศนอกกลุ่ม</p>
<p>ในอดีตเขตการค้าเสรีมุ่งเปิดเสรี<b>ด้านสินค้า</b> ระยะหลังรวมไปถึงการเปิดเสรี<b>ด้านอื่น ๆ</b> ด้วย</p>
<h4>ตัวอย่างกลุ่มความร่วมมือ</h4><div class="chips"><span>EU (European Union)</span><span>APEC (Asia-Pacific Economic Cooperation)</span><span>NAFTA (North American Free Trade Agreement: แคนาดา สหรัฐฯ เม็กซิโก)</span><span>ASEAN</span></div>`},
{id:'s3', tag:'ประชาคมอาเซียน', title:'ประชาคมอาเซียน: สมาชิก สัญลักษณ์ คำขวัญ', html:`
<p><b>สำนักเลขาธิการอาเซียน (The ASEAN Secretariat)</b> ตั้งอยู่ที่ <b>กรุงจาการ์ตา อินโดนีเซีย</b></p>
<h4>สมาชิก 10 ประเทศ</h4><div class="chips">${MEM.map(m=>`<span>${m}</span>`).join('')}</div>
<h4>ASEAN+3, 6, 8, 9</h4>
<div class="tbl"><table><tr><th>กลุ่ม</th><th>ประเทศที่เพิ่มจาก ASEAN</th></tr>
<tr><td>ASEAN+3</td><td>จีน ญี่ปุ่น เกาหลีใต้</td></tr>
<tr><td>ASEAN+6</td><td>+3 และ ออสเตรเลีย นิวซีแลนด์ อินเดีย</td></tr>
<tr><td>ASEAN+8</td><td>+6 และ รัสเซีย สหรัฐอเมริกา</td></tr>
<tr><td>ASEAN+9</td><td>+8 และ แคนาดา</td></tr></table></div>
<div class="memo"><b>เทคนิคจำ</b> +3 = “จีน ญี่ปุ่น เกาหลี” (เอเชียตะวันออก) → +6 เติม “ออส นิว อินเดีย” → +8 เติม “รัสเซีย อเมริกา” (มหาอำนาจ) → +9 เติม “แคนาดา”</div>
<h4>สัญลักษณ์อาเซียน (ความหมายของสี)</h4>
<div class="tbl"><table>${COLOR.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</table></div>
<div class="formula">One Vision · One Identity · One Community<small>หนึ่งวิสัยทัศน์ หนึ่งเอกลักษณ์ หนึ่งประชาคม (คำขวัญอาเซียน)</small></div>`},
{id:'s4', tag:'เสาหลักและ AEC Blueprint', title:'เสาหลักของประชาคมอาเซียน และ AEC Blueprint', html:`
<h4>3 เสาหลัก</h4><div class="tbl"><table>${PILLAR.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}</table></div>
<h4>พิมพ์เขียวเพื่อจัดตั้งประชาคมเศรษฐกิจอาเซียน (AEC Blueprint)</h4>
<ol class="steps"><li>การเป็นตลาดและฐานการผลิตเดียวกัน</li><li>การเป็นภูมิภาคที่มีขีดความสามารถในการแข่งขันสูง</li><li>การเป็นภูมิภาคที่มีการพัฒนาทางเศรษฐกิจที่เท่าเทียมกัน</li><li>การเป็นภูมิภาคที่มีการบูรณาการเข้ากับเศรษฐกิจโลก</li></ol>`},
{id:'s5', tag:'12 สาขานำร่องและผู้ประสานงาน', title:'12 สาขานำร่องและประเทศผู้ประสานงานหลัก', html:`
<div class="tbl"><table><tr><th>ประเทศผู้ประสานงาน (Country Coordinators)</th><th>สาขา</th></tr>${COORD.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</table></div>
<p class="muted">12 สาขา: ผลิตภัณฑ์เกษตร (Agro-based) · ประมง (Fisheries) · ผลิตภัณฑ์ยาง (Rubber-based) · สิ่งทอ (Textiles and Apparels) · ยานยนต์ (Automotives) · ผลิตภัณฑ์ไม้ (Wood-based) · อิเล็กทรอนิกส์ (Electronics) · เทคโนโลยีสารสนเทศ (E-ASEAN) · สุขภาพ (Healthcare) · การท่องเที่ยว (Tourism) · การบิน (Air Travel) · โลจิสติกส์ (Logistic)</p>
<div class="memo"><b>เทคนิคจำ</b> ไทย = “เที่ยว + บิน” · สิงคโปร์ = “IT + สุขภาพ” · มาเลเซีย = “ยาง + ผ้า” · อินโดฯ = “รถ + ไม้” · เมียนมาร์ = “เกษตร + ปลา” · ฟิลิปปินส์ = “อิเล็กฯ” · เวียดนาม = “โลจิสติกส์”</div>`},
{id:'s6', tag:'8 วิชาชีพ', title:'การเคลื่อนย้ายเสรีแรงงานมีฝีมือ 8 วิชาชีพ', html:`
